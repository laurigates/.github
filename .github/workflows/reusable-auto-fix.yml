name: Auto-fix Workflow Failures (Reusable)

# Analyzes failed GitHub Actions workflows using Claude Code and either
# auto-fixes the issue (commit + push) or opens a GitHub issue if the
# failure requires manual intervention. A failure that already has an open
# issue gets a comment on that issue instead of a new one (see the
# "Compute failure signature" and "Find existing issue" steps).
#
# Calling workflow should trigger on:
#   workflow_run:
#     workflows: ["CI", "Lint", ...]
#     types: [completed]
#
# The caller must pass workflow_run context as inputs since reusable
# workflows don't have access to the parent's event payload.
#
# Example caller:
#
#   on:
#     workflow_run:
#       workflows: ["CI", "Lint"]
#       types: [completed]
#
#   jobs:
#     auto-fix:
#       if: >-
#         github.event.workflow_run.conclusion == 'failure' &&
#         !startsWith(github.event.workflow_run.head_commit.message, 'fix(auto):') &&
#         (github.event.workflow_run.actor.type != 'Bot' ||
#          github.event.workflow_run.actor.login == 'claude[bot]' ||
#          github.event.workflow_run.actor.login == 'claude') &&
#         github.event.workflow_run.head_branch != 'main' &&
#         github.event.workflow_run.head_branch != 'master'
#       uses: laurigates/.github/.github/workflows/reusable-auto-fix.yml@main
#       with:
#         branch: ${{ github.event.workflow_run.head_branch }}
#         run_id: ${{ github.event.workflow_run.id }}
#         workflow_name: ${{ github.event.workflow_run.name }}
#         head_sha: ${{ github.event.workflow_run.head_sha }}
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch where the workflow failed'
        required: true
        type: string
      run_id:
        description: 'Run ID of the failed workflow'
        required: true
        type: string
      workflow_name:
        description: 'Name of the failed workflow'
        required: true
        type: string
      head_sha:
        description: 'Commit SHA that triggered the failed workflow'
        required: true
        type: string
      pr_number:
        description: 'Associated PR number (auto-detected if not provided)'
        required: false
        type: string
        default: ''
      max_auto_fix_prs:
        description: >-
          Flood guard: once this many issues filed by this workflow are open
          (counted by their signature marker), it stops filing new ones.
          Auto-fixes continue. The name is historical: it once counted PRs,
          which this workflow never opens.
        required: false
        type: number
        default: 2
      auto_fixable_description:
        description: 'Markdown describing auto-fixable failure types for the Claude prompt'
        required: false
        type: string
        default: |
          - Linting errors (formatting, style violations)
          - Missing or malformed configuration files
          - Type errors with obvious fixes
          - Import ordering or unused import issues
          - Conventional commit format violations in PR titles
      not_auto_fixable_description:
        description: 'Markdown describing failures that should become issues instead'
        required: false
        type: string
        default: |
          - GitHub Actions infrastructure failures (runner issues, network timeouts)
          - Permission or token errors
          - External service outages
          - Complex architectural problems requiring design decisions
          - Flaky tests with no clear root cause
          - Issues requiring secrets or credentials changes
          - Failures in workflows not related to code changes on this branch
      claude_args:
        description: 'Additional arguments for Claude Code (e.g., "--model sonnet --max-turns 30")'
        required: false
        type: string
        default: '--model opus --max-turns 50'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      allowed_tools:
        description: >-
          Comma-separated tools passed to --allowedTools, added to the action's own
          defaults. The default covers exactly what the prompt runs: read/edit, the
          git commit-and-push path, and the gh calls for PR comments and issue
          creation. This list USED to sit in `additional_permissions`, where it was
          inert — see the comment at the action step.
        required: false
        type: string
        default: 'Read,Write,Edit,Grep,Glob,Task,Agent,TodoWrite,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git add *),Bash(git commit *),Bash(git push *),Bash(git checkout *),Bash(git branch *),Bash(gh pr *),Bash(gh issue *),Bash(gh run *)'
      additional_allowed_tools:
        description: 'Extra comma-separated tools appended to allowed_tools (replaces the old tool-list use of additional_permissions)'
        required: false
        type: string
        default: ''
      additional_permissions:
        description: >-
          GitHub permissions map forwarded to the action, as "key: value" lines
          (e.g. "actions: read"). NOT a Claude tool list — that is allowed_tools /
          additional_allowed_tools.
        required: false
        type: string
        default: ''
      plugins:
        description: 'Claude Code plugins to load'
        required: false
        type: string
        default: ''
      plugin_marketplaces:
        description: 'Claude Code plugin marketplace URLs'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      PAT_TOKEN:
        description: 'PAT for pushing commits (falls back to GITHUB_TOKEN)'
        required: false

concurrency:
  group: auto-fix-${{ inputs.branch }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout failed branch
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Gather failure context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_CONTEXT_DIR: ${{ runner.temp }}/ci-failure-context
        run: |
          RUN_ID="${{ inputs.run_id }}"
          BRANCH="${{ inputs.branch }}"

          # Save failure context to runner temp dir (auto-cleaned by GitHub)
          mkdir -p "${CI_CONTEXT_DIR}"
          echo "context_dir=${CI_CONTEXT_DIR}" >> "$GITHUB_OUTPUT"

          # Get failed job logs (truncated to last 65536 bytes)
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -c 65536 > "${CI_CONTEXT_DIR}/failure-logs.txt" || echo "Could not retrieve logs" > "${CI_CONTEXT_DIR}/failure-logs.txt"

          # Get structured failed jobs summary
          gh run view "$RUN_ID" --json jobs \
            -q '.jobs[] | select(.conclusion == "failure") | "Job: \(.name)\nStatus: \(.conclusion)\nSteps:\n" + ([.steps[] | select(.conclusion == "failure") | "  - \(.name): \(.conclusion)"] | join("\n"))' \
            > "${CI_CONTEXT_DIR}/failed-jobs.txt" 2>/dev/null || echo "Could not retrieve job details" > "${CI_CONTEXT_DIR}/failed-jobs.txt"

          # Find associated PR number (use input if provided, otherwise detect)
          PR_NUMBER="${{ inputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # Check if we already have a recent auto-fix commit on this branch
          RECENT_FIX=$(git log --oneline -5 --format='%s' | grep -c 'fix(auto):\|fix:.*resolve CI failure' || true)
          echo "recent_fix_count=$RECENT_FIX" >> "$GITHUB_OUTPUT"

      # Fingerprint the failure so a later run can recognise it as one already
      # filed. Deterministic bash + jq over the log saved above; the agent
      # neither sees nor chooses the signature.
      #
      # The line it hashes, in order of preference: the first failing
      # pre-commit hook id; else the first `##[error]` that is not the
      # runner's generic "Process completed with exit code N"; else the last
      # exception-shaped line ("...Error: ...") before that exit line.
      # `--log-failed` prefixes every line with job, step and timestamp
      # columns, and the step column alone reads "UNKNOWN STEP" or "Set up
      # job" for the same failure, so all three are dropped. Run/job ids,
      # SHAs, `0x` addresses, timestamps, UUIDs, runner paths and the branch
      # name are then normalised out. signature = sha256("<workflow>|<line>")[0:12].
      # No line means no signature, which switches dedup off for the run. The
      # normalised line is also an output, so the issue comment can show it.
      #
      # .github/tests/auto-fix-dedup/run.sh runs this body against real logs.
      - name: Compute failure signature
        id: signature
        env:
          CONTEXT_DIR: ${{ steps.context.outputs.context_dir }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          log="${CONTEXT_DIR}/failure-logs.txt"
          picked=""
          if [ -s "$log" ]; then
            picked="$(jq -Rrs --arg branch "$BRANCH" '
              def msg:
                sub("^[^\t]*\t[^\t]*\t"; "")
                | sub("^\\x{FEFF}"; "")
                | sub("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?"; "")
                | gsub("\u001b\\[[0-9;]*[A-Za-z]"; "")
                | gsub("\r"; "");
              def generic:
                test("^##\\[error\\](Process completed with exit code [0-9]+|The operation was canceled)\\.?$");
              # The branch is replaced only as a whole token: a substring
              # replace would rewrite every "a" for a branch named "a".
              def norm:
                (if $branch == "" then .
                 else gsub("(?<![A-Za-z0-9._-])"
                           + ($branch | gsub("(?<c>[.+*?(){}$|^\\\\\\[\\]])"; "\\\(.c)"))
                           + "(?![A-Za-z0-9._-])"; "<branch>")
                 end)
                | gsub("[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z?"; "<ts>")
                | gsub("\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b"; "<uuid>")
                | gsub("/home/runner/work/[^_/\\s][^/\\s]*/[^/\\s]+/"; "")
                | gsub("(/home/runner|/Users/runner|/tmp|/private/var/folders|/var/folders|/opt/hostedtoolcache|/__w)/[^\\s\\x27\",:)]*"; "<path>")
                | gsub("\\b0x[0-9a-fA-F]+"; "<addr>")
                | gsub("\\b[0-9a-f]{7,}\\b"; "<id>")
                | gsub("\\s+"; " ")
                | sub("^ "; "")
                | sub(" $"; "");
              [splits("\n") | msg] as $l
              | ($l | length) as $n
              | (first(range($n) | select($l[.] | generic)) // $n) as $end
              | (first(range($n) | select($l[.] | test("\\.{3,}Failed$"))) // null) as $hook
              | (first($l[] | select(startswith("##[error]") and (generic | not))) // null) as $err
              | (last($l[:$end][] | select(test("(^|[^A-Za-z0-9_])([A-Za-z_][A-Za-z0-9_.]*)?(Error|Exception): "))) // null) as $exc
              | if $hook != null then
                  ((($l[$hook + 1] // "") | capture("^- hook id: (?<id>\\S+)").id)
                    // ($l[$hook] | sub("\\s*\\.{3,}Failed$"; "")))
                  | "hook\tpre-commit hook failed: \(norm)"
                elif $err != null then "error\t\($err | ltrimstr("##[error]") | norm)"
                elif $exc != null then "exception\t\($exc | norm)"
                else empty
                end
            ' "$log")"
          fi

          signature=""
          src=none
          line=""
          if [ -n "$picked" ]; then
            src="${picked%%$'\t'*}"
            line="${picked#*$'\t'}"
            signature="$(printf '%s|%s' "$WORKFLOW_NAME" "$line" | sha256sum | cut -c1-12)"
          fi
          {
            echo "signature=${signature}"
            echo "source=${src}"
            # Single-line by construction: norm collapses every whitespace run.
            echo "line=${line}"
          } >> "$GITHUB_OUTPUT"
          echo "Signature: ${signature:-<none, dedup off>} (source: ${src})"
          # Prefixed, so a line lifted from the failed run can never start with
          # `::` and be read as a workflow command in this job.
          echo "Signature input: ${line}"

      # Look for an open issue this failure was already filed as, before the
      # agent runs. The signature travels in the issue body as a hidden marker,
      # `<!-- auto-fix-signature: <sig> -->`, so the lookup needs neither a
      # label nor search: `gh issue list` without --search reads the
      # repository's issue listing (GraphQL `repository.issues`), which shows
      # an issue as soon as it exists, while the search index lags creation.
      # The oldest matching issue wins, and gets a comment linking this run
      # and quoting the hashed line, so a reader can judge the grouping.
      #
      # This is also the flood guard. The old guard counted open PRs from
      # `auto-fix/*` branches; this workflow never opens one (it pushes to the
      # failing branch), so the guard could not fire. It now counts open issues
      # that carry a well-formed marker, and at max_auto_fix_prs it pauses
      # issue CREATION only, so an auto-fixable failure is still fixed.
      #
      # The outcome reaches the prompt as `directive`, which replaces the old
      # unconditional "create an issue" instruction.
      - name: Find existing issue for this failure
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURE: ${{ steps.signature.outputs.signature }}
          SIGNATURE_INPUT: ${{ steps.signature.outputs.line }}
          MAX_OPEN: ${{ inputs.max_auto_fix_prs }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ inputs.branch }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          set -euo pipefail
          case "$MAX_OPEN" in
            ''|*[!0-9]*)
              echo "::error::max_auto_fix_prs must be a non-negative integer, got '${MAX_OPEN}'"
              exit 1 ;;
          esac
          if [ -n "$SIGNATURE" ] && ! [[ "$SIGNATURE" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::unexpected failure signature '${SIGNATURE}'"
            exit 1
          fi
          case "$PR_NUMBER" in ''|*[!0-9]*) PR_NUMBER='' ;; esac

          marker_prefix='<!-- auto-fix-signature: '
          if ! issues="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,body)" \
             || ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$issues"; then
            echo "::warning::Could not list open issues, so this run cannot match its failure to one already filed."
            issues='[]'
          fi
          # A well-formed marker only: an issue that quotes the marker's shape,
          # e.g. one discussing this workflow, is not an auto-fix issue.
          open_count="$(jq '[.[] | select((.body // "") | test("<!-- auto-fix-signature: [0-9a-f]{12} -->"))] | length' <<<"$issues")"
          match=""
          if [ -n "$SIGNATURE" ]; then
            match="$(jq -r --arg m "${marker_prefix}${SIGNATURE} -->" \
              '[.[] | select((.body // "") | contains($m)) | .number] | min // empty' <<<"$issues")"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          if [ -n "$match" ]; then
            mode=existing
            pr_ref=none
            if [ -n "$PR_NUMBER" ]; then pr_ref="#${PR_NUMBER}"; fi
            # The hashed line goes in an indented code block, so log text
            # cannot render as Markdown, @-mention anyone or link an issue.
            shown="${SIGNATURE_INPUT:-}"
            shown="${shown:0:300}"
            # shellcheck disable=SC2016 # the backticks are Markdown code spans
            body="$(printf 'A failure with the same signature (`%s`) occurred again. The log line it was computed from:\n\n    %s\n\n- Run: %s\n- Workflow: %s\n- Branch: `%s`\n- PR: %s\n' \
              "$SIGNATURE" "$shown" "$run_url" "$WORKFLOW_NAME" "$BRANCH" "$pr_ref")"
            if gh issue comment "$match" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; then
              echo "Matched open issue #${match}; commented with this run."
            else
              echo "::warning::Matched open issue #${match} but could not comment on it; no new issue will be filed."
            fi
          elif [ "$open_count" -ge "$MAX_OPEN" ]; then
            mode=capped
            echo "::warning::Issue creation paused: ${open_count} open auto-fix issue(s), limit ${MAX_OPEN} (max_auto_fix_prs)."
          else
            mode=create
          fi

          if [ -n "$PR_NUMBER" ]; then
            pr_comment="\`gh pr comment ${PR_NUMBER} --body \"...\"\`"
          fi
          case "$mode" in
            existing)
              directive="$(printf '%s\n' \
                "Issue #${match} already tracks this failure: its body carries the failure signature of this run (\`${SIGNATURE}\`), and this workflow has already commented on it with a link to this run. Read it first (\`gh issue view ${match} --comments\`); it may already name the cause or the fix." \
                "" \
                "1. Do NOT create a new issue." \
                "2. If your analysis finds something #${match} does not say yet, add it there: \`gh issue comment ${match} --body \"...\"\`")"
              if [ -n "$PR_NUMBER" ]; then
                directive+=$'\n'"3. Comment on PR #${PR_NUMBER} linking #${match}: ${pr_comment}"
              fi
              ;;
            capped)
              directive="Issue creation is paused: ${open_count} issues filed by this workflow are open, and the limit (input max_auto_fix_prs) is ${MAX_OPEN}. Do NOT create an issue."
              if [ -n "$PR_NUMBER" ]; then
                directive+=$'\n\n'"Put your analysis in a comment on PR #${PR_NUMBER} instead: ${pr_comment}"
              else
                directive+=$'\n\n'"There is no associated PR; put your analysis in your final response."
              fi
              ;;
            create)
              directive="$(printf '%s\n' \
                "1. Check that no open issue already covers this root cause. The signature lookup found no match, but issues filed before this workflow added signatures carry no marker, so check the titles too: \`gh issue list --state open --limit 100 --json number,title\`" \
                "   If one describes the same root cause, comment on it with this run's details (\`gh issue comment <number> --body \"...\"\`) and do not create a new issue." \
                "2. Otherwise create a GitHub issue with detailed analysis:" \
                "   \`\`\`" \
                "   gh issue create \\" \
                "     --title \"CI failure: <brief description of the problem>\" \\" \
                "     --body \"<detailed analysis with logs, root cause, and suggested manual steps>\" \\" \
                "     --label \"bug,ci-failure\"" \
                "   \`\`\`" \
                "   If a label cannot be applied, omit --label and name the suggested labels in the body.")"
              if [ -n "$SIGNATURE" ]; then
                directive+=$'\n'"$(printf '%s\n' \
                  "   End the body with the following line, exactly as written and on a line of its own. It is hidden when rendered, and it is how the next run of this workflow finds the issue:" \
                  "" \
                  "   <!-- auto-fix-signature: ${SIGNATURE} -->")"
              fi
              if [ -n "$PR_NUMBER" ]; then
                directive+=$'\n'"3. Comment on PR #${PR_NUMBER} linking the issue: ${pr_comment}"
              fi
              ;;
          esac

          {
            echo "mode=${mode}"
            echo "issue_number=${match}"
            echo "open_auto_fix_issues=${open_count}"
            echo "directive<<AUTO_FIX_DIRECTIVE_EOF"
            printf '%s\n' "$directive"
            echo "AUTO_FIX_DIRECTIVE_EOF"
          } >> "$GITHUB_OUTPUT"

      # `gh issue create --label <unknown>` hard-fails, and `ci-failure` does
      # not exist in a repo until something creates it: in laurigates/dotfiles
      # 7 of the 8 duplicate issues were filed with no label at all.
      # Create-if-missing, not --force, so a repo's own `bug` label keeps its
      # colour; same shape as reusable-changelog-review.yml. A label that
      # cannot be provisioned is a warning: the directive tells the agent to
      # drop --label, and the dedup marker does not depend on labels.
      - name: Ensure issue labels exist
        if: steps.existing.outputs.mode == 'create' && steps.context.outputs.recent_fix_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL_COLOR: 'd73a4a'
        run: |
          set -uo pipefail
          for label in bug ci-failure; do
            case "$label" in
              bug) description="Something isn't working" ;;
              *) description="CI failure reported by the auto-fix workflow" ;;
            esac
            if out="$(gh label create "$label" --repo "$GITHUB_REPOSITORY" \
                        --color "$LABEL_COLOR" --description "$description" 2>&1)"; then
              echo "created label: $label"
            elif printf '%s' "$out" | grep -qi 'already exists'; then
              echo "label present: $label"
            else
              echo "::warning::could not provision label '$label': $out"
            fi
          done

      - name: Skip if already attempted fix
        if: steps.context.outputs.recent_fix_count != '0'
        run: |
          echo "::notice::Skipping auto-fix - a recent fix commit already exists on this branch. Manual intervention may be needed."
          echo "Recent commits:"
          git log --oneline -5

      - name: Analyze and fix with Claude
        if: steps.context.outputs.recent_fix_count == '0'
        uses: anthropics/claude-code-action@v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],claude"
          # The tool boundary belongs in `--allowedTools`. It used to sit in
          # `additional_permissions:`, but that input takes a GitHub permissions
          # MAP ("actions: read"), not a Claude tool list — so the list was inert,
          # the action's default policy denied the `git commit`/`git push` and
          # `gh issue create` this prompt exists to run, and the SDK EXITS 0 on a
          # permission denial. A run therefore went green having fixed nothing.
          # Same defect, same fix as reusable-changelog-review.yml; the shape here
          # mirrors reusable-claude.yml, which had it right all along.
          #
          # --allowedTools is ADDITIVE over the action's defaults, so this widens
          # rather than restricts. `allowed_tools` is a separate input from
          # `claude_args` on purpose: a caller overriding claude_args (to change
          # --model or --max-turns) must not silently drop the tool grant.
          #
          # Task and Agent are both listed: Agent is the current subagent tool,
          # Task the legacy name, and an unmatched name is simply never used.
          # Naming TodoWrite is a real grant — since 2.1.233 the todo/task tools
          # are off by default on current models and listing one is the opt-in.
          #
          # Outside `create` mode (the failure already has an open issue, or
          # issue creation is paused) `--disallowedTools` denies issue creation
          # outright instead of relying on the directive alone. Deny rules are
          # evaluated before allow rules, so this beats `Bash(gh issue *)`, and
          # the action accumulates repeated --disallowedTools from a caller's
          # claude_args. `gh issue new` is an alias of `gh issue create`.
          claude_args: >-
            ${{ inputs.claude_args }}
            --allowedTools "${{ inputs.allowed_tools }}${{ inputs.additional_allowed_tools && format(',{0}', inputs.additional_allowed_tools) || '' }}"
            ${{ steps.existing.outputs.mode != 'create' && '--disallowedTools "Bash(gh issue create *),Bash(gh issue new *)"' || '' }}
          prompt: |
            A GitHub Actions workflow has failed on branch `${{ inputs.branch }}`.
            Your job is to analyze the failure, determine if it can be auto-fixed, and either fix it or open an issue.

            ## Failure Details

            - **Workflow:** ${{ inputs.workflow_name }}
            - **Branch:** ${{ inputs.branch }}
            - **Run ID:** ${{ inputs.run_id }}
            - **Commit:** ${{ inputs.head_sha }}
            - **Associated PR:** ${{ steps.context.outputs.pr_number }}

            ## Step 1: Read the failure logs

            Read the file `${{ steps.context.outputs.context_dir }}/failed-jobs.txt` for a summary of which jobs and steps failed.
            Read the file `${{ steps.context.outputs.context_dir }}/failure-logs.txt` for the detailed failure output.

            ## Step 2: Analyze the failure

            Determine the root cause. Common failure types:

            **Auto-fixable (you should fix these):**
            ${{ inputs.auto_fixable_description }}

            **NOT auto-fixable (open an issue instead):**
            ${{ inputs.not_auto_fixable_description }}

            ## Step 3: Take action

            ### If auto-fixable:
            1. Read the relevant source files to understand the issue
            2. Make the necessary fixes
            3. Stage and commit the changes:
               ```
               git add <specific-files>
               git commit -m "fix(auto): resolve CI failure in ${{ inputs.workflow_name }}"
               ```
            4. Push to the branch: `git push origin ${{ inputs.branch }}`
            5. If PR ${{ steps.context.outputs.pr_number }} exists, comment on it:
               ```
               gh pr comment ${{ steps.context.outputs.pr_number }} --body "Auto-fix applied for CI failure in **${{ inputs.workflow_name }}**. The workflow should re-run automatically."
               ```

            ### If NOT auto-fixable:
            ${{ steps.existing.outputs.directive }}

            ## Important rules
            - Read the project rules in `.claude/rules/` or `CLAUDE.md` for commit format and code standards
            - Do NOT amend existing commits - always create new commits
            - Only fix issues directly related to the CI failure
            - Do not make unrelated improvements or refactoring
            - If unsure whether something is fixable, err on the side of opening an issue
          # A real GitHub permissions map now. `actions: read` is what lets
          # Claude read CI results — the whole point of this workflow — and the
          # job-level `permissions:` above already grants it.
          additional_permissions: |
            actions: read
            ${{ inputs.additional_permissions }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
