name: Claude Code Review (Reusable)

# Automated PR review using Claude Code. Reviews every PR for code quality,
# potential bugs, security issues, test coverage, and documentation needs.
# Skips release-please PRs and bot actors by default, and skips green PRs
# authored by skip_authors or touching only skip_paths (Claude config).
#
# Calling workflow should trigger on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#
# Example caller:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     review:
#       uses: laurigates/.github/.github/workflows/reusable-claude-review.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      skip_release_please:
        description: 'Skip review on release-please PRs'
        required: false
        type: boolean
        default: true
      skip_bots:
        description: 'Skip review when PR author is github-actions[bot]'
        required: false
        type: boolean
        default: true
      review_prompt:
        description: 'Custom review prompt (replaces default)'
        required: false
        type: string
        default: ''
      claude_args:
        description: 'Additional arguments for Claude Code'
        required: false
        type: string
        default: '--model opus --max-turns 50'
      allowed_bots:
        description: 'Comma-separated bot usernames allowed to trigger the review'
        required: false
        type: string
        default: 'claude[bot],claude'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      allowed_tools:
        description: >-
          Comma-separated tools passed to --allowedTools, added to the action's own
          defaults. Review is read-only work, so the default grants exploration,
          read-only git, and `gh pr` — no Write/Edit, no push. This list USED to sit
          in `additional_permissions`, where it was inert — see the comment at the
          action step.
        required: false
        type: string
        default: 'Read,Grep,Glob,Task,Agent,TodoWrite,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(gh pr *)'
      additional_allowed_tools:
        description: 'Extra comma-separated tools appended to allowed_tools (replaces the old tool-list use of additional_permissions)'
        required: false
        type: string
        default: ''
      additional_permissions:
        description: >-
          GitHub permissions map forwarded to the action, as "key: value" lines
          (e.g. "actions: read").
          NOT a Claude tool list — that is allowed_tools / additional_allowed_tools.
        required: false
        type: string
        default: ''
      plugins:
        description: 'Claude Code plugins to load'
        required: false
        type: string
        default: ''
      plugin_marketplaces:
        description: 'Claude Code plugin marketplace URLs'
        required: false
        type: string
        default: ''
      skip_authors:
        description: >-
          PR authors whose pull requests Claude does not run on, comma- or
          newline-separated, compared case-insensitively with the [bot] suffix
          included. Checked against the PR author, not the actor, so a human
          reopening or pushing to such a PR does not start a run. The default
          is the claude-config-sync App, whose PRs touch only Claude config
          (laurigates/gitops#341). '' disables the check
        required: false
        type: string
        default: 'laurigates-claude-config-sync[bot]'
      skip_paths:
        description: >-
          Bash patterns, comma- or newline-separated, for files that never
          need Claude; '*' (and so '**') matches across '/'. A PR whose every
          changed file matches one is skipped. Setting this replaces the
          default list; '' disables the check
        required: false
        type: string
        default: |
          .claude/**
          .mcp.json
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  # Required for the action's github_ci MCP server (CI status, run details, job
  # logs). On a PR in tag mode the action probes this job's GITHUB_TOKEN with
  # listWorkflowRunsForRepo and skips the server on a 403, logging "The github_ci
  # MCP server requires 'actions: read' permission". The probe uses github.token,
  # not the App token, so `additional_permissions` cannot substitute for this.
  actions: read

jobs:
  review:
    if: >-
      (!inputs.skip_release_please || !startsWith(github.head_ref, 'release-please--')) &&
      (!inputs.skip_bots || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # Skips green, before checkout and before Claude, a PR whose author is
      # in skip_authors or whose every changed file matches skip_paths. The
      # files come from the API (pull-requests: read, granted above), so
      # nothing is checked out first. Values reach the script through env:
      # only. The run: body is identical in reusable-claude.yml; the
      # claude-cost-guard test extracts and runs both.
      - name: Check PR author and changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SKIP_AUTHORS: ${{ inputs.skip_authors }}
          SKIP_PATHS: ${{ inputs.skip_paths }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice title=Claude skipped::$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Not a pull request (an @claude on a plain issue): nothing here applies.
          if [ -z "${PR:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error title=Claude::the event carries no usable PR number"
            exit 1
          fi
          # entries <input>: one entry per line from a comma- or newline-separated
          # input, trimmed, with blank entries and '#' comments dropped.
          entries() {
            local e
            while IFS= read -r e; do
              e="${e#"${e%%[![:space:]]*}"}"
              e="${e%"${e##*[![:space:]]}"}"
              case "$e" in '' | '#'*) continue ;; esac
              printf '%s\n' "$e"
            done < <(printf '%s\n' "$1" | tr ',' '\n')
          }
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          # The author, not the actor: a human reopening or pushing to the sync PR
          # is the actor, and the PR is still the App's. A login is [A-Za-z0-9-]
          # plus the [bot] suffix; anything else is dropped before it reaches a
          # workflow command.
          author="$(printf '%s' "${AUTHOR:-}" | tr -cd 'A-Za-z0-9_.[]-')"
          if [ -n "$author" ]; then
            while IFS= read -r who; do
              if [ "$(lower "$who")" = "$(lower "$author")" ]; then
                skip "the PR author '$author' is listed in skip_authors"
              fi
            done < <(entries "${SKIP_AUTHORS:-}")
          fi

          patterns="$(entries "${SKIP_PATHS:-}")"
          if [ -z "$patterns" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          listing="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" | jq -s 'add // []')"
          total="$(jq 'length' <<< "$listing")"
          # A rename also takes previous_filename out of the reviewed tree, so the
          # old path must match skip_paths as well as the new one.
          names="$(jq -r '.[] | .filename, (.previous_filename // empty)' <<< "$listing")"
          kept=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            matched=false
            while IFS= read -r pat; do
              # shellcheck disable=SC2053 # $pat is a pattern on purpose; '*' crosses '/'
              if [[ "$f" == $pat ]]; then matched=true; break; fi
            done <<< "$patterns"
            [ "$matched" = true ] || kept=$((kept + 1))
          done <<< "$names"
          # The files API lists at most 3000 files, so a list that long cannot prove
          # that every file matched. An empty list proves nothing either.
          if [ "$total" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$kept" -eq 0 ]; then
            skip "every changed file ($total) matches skip_paths"
          fi
          echo "$kept path(s) in $total changed file(s) fall outside skip_paths."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        if: steps.gate.outputs.run == 'true'

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          track_progress: true
          prompt: |
            ${{ inputs.review_prompt || 'Review this pull request. Focus on:
            - Code quality and best practices
            - Potential bugs or security issues
            - Test coverage gaps
            - Documentation needs

            IMPORTANT: Use built-in tools (Read, Grep, Glob) for file exploration.
            Do NOT use Bash for find/grep operations - use the dedicated tools instead.' }}
          # The tool boundary belongs in `--allowedTools`. It used to sit in
          # `additional_permissions:`, but that input takes a GitHub permissions
          # MAP ("actions: read"), not a Claude tool list, so the list was inert.
          # Review survived on the action's default policy where the triage and
          # auto-fix workflows did not — those need `gh`/`git` writes, and the SDK
          # exits 0 on a permission denial, so they went green having done nothing.
          # Converted here too so the declaration matches what is actually granted.
          #
          # --allowedTools is ADDITIVE over the action's defaults, so this widens
          # rather than restricts. `allowed_tools` is a separate input from
          # `claude_args` on purpose: a caller overriding claude_args must not
          # silently drop the tool grant.
          claude_args: >-
            ${{ inputs.claude_args }}
            --allowedTools "${{ inputs.allowed_tools }}${{ inputs.additional_allowed_tools && format(',{0}', inputs.additional_allowed_tools) || '' }}"
          # A real GitHub permissions map now — pass-through only. The github_ci
          # server reads the job token, which the `permissions:` block above grants.
          additional_permissions: ${{ inputs.additional_permissions }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        if: steps.gate.outputs.run == 'true'
