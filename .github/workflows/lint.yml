name: Lint workflows

# This repo ships eight reusable workflows that every consuming repo calls at
# `@main` with no pinning, and until now nothing verified they even parse.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # ubuntu-slim carries bash, Node, python3, gcc, git, gh, jq, yq, curl and
    # the cloud CLIs — and nothing else. No Docker daemon, so the actionlint
    # Docker action cannot be used here; download the pinned release binary
    # instead, the same tool `just lint` runs via aqua.
    #
    # The YAML check runs on `yq`, which slim ships, NOT on
    # `python3 -c "import yaml"`: PyYAML is not stdlib and slim does not carry
    # it, so the Python form would abort this job on its first step and take
    # every PR to this repo red. `just lint` runs the same yq command, so a
    # local pass and a CI pass mean the same thing.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            yq -e 'tag == "!!map"' "$f" >/dev/null
          done
          echo "All workflow files are valid YAML."

      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          # -shellcheck= matches `just lint`: shellcheck's style findings on
          # run: bodies are accepted pre-existing noise.
          /tmp/actionlint -shellcheck= -oneline .github/workflows/*.yml

      - name: Publish-block drift check
        run: bash scripts/check-publish-drift.sh 8

      - name: Renderer fixtures
        run: bash .github/tests/publish-findings/run.sh

      # Every --json-schema analysis workflow: the analyze step is
      # continue-on-error and the extracted 'Classify analysis outcome' step
      # turns a missing structured_output green and every real failure red.
      - name: Analysis verdict fixtures
        run: bash .github/tests/analysis-verdict/run.sh

      # Schema, prompt and gate contract of the same workflows, read with yq.
      - name: Analysis contract
        run: bash .github/tests/analysis-contract/run.sh

      # The same workflows on a trigger claude-code-action rejects (push):
      # the extracted 'Check trigger is supported' step must refuse it and
      # every step up to the analysis must be gated on its output (#63).
      - name: Event-guard fixtures
        run: bash .github/tests/event-guard/run.sh

      # Real failure logs through reusable-auto-fix.yml's signature and
      # issue-lookup steps: one failure must map to one signature.
      - name: Auto-fix dedup fixtures
        run: bash .github/tests/auto-fix-dedup/run.sh

      # The merge-retry step of reusable-auto-merge-image-updater.yml, extracted
      # and run against a stub gh that reproduces the base-moved race.
      - name: Auto-merge retry
        run: bash .github/tests/auto-merge-retry/run.sh

      # reusable-changelog-review.yml's publish step, extracted and run against
      # a stub gh: one tracking issue per run, labels read back, never retried.
      - name: Changelog-review publish harness
        run: bash .github/tests/changelog-review-publish/run.sh

      # The same workflow's token-usage step, extracted and run against SDK
      # execution-file fixtures: numbers only, deduplicated by message.id.
      - name: Changelog-review usage harness
        run: bash .github/tests/changelog-review-usage/run.sh

      # reusable-auto-resolve-conflicts.yml's steps from all four jobs,
      # extracted and run in sequence against real git fixtures and a stub gh:
      # a stacked PR is commented on, never merged; a merge that fails the
      # checks or build-command is never pushed; only `publish` can push.
      - name: Auto-resolve-conflicts fixtures
        run: bash .github/tests/auto-resolve-stacked/run.sh
