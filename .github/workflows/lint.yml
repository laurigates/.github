name: Lint workflows

# This repo ships reusable workflows that every consuming repo calls at
# `@main` with no pinning, so a broken file on main breaks its callers on
# their next run. This job is the gate in front of main: YAML validity,
# actionlint, the publish-block drift check, a scratch-dir rulesync generate,
# and every test under .github/tests/. `just lint`, `just rules-check` and
# `just test` run the same commands locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # ubuntu-slim carries bash, Node/npm, python3, gcc, git, gh, jq, yq, curl
    # and the cloud CLIs — and nothing else. No Docker daemon, so the
    # actionlint Docker action cannot be used here; download the pinned
    # release binary instead, the same version `just lint` runs via aqua.
    #
    # The YAML check runs on `yq`, which slim ships, NOT on
    # `python3 -c "import yaml"`: PyYAML is not stdlib and slim does not carry
    # it, so the Python form would abort this job on its first step and take
    # every PR to this repo red. `just lint` runs the same yq command, so a
    # local pass and a CI pass mean the same thing.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            yq -e 'tag == "!!map"' "$f" >/dev/null
          done
          echo "All workflow files are valid YAML."

      - name: actionlint
        # ACTIONLINT_VERSION must equal the justfile's actionlint_version
        # (tool-pins checks it). A bump also needs the new ACTIONLINT_SHA256:
        #   curl -fsSL <release asset url> | sha256sum
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          # -shellcheck= matches `just lint`: shellcheck's style findings on
          # run: bodies are accepted pre-existing noise.
          /tmp/actionlint -shellcheck= -oneline .github/workflows/*.yml

      - name: Publish-block drift check
        run: bash scripts/check-publish-drift.sh 8

      # This repo commits no generated rule copies, and generate must never
      # run at the root: CLAUDE.md is one of its targets. So the rule sources
      # are copied into a scratch repo and generated there, with the same
      # rulesync version reusable-sync-ai-rules.yml ships to consumers
      # (tool-pins checks they agree). A schema hard-fail (a removed target
      # such as geminicli, in rulesync.jsonc or rule frontmatter) fails here,
      # and so does a version that exits 0 without writing one Claude rule
      # per source (every rule here targets claudecode).
      # `just rules-check` runs this body.
      - name: rulesync generate (scratch copy)
        run: |
          set -euo pipefail
          src=$PWD
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp -R "$src/rulesync.jsonc" "$src/.rulesync" "$work/"
          cd "$work"
          git init -q .
          npx --yes rulesync@40.2.0 generate
          n=$(find .rulesync/rules -name '*.md' | wc -l)
          got=0
          [ ! -d .claude/rules ] || got=$(find .claude/rules -name '*.md' | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no rule sources under .rulesync/rules"; exit 1; }
          [ "$got" -eq "$n" ] || { echo "::error::rulesync generated $got .claude/rules/*.md file(s) for $n rule source(s)"; exit 1; }
          echo "rulesync: generated $got Claude rule file(s) from $n source(s)."

      # Every .github/tests/<name>/run.sh, discovered, so a new test cannot
      # be left out of CI. A test passes only if it exits 0 and its last line
      # starts with "PASS: " (see .github/tests/README.md).
      - name: Workflow tests
        run: bash .github/tests/run.sh
