name: Auto-merge Image Updater PRs (Reusable)

# Called from push-triggered workflows on image-updater/* branches.
# Creates the PR, approves, and enables auto-merge in a single job to avoid
# GITHUB_TOKEN anti-recursion: actions using GITHUB_TOKEN don't trigger new
# workflow runs, so a two-job design (push → create PR → pull_request → merge)
# never fires the second job.
#
# Calling workflow should trigger on:
#   push:
#     branches:
#       - 'image-updater-**'

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method: merge, squash, or rebase'
        required: false
        type: string
        default: 'squash'
      pr-title:
        description: 'Pull request title'
        required: false
        type: string
        default: 'build: automatic image update'
      app-id:
        description: 'GitHub App ID. When set, generates an App installation token (via APP_PRIVATE_KEY) for PR creation/approval instead of AUTO_MERGE_PAT.'
        required: false
        type: string
        default: ''
    secrets:
      AUTO_MERGE_PAT:
        description: 'PAT for approving the PR (needs a different user from the PR author). Required when app-id is empty and branch protection requires an approval.'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App private key. Required when app-id is set.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "${{ inputs.pr-title }}" \
            --body "Automated image update by argocd-image-updater.

          Branch: \`${{ github.ref_name }}\`" \
            2>&1) || true

          if echo "$PR_URL" | grep -q "already exists"; then
            PR_URL=$(gh pr view "${{ github.ref_name }}" --json url -q .url)
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created/found PR: $PR_URL"

      - name: Approve PR
        # Approval comes from an identity other than the PR author
        # (github-actions[bot], which created the PR above): the CI GitHub App
        # token when app-id is set, otherwise AUTO_MERGE_PAT. Best-effort —
        # auto-merge proceeds on its own when no approval is required.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "${{ github.ref_name }}"

      - name: Enable auto-merge
        # Run outside the checkout so gh skips local-clone cleanup. With
        # --delete-branch, gh otherwise tries `git checkout -B main origin/main`,
        # which fails in a fetch-depth=1 checkout that only has the PR branch.
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --delete-branch --${{ inputs.merge-method }} "${{ github.ref_name }}"
