name: Auto-merge Image Updater PRs (Reusable)

# Called from push-triggered workflows on image-updater/* branches.
# Creates the PR, approves, and enables auto-merge in a single job: a two-job
# design (push → create PR → pull_request → merge) cannot rely on the second
# job firing, because a PR opened with GITHUB_TOKEN does not trigger it.
#
# ## Pass app-id — GITHUB_TOKEN-authored PRs now stall awaiting approval
#
# GitHub changed this on 2026-06-11 ("Bot-created pull requests can run
# workflows if approved"), rolling out gradually into August. Previously a
# github-actions[bot] PR could not run CI at all, so these PRs merged with no
# checks whatsoever. Now the runs are created and held in `action_required`
# until a user with write access approves them — so an unattended release stops
# dead, and `gh pr merge --auto` waits on checks that will never start.
#
# The documented way out is to create the PR with a GitHub App installation
# token or a PAT rather than GITHUB_TOKEN, which is why the create step below
# prefers those. Callers should pass `app-id` + `APP_PRIVATE_KEY`; with neither
# this falls back to GITHUB_TOKEN and the caller inherits the approval prompt.
#
# The two identities must differ — GitHub rejects a self-approval — so whichever
# token opens the PR, the other one approves it. When the App opens it the
# approval comes from GITHUB_TOKEN, which needs "Allow GitHub Actions to review
# pull requests" (`can_approve_pull_request_reviews`) enabled on the repo.
#
# Calling workflow should trigger on:
#   push:
#     branches:
#       - 'image-updater-**'

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method: merge, squash, or rebase'
        required: false
        type: string
        default: 'squash'
      pr-title:
        description: 'Pull request title'
        required: false
        type: string
        default: 'build: automatic image update'
      app-id:
        description: 'GitHub App client ID (or numeric App ID; client ID recommended). When set, generates an App installation token (via APP_PRIVATE_KEY) for PR creation/approval instead of AUTO_MERGE_PAT.'
        required: false
        type: string
        default: ''
    secrets:
      AUTO_MERGE_PAT:
        description: 'PAT for approving the PR (needs a different user from the PR author). Required when app-id is empty and branch protection requires an approval.'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App private key. Required when app-id is set.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge:
    # ubuntu-slim: checkout + `gh` PR create/approve/merge, no toolchain.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        # Authored by the App (or PAT) where available, so the resulting
        # pull_request runs start on their own. Created with GITHUB_TOKEN they
        # are held in `action_required` and nothing merges unattended.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "${{ inputs.pr-title }}" \
            --body "Automated image update by argocd-image-updater.

          Branch: \`${{ github.ref_name }}\`" \
            2>&1) || true

          if echo "$PR_URL" | grep -q "already exists"; then
            PR_URL=$(gh pr view "${{ github.ref_name }}" --json url -q .url)
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created/found PR: $PR_URL"

      - name: Approve PR
        # Deliberately the opposite token to the create step: GitHub rejects a
        # self-approval, so whichever identity opened the PR cannot approve it.
        # With app-id set the App is the author and GITHUB_TOKEN approves (needs
        # `can_approve_pull_request_reviews` on the repo); without it the author
        # is github-actions[bot] and AUTO_MERGE_PAT approves.
        #
        # Best-effort — auto-merge proceeds on its own where no approval is
        # required, and a self-approval rejection must not fail the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token && secrets.GITHUB_TOKEN || secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "${{ github.ref_name }}"

      - name: Enable auto-merge
        # Run outside the checkout so gh skips local-clone cleanup. With
        # --delete-branch, gh otherwise tries `git checkout -B main origin/main`,
        # which fails in a fetch-depth=1 checkout that only has the PR branch.
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --delete-branch --${{ inputs.merge-method }} "${{ github.ref_name }}"
