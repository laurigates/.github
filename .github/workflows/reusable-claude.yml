name: Claude Code (Reusable)

# Enables @claude mentions in issues, PRs, and review comments.
# Claude uses CLAUDE.md files in the calling repo for project context.
# On a PR it skips green when the PR author is in skip_authors or every
# changed file matches skip_paths (Claude config, by default).

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the job'
        type: string
        default: 'ubuntu-slim'
      claude_args:
        description: 'Additional arguments for Claude Code (appended after default --max-turns, --allowedTools, and --system-prompt)'
        type: string
        required: false
        default: ''
      max_turns:
        description: 'Maximum number of agentic turns'
        type: number
        required: false
        default: 50
      allowed_tools:
        description: >-
          Comma-separated list of additional tools to allow beyond the action defaults
          (Glob, Grep, LS, Read, git commit/push). Passed to --allowedTools.
          Default covers the common polyglot stack: file editing, Python (uv/pytest/ruff),
          TypeScript (bun/biome), just task runner, pre-commit hooks, and
          GitHub MCP server tools for issue management (mcp__github__*).
          Listing any mcp__github__* tool causes the action to mount
          ghcr.io/github/github-mcp-server automatically.
        type: string
        required: false
        default: 'Edit,Write,Bash(uv *),Bash(pytest *),Bash(python *),Bash(ruff *),Bash(bun *),Bash(biome *),Bash(node *),Bash(just *),Bash(pre-commit *),Bash(make *),mcp__github__get_issue,mcp__github__list_issues,mcp__github__list_issue_types,mcp__github__search_issues,mcp__github__create_issue,mcp__github__update_issue,mcp__github__add_issue_comment,mcp__github__get_issue_comments,mcp__github__add_sub_issue,mcp__github__list_sub_issues'
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'opus'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 45
      additional_permissions:
        description: >-
          GitHub permissions map forwarded to the action, as "key: value" lines
          (e.g. "actions: read"). NOT a Claude tool list — that is allowed_tools.
          Putting a tool list here is silently inert; it is what broke
          reusable-changelog-review.yml and reusable-auto-fix.yml.
        required: false
        type: string
        default: ''
      plugins:
        description: 'Claude Code plugins to load'
        required: false
        type: string
        default: ''
      plugin_marketplaces:
        description: 'Claude Code plugin marketplace URLs'
        required: false
        type: string
        default: ''
      skip_authors:
        description: >-
          PR authors whose pull requests Claude does not run on, comma- or
          newline-separated, compared case-insensitively with the [bot] suffix
          included. Checked against the PR author, not the actor, so a human
          reopening or pushing to such a PR does not start a run. The default
          is the claude-config-sync App, whose PRs touch only Claude config
          (laurigates/gitops#341). '' disables the check
        required: false
        type: string
        default: 'laurigates-claude-config-sync[bot]'
      skip_paths:
        description: >-
          Bash patterns, comma- or newline-separated, for files that never
          need Claude; '*' (and so '**') matches across '/'. A PR whose every
          changed file matches one is skipped. Setting this replaces the
          default list; '' disables the check
        required: false
        type: string
        default: |
          .claude/**
          .mcp.json
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # On a PR (a comment on one, or a review), skips green, before checkout
      # and before Claude, when the PR author is in skip_authors or every
      # changed file matches skip_paths. PR is empty for a plain issue, which
      # is never skipped. The run: body is identical in
      # reusable-claude-review.yml; the claude-cost-guard test runs both.
      - name: Check PR author and changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          SKIP_AUTHORS: ${{ inputs.skip_authors }}
          SKIP_PATHS: ${{ inputs.skip_paths }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice title=Claude skipped::$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Not a pull request (an @claude on a plain issue): nothing here applies.
          if [ -z "${PR:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error title=Claude::the event carries no usable PR number"
            exit 1
          fi
          # entries <input>: one entry per line from a comma- or newline-separated
          # input, trimmed, with blank entries and '#' comments dropped.
          entries() {
            local e
            while IFS= read -r e; do
              e="${e#"${e%%[![:space:]]*}"}"
              e="${e%"${e##*[![:space:]]}"}"
              case "$e" in '' | '#'*) continue ;; esac
              printf '%s\n' "$e"
            done < <(printf '%s\n' "$1" | tr ',' '\n')
          }
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          # The author, not the actor: a human reopening or pushing to the sync PR
          # is the actor, and the PR is still the App's. A login is [A-Za-z0-9-]
          # plus the [bot] suffix; anything else is dropped before it reaches a
          # workflow command.
          author="$(printf '%s' "${AUTHOR:-}" | tr -cd 'A-Za-z0-9_.[]-')"
          if [ -n "$author" ]; then
            while IFS= read -r who; do
              if [ "$(lower "$who")" = "$(lower "$author")" ]; then
                skip "the PR author '$author' is listed in skip_authors"
              fi
            done < <(entries "${SKIP_AUTHORS:-}")
          fi

          patterns="$(entries "${SKIP_PATHS:-}")"
          if [ -z "$patterns" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" | jq -rs 'add // [] | .[].filename')"
          total=0
          kept=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            total=$((total + 1))
            matched=false
            while IFS= read -r pat; do
              # shellcheck disable=SC2053 # $pat is a pattern on purpose; '*' crosses '/'
              if [[ "$f" == $pat ]]; then matched=true; break; fi
            done <<< "$patterns"
            [ "$matched" = true ] || kept=$((kept + 1))
          done <<< "$names"
          # The files API lists at most 3000 files, so a list that long cannot prove
          # that every file matched. An empty list proves nothing either.
          if [ "$total" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$kept" -eq 0 ]; then
            skip "every changed file ($total) matches skip_paths"
          fi
          echo "$kept of $total changed file(s) fall outside skip_paths."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        if: steps.gate.outputs.run == 'true'

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
            --system-prompt "You have a limited turn budget of ${{ inputs.max_turns }} turns in CI.

            Strategy:
            1. ACT FIRST — produce visible output early. Do not spend many turns reading files before posting results.
            2. For CODE CHANGES: commit and push partial progress early. Do not wait until everything is done.
            3. For ANALYSIS/REVIEW tasks: post your findings incrementally. Use a checklist in your comment so partial progress is visible even if you run out of turns.
            4. After each milestone, update your comment with completed and remaining work.
            5. If you realize the task will exceed your budget, summarize what is done and what remains so a continuation can pick up where you left off."
            ${{ inputs.claude_args }}
          additional_permissions: |
            actions: read
            ${{ inputs.additional_permissions }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}

      - name: Detect failure type
        id: failure-type
        if: steps.claude.outcome == 'failure'
        # Values reach the script through env:, never as ${{ }} in the body:
        # an expression is pasted into the text before bash parses it (#78).
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          SUBTYPE="unknown"
          NUM_TURNS="0"
          ERRORS=""
          # The last `result` message of the SDK transcript. `objects` skips a
          # stray non-object element instead of aborting the read.
          RESULT='[.[]? | objects | select(.type == "result")] | last'
          if [[ -f "$EXEC_FILE" ]]; then
            SUBTYPE=$(jq -r "$RESULT | .subtype // \"unknown\"" "$EXEC_FILE" 2>/dev/null || echo "unknown")
            NUM_TURNS=$(jq -r "$RESULT | .num_turns // 0" "$EXEC_FILE" 2>/dev/null || echo "0")
            # SDK error text the run can influence. A newline in it would write
            # a second key=value line to GITHUB_OUTPUT (and could set type=), so
            # CR/LF collapse to a space. It reaches the comment step through
            # env:, where 128 KiB in one variable fails node's exec (E2BIG,
            # #61), so it is capped.
            ERRORS=$(jq -r "$RESULT"' | [.errors // [] | .[]? | tostring] | join("; ")
              | gsub("[\r\n]+"; " ")
              | if length > 2000 then .[:2000] + " [truncated]" else . end' "$EXEC_FILE" 2>/dev/null || echo "")
          else
            # Leave ERRORS empty — the follow-up comment links to the workflow
            # logs where the real error is visible, rather than rendering a
            # misleading "Error: Execution file not found".
            # The action's structured_output is no fallback here: upstream sets
            # it only on a successful run, so on this path it carries nothing,
            # and it is the caller's JSON-schema object, not an SDK result.
            SUBTYPE="no-execution-file"
          fi
          [[ "$SUBTYPE" =~ ^[a-z_-]+$ ]] || SUBTYPE="unknown"
          [[ "$NUM_TURNS" =~ ^[0-9]+$ ]] || NUM_TURNS="0"
          [[ "$ERRORS" != *$'\n'* && "$ERRORS" != *$'\r'* ]] || ERRORS=""

          {
            echo "subtype=${SUBTYPE}"
            echo "num_turns=${NUM_TURNS}"
            echo "errors=${ERRORS}"
          } >> "$GITHUB_OUTPUT"

          case "$SUBTYPE" in
            error_max_turns)        TYPE="max-turns" ;;
            error_during_execution) TYPE="execution-error" ;;
            error_max_budget_usd)   TYPE="budget-exceeded" ;;
            *)                      TYPE="error" ;;
          esac
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"

      - name: Post continuation comment on failure
        if: steps.claude.outcome == 'failure'
        uses: actions/github-script@v7
        # The same rule for JavaScript: a `'` in the SDK's error text closed a
        # string literal in a script run with the job's github-token.
        env:
          FAILURE_TYPE: ${{ steps.failure-type.outputs.type }}
          NUM_TURNS: ${{ steps.failure-type.outputs.num_turns }}
          ERRORS: ${{ steps.failure-type.outputs.errors }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        with:
          script: |
            const issueNumber = context.issue?.number || context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) return;

            const failureType = process.env.FAILURE_TYPE || '';
            const numTurns = process.env.NUM_TURNS || '0';
            const errors = process.env.ERRORS || '';
            const branchName = process.env.BRANCH_NAME || '';
            const sessionId = process.env.SESSION_ID || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const lines = [];

            switch (failureType) {
              case 'max-turns':
                lines.push(
                  `⚠️ **Claude ran out of turns** (used ${numTurns} turns).`,
                  '',
                  'Progress so far is captured in the comment above.',
                );
                break;
              case 'execution-error':
                lines.push(
                  `❌ **Claude encountered an error during execution** (after ${numTurns} turns).`,
                  '',
                );
                if (errors) {
                  lines.push(`Error: \`${errors}\``, '');
                }
                lines.push('Progress so far may be captured in the comment above.');
                break;
              case 'budget-exceeded':
                lines.push(`❌ **Claude exceeded its budget** (${numTurns} turns).`);
                break;
              default:
                lines.push('❌ **Claude encountered an error.**');
                if (errors) {
                  lines.push('', `Error: \`${errors}\``);
                } else {
                  lines.push(
                    '',
                    `No execution summary was produced. See the [workflow logs](${runUrl}) for the underlying error.`,
                  );
                }
                break;
            }

            if (branchName) {
              lines.push('', `Partial work was pushed to branch \`${branchName}\`.`);
            }

            // Show continuation instructions for recoverable failures
            if (['max-turns', 'execution-error'].includes(failureType)) {
              lines.push(
                '',
                'To continue, reply with:',
                '```',
                'Continue where you left off @claude',
                '```',
              );
            }

            lines.push('', `[View workflow run](${runUrl})`);
            if (sessionId) {
              lines.push(`<sub>Session: \`${sessionId}\`</sub>`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: lines.join('\n'),
            });

      - name: Fail workflow if Claude failed
        if: steps.claude.outcome == 'failure'
        run: exit 1
