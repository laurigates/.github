name: Code Smell Detection (Reusable)

# Triggers: call this from a `pull_request` workflow. That is the only event
# with a meaningful diff range (origin/<base_ref>...HEAD). workflow_dispatch
# and schedule are accepted and diff HEAD~1. push, and every other event
# anthropics/claude-code-action rejects, is refused green with a notice and
# scans nothing (laurigates/.github#63).
on:
  workflow_call:
    inputs:
      file-patterns:
        description: 'File patterns to analyze (space-separated git pathspecs)'
        required: false
        type: string
        default: '**/*.js **/*.ts **/*.jsx **/*.tsx'
      max-turns:
        description: 'Maximum Claude turns'
        required: false
        type: number
        default: 50
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-5-5'
      effort:
        description: "Claude effort level, passed as --effort. Set to '' to omit the flag"
        required: false
        type: string
        default: 'low'
      allowed-bots:
        description: "Comma-separated bot usernames allowed to trigger analysis (e.g. 'renovate[bot]'). The default admits @claude pushes from reusable-claude.yml: they arrive as github-actions[bot] until anthropics/claude-code-action#1721 is fixed, and as claude[bot] after. A caller that sets this replaces the default, so keep those names in its list"
        required: false
        type: string
        default: 'claude[bot],claude,github-actions[bot]'
      use-sticky-comment:
        description: "Forwarded to claude-code-action's use_sticky_comment. This workflow publishes findings to the job summary and file annotations, never a PR comment"
        required: false
        type: boolean
        default: true
      max-budget-usd:
        description: 'Maximum spend per run in USD (0 = no budget limit)'
        required: false
        type: number
        # Non-zero by default: an unbounded budget lets a retry loop burn
        # indefinitely. Observed 32 turns / $2.30 on one run, most of it the
        # model retrying a tool call it was never permitted to make.
        default: 5
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      file-limit:
        description: 'Maximum number of changed files to analyze'
        required: false
        type: number
        default: 30
      max-diff-lines:
        description: 'Skip Claude analysis when the total PR diff exceeds this many lines (0 disables the gate)'
        required: false
        type: number
        default: 3000
      severity-threshold:
        description: 'Minimum severity to report (low, medium, high)'
        required: false
        type: string
        default: 'medium'
    outputs:
      issues-found:
        description: 'Total code smells detected'
        value: ${{ jobs.analyze.outputs.count }}
      high-severity:
        description: 'High severity issues'
        value: ${{ jobs.analyze.outputs.high }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      count: ${{ steps.publish.outputs.count_total_issues }}
      high: ${{ steps.publish.outputs.count_high_severity }}
    steps:
      # anthropics/claude-code-action v1 throws `Unsupported event type` for
      # any event outside the `switch (context.eventName)` in its
      # src/github/context.ts (lines 170-251 when this list was taken; @v1
      # floats, so re-check there before adding an event). Without this step
      # a push ran the action into that throw and failed red in a way that
      # reads like a finding (laurigates/.github#63). Every step up to the
      # analysis compares `supported == 'true'`, so an unset output fails
      # closed. The step only decides: the shared 'Report that nothing was
      # scanned' step publishes the notice and the job-summary line.
      - name: Check trigger is supported
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME:-}" in
            issues | issue_comment | pull_request | pull_request_target | pull_request_review | pull_request_review_comment | workflow_dispatch | repository_dispatch | schedule | workflow_run)
              echo "supported=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              { echo "supported=false"; echo "unsupported=${EVENT_NAME:-unknown}"; } >> "$GITHUB_OUTPUT"
              echo "Trigger '${EVENT_NAME:-unknown}' is rejected by anthropics/claude-code-action; skipping everything up to the analysis."
              ;;
          esac

      # claude-code-action refuses a bot actor that allowed-bots does not
      # list ("Workflow initiated by non-human actor"), and the refusal
      # failed this job red on every Renovate PR without Claude running. This
      # step applies the action's rule first: a login ending in [bot] is a
      # bot, names compare lowercase with the [bot] suffix and surrounding
      # spaces dropped, and '*' admits every bot. A refused actor skips
      # everything up to the analysis, and the shared 'Report that nothing
      # was scanned' step says why. The action itself decides by account
      # type, so a bot whose login lacks the suffix still reaches it.
      # The PR author gets the same rule: the action checks only the actor,
      # so a human reopening or pushing to a bot's PR (the claude-config-sync
      # App's, which touches only .claude/** and .mcp.json) would otherwise
      # run Claude on it (laurigates/gitops#341).
      - name: Check actor is allowed
        id: actor
        if: steps.event.outputs.supported == 'true'
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          # allowed <login>: true for a login without the [bot] suffix (an
          # empty one included: no PR author outside a PR event), and for a
          # bot that allowed-bots lists.
          allowed() {
            local login name bot bots
            login="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            name="${login%\[bot\]}"
            if [ "$name" = "$login" ]; then return 0; fi
            if [ "$(trim "${ALLOWED_BOTS:-}")" = '*' ]; then return 0; fi
            IFS=, read -r -a bots <<<"$(printf '%s' "${ALLOWED_BOTS:-}" | tr '[:upper:]' '[:lower:]')"
            for bot in "${bots[@]}"; do
              bot="$(trim "$bot")"
              bot="${bot%\[bot\]}"
              if [ -n "$bot" ] && [ "$bot" = "$name" ]; then return 0; fi
            done
            return 1
          }
          # A login is [A-Za-z0-9-] plus the suffix; anything else is dropped
          # before it reaches GITHUB_OUTPUT or a workflow command.
          shown() { printf '%s' "$1" | tr -cd 'A-Za-z0-9_.[]-'; }
          if ! allowed "${ACTOR:-}"; then
            { echo "allowed=false"; echo "refused=$(shown "${ACTOR:-}")"; } >> "$GITHUB_OUTPUT"
            echo "Actor '$(shown "${ACTOR:-}")' is a bot that allowed-bots does not list; skipping everything up to the analysis."
          elif ! allowed "${AUTHOR:-}"; then
            { echo "allowed=false"; echo "refused_author=$(shown "${AUTHOR:-}")"; } >> "$GITHUB_OUTPUT"
            echo "PR author '$(shown "${AUTHOR:-}")' is a bot that allowed-bots does not list; skipping everything up to the analysis."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true'
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      # Incremental re-scan on a PR push (synchronize): when the previous PR
      # head was analysed clean, only the PR files this push changed need
      # analysing again. A one-byte cache entry keyed on that head is the
      # proof; `Check whether this scan was clean` decides when to write
      # one. Its key carries this workflow's name and a hash of every input,
      # so a marker from another scan or another configuration never
      # counts. Caches a PR run writes are readable by its later runs and by
      # no other PR. No marker, a force-push, or any lookup failure falls
      # back to the whole PR.
      - name: Key the clean-scan marker
        id: scankey
        if: steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true'
        env:
          SCAN: 'quality-code-smell'
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          h="$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-16)"
          echo "prefix=analysis-clean-v1-${SCAN}-${h}" >> "$GITHUB_OUTPUT"

      - name: Look up a clean scan of the previous head
        id: prior
        if: steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true' && github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/analysis-clean-marker
          key: ${{ steps.scankey.outputs.prefix }}-${{ github.event.before }}
          lookup-only: true

      - name: Get changed files
        id: changed
        if: steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true'
        env:
          PRIOR_CLEAN: ${{ steps.prior.outputs.cache-hit }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FILE_PATTERNS: ${{ inputs.file-patterns }}
          FILE_LIMIT: ${{ inputs.file-limit }}
          MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
          # Glob pathspecs, so `**/` matches zero or more directories and
          # `**/*.py` includes a top-level server.py. In git's default mode
          # `*` crosses `/` but the literal `/` in `**/` must still match,
          # which dropped every root-level file from the scan.
          GIT_GLOB_PATHSPECS: '1'
        run: |
          set -f
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          else
            RANGE="HEAD~1"
          fi
          # Unquoted on purpose: space-separated pathspecs, and `set -f`
          # above keeps the shell from globbing them before git sees them.
          ALL_FILES=$(git diff --name-only "$RANGE" -- $FILE_PATTERNS 2>/dev/null || echo "")
          # Incremental re-scan (see 'Key the clean-scan marker'): when the
          # previous head was scanned clean and this push fast-forwards it,
          # keep only the PR files the push changed. Intersecting with the
          # PR's own files drops what a merge from the base brought in.
          UNCHANGED=false
          NARROWED=false
          if [ "${PRIOR_CLEAN:-}" = "true" ] && [ -n "$ALL_FILES" ] \
             && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null \
             && INC=$(git diff --name-only "$BEFORE" "$AFTER" -- $FILE_PATTERNS 2>/dev/null); then
            PR_TOTAL=$(echo "$ALL_FILES" | grep -c '.' || true)
            ALL_FILES=$(LC_ALL=C comm -12 <(printf '%s\n' "$ALL_FILES" | LC_ALL=C sort -u) <(printf '%s\n' "$INC" | LC_ALL=C sort -u) | sed '/^$/d')
            NARROWED=true
            if [ -z "$ALL_FILES" ]; then UNCHANGED=true; fi
            MSG="Code Smell Detection: the previous head ${BEFORE:0:12} was scanned clean; re-scanning the $(echo "$ALL_FILES" | grep -c '.' || true) of $PR_TOTAL PR file(s) this push changed"
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
          set +f
          echo "unchanged=$UNCHANGED" >> $GITHUB_OUTPUT
          echo "narrowed=$NARROWED" >> $GITHUB_OUTPUT
          FILES=$(echo "$ALL_FILES" | head -n "$FILE_LIMIT" || true)
          TOTAL_FILES=$(echo "$ALL_FILES" | grep -c '.' || true)
          FILE_COUNT=$(echo "$FILES" | grep -c '.' || true)
          # numstat prints '-' for binary files; awk sums those as 0
          DIFF_LINES=$(git diff --numstat "$RANGE" 2>/dev/null | awk '{s+=$1+$2} END {print s+0}' || true)
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          if [ "$MAX_DIFF_LINES" -gt 0 ] && [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          if [ "$TOTAL_FILES" -gt "$FILE_LIMIT" ]; then
            echo "truncated=true" >> $GITHUB_OUTPUT
            MSG="Code Smell Detection: analyzing only the first $FILE_LIMIT of $TOTAL_FILES matched files"
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "truncated=false" >> $GITHUB_OUTPUT
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Python smells a linter finds deterministically, reported by ruff
      # instead of Claude (laurigates/.github#96, the shape #83 gave
      # reusable-quality-typescript.yml). RUFF_SELECT is the whole contract:
      # the prompt lists exactly these ids as not to report or count, and
      # .github/tests/ruff-advisory/run.sh fails when the two differ.
      # `--isolated` ignores the calling repository's ruff configuration,
      # which the pull request controls. The command-line --select and
      # --config already override its select, ignore and thresholds; they do
      # not override per-file-ignores, exclude with force-exclude,
      # dummy-variable-rgx (exempts PLR0913 arguments) or
      # pylint.allow-magic-value-types (exempts PLR2004 literals), each of
      # which drops hits Claude has been told to leave alone. `# noqa`
      # comments still apply.
      # The thresholds are pinned for the same reason the prompt states
      # them. It lists the PR's files itself rather than reading
      # steps.changed.outputs.files: that list is narrowed on a push after a
      # clean scan and capped at file-limit, and a hit in an unchanged file
      # must still be reported on every head, since Claude no longer sees it.
      # Advisory: a hit is a warning annotation and never fails the job, and
      # a download failure or a ruff crash is a warning too. Only an
      # unreadable PR diff range and a checksum mismatch fail it.
      # RUFF_VERSION and RUFF_SHA256 change together; the hash is the
      # release's ruff-x86_64-unknown-linux-gnu.tar.gz.sha256 asset. ruff
      # is downloaded only when a changed .py file matches file-patterns.
      - name: Ruff advisory lint
        id: ruff
        if: steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FILE_PATTERNS: ${{ inputs.file-patterns }}
          GIT_GLOB_PATHSPECS: '1'
          RUFF_VERSION: '0.17.4'
          RUFF_SHA256: '3ab2b34aeacdbc1ea5c529cdbda3e05792633d587228123fd09f3b5a0facb27a'
          RUFF_SELECT: 'C901,ERA001,PLR0913,PLR2004,S110,S112,T201,T203,TD003'
        run: |
          set -euo pipefail
          TITLE='Ruff advisory lint'
          # GitHub shows at most 10 warning annotations per step; the job
          # summary carries every hit.
          LIMIT="${ANNOTATION_LIMIT:-10}"
          case "$LIMIT" in '' | *[!0-9]*) echo "::error::$TITLE: ANNOTATION_LIMIT is not a number"; exit 1 ;; esac
          SUMMARY_ROWS_MAX=500
          zero() { printf 'hit_count=0\nhits=false\n' >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          else
            RANGE="HEAD~1"
          fi
          # workflow_dispatch or schedule on a repository with one commit has
          # no HEAD~1. The `changed` step scans nothing there and stays
          # green; do the same. A pull request whose base cannot be read
          # still fails below.
          if [ "$EVENT_NAME" != "pull_request" ] && ! git rev-parse -q --verify 'HEAD~1^{commit}' >/dev/null; then
            echo "::notice::$TITLE: HEAD has no parent commit; nothing to scan."
            zero
            exit 0
          fi
          LIST="$RUNNER_TEMP/ruff-changed"
          PYLIST="$RUNNER_TEMP/ruff-files"
          set -f
          # Unquoted on purpose: space-separated pathspecs, unglobbed. `-z`
          # because git C-quotes a path with a newline or non-ASCII byte in
          # the plain listing.
          # shellcheck disable=SC2086
          if ! git diff -z --name-only "$RANGE" -- $FILE_PATTERNS > "$LIST"; then
            echo "::error::$TITLE: could not list the changed files in $RANGE"
            exit 1
          fi
          set +f
          : > "$PYLIST"
          NFILES=0
          while IFS= read -r -d '' f; do
            # Deleted in the PR, or a symlink that could point outside the
            # checkout: nothing to lint.
            case "$f" in *.py) ;; *) continue ;; esac
            if [ ! -f "$f" ] || [ -L "$f" ]; then continue; fi
            printf '%s\0' "$f" >> "$PYLIST"
            NFILES=$((NFILES + 1))
          done < "$LIST"
          if [ "$NFILES" -eq 0 ]; then
            echo "$TITLE: no changed .py file matches file-patterns; ruff not run."
            zero
            exit 0
          fi

          TGZ="$RUNNER_TEMP/ruff.tar.gz"
          BIN="$RUNNER_TEMP/ruff-bin"
          mkdir -p "$BIN"
          if ! curl -fsSL --retry 3 -o "$TGZ" \
               "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"; then
            echo "::warning::$TITLE: could not download ruff ${RUFF_VERSION}; the $NFILES changed .py file(s) were not linted, and Claude does not report the ruff rules."
            printf '## %s\n\nruff %s could not be downloaded; %s changed .py file(s) were not linted.\n\n' "$TITLE" "$RUFF_VERSION" "$NFILES" >> "$GITHUB_STEP_SUMMARY"
            zero
            exit 0
          fi
          if ! echo "${RUFF_SHA256}  $TGZ" | sha256sum -c --quiet -; then
            echo "::error::$TITLE: the ruff ${RUFF_VERSION} download does not match RUFF_SHA256; refusing to run it."
            exit 1
          fi
          tar -xzf "$TGZ" -C "$BIN" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff

          # --exit-zero, so a hit exits 0 and anything else non-zero is a
          # ruff failure (xargs reports one as 123). Paths go after `--` so
          # a file named `-x.py` is not read as an option.
          RAW="$RUNNER_TEMP/ruff-raw.json"
          ERR="$RUNNER_TEMP/ruff-stderr"
          rc=0
          xargs -0 -r "$BIN/ruff" check --isolated --no-cache --exit-zero --output-format json \
            --select "$RUFF_SELECT" \
            --config 'lint.mccabe.max-complexity = 10' \
            --config 'lint.pylint.max-args = 4' \
            --config 'lint.flake8-bandit.check-typed-exception = true' \
            -- < "$PYLIST" > "$RAW" 2> "$ERR" || rc=$?
          # xargs may run ruff more than once, so RAW is one JSON array per
          # run. Anything else is not ruff output this step can read.
          if [ "$rc" -ne 0 ] || ! jq -se 'length > 0 and all(type == "array")' "$RAW" >/dev/null 2>&1; then
            echo "::warning::$TITLE: ruff exited $rc or wrote output that is not JSON arrays; no ruff hits are reported for this run. Its stderr follows."
            # stderr names files, which the PR controls: stop workflow
            # commands while it is printed.
            token="ruff-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$token"
            cat "$ERR"
            echo "::$token::"
            printf '## %s\n\nruff exited %s; no hits are reported for this run.\n\n' "$TITLE" "$rc" >> "$GITHUB_STEP_SUMMARY"
            zero
            exit 0
          fi

          # Ruff's output is untrusted at this boundary: a message quotes the
          # source (PLR2004 quotes the literal) and a path is whatever the PR
          # named. Only the selected codes count (a parse error arrives as
          # `invalid-syntax`); the path must sit under the checkout and is
          # made relative; the line must be a positive number. Annotation
          # text escapes % CR LF, and a property value also , and : (as
          # actions/toolkit escapeProperty does).
          HITS="$RUNNER_TEMP/ruff-hits.json"
          jq -s --arg root "$(pwd -P)/" --arg sel "$RUFF_SELECT" '
            ($sel | split(",")) as $s
            | [ add[] | objects
                | select((.code | type) == "string" and (.code as $c | any($s[]; . == $c)))
                | select((.filename | type) == "string" and (.filename | startswith($root)))
                | { file: (.filename | ltrimstr($root)),
                    line: (if (.location | type) == "object" then .location.row else null end
                           | if type == "number" and . >= 1 then floor else null end),
                    code: .code,
                    message: (.message | tostring) } ]
            | sort_by(.file, (.line // 0), .code)
          ' "$RAW" > "$HITS"
          COUNT="$(jq 'length' "$HITS")"
          case "$COUNT" in '' | *[!0-9]*) echo "::error::$TITLE: internal error, hit count is not a number"; exit 1 ;; esac

          jq -r --argjson limit "$LIMIT" '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: esc | gsub(","; "%2C") | gsub(":"; "%3A");
            .[:$limit][]
            | "::warning file=\(.file | prop)\(if .line then ",line=\(.line)" else "" end),title=\("ruff \(.code)" | prop)::\(.message | esc)"
          ' "$HITS"
          if [ "$COUNT" -gt "$LIMIT" ]; then
            echo "::notice::$TITLE: $((COUNT - LIMIT)) further hit(s) appear in the job summary only."
          fi

          {
            printf '## %s\n\n' "$TITLE"
            printf 'ruff %s checked %s changed .py file(s) for %s. **Hits:** %s\n\n' "$RUFF_VERSION" "$NFILES" "$RUFF_SELECT" "$COUNT"
            if [ "$COUNT" -gt 0 ]; then
              printf '| File | Line | Rule | Message |\n|---|---|---|---|\n'
              # A markdown table cell: no newline, no pipe, no backtick.
              jq -r --argjson max "$SUMMARY_ROWS_MAX" '
                def cell: tostring | gsub("[\r\n]"; " ") | gsub("\\|"; "\\|") | gsub("`"; "'"'"'");
                .[:$max][] | "| `\(.file | cell)` | \(.line // "") | \(.code | cell) | \(.message | cell) |"
              ' "$HITS"
              if [ "$COUNT" -gt "$SUMMARY_ROWS_MAX" ]; then
                printf '\n_%s further hit(s) omitted._\n' "$((COUNT - SUMMARY_ROWS_MAX))"
              fi
            fi
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"
          HAS=false
          if [ "$COUNT" -gt 0 ]; then HAS=true; fi
          printf 'hit_count=%s\nhits=%s\n' "$COUNT" "$HAS" >> "$GITHUB_OUTPUT"

      - name: Diff-size skip notice
        if: steps.event.outputs.supported == 'true' && steps.changed.outputs.skip == 'true' && steps.actor.outputs.allowed == 'true'
        run: |
          MSG="Code Smell Detection: skipping Claude analysis — PR diff ${{ steps.changed.outputs.diff_lines }} lines exceeds max-diff-lines ${{ inputs.max-diff-lines }}"
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Claude Code Smell Analysis
        id: analyze
        if: steps.changed.outputs.count != '0' && steps.changed.outputs.skip != 'true' && steps.event.outputs.supported == 'true' && steps.actor.outputs.allowed == 'true'
        # Failure here is classified by the 'Classify analysis outcome' step
        # below rather than failing the job outright.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          use_sticky_comment: ${{ inputs.use-sticky-comment }}
          claude_args: >-
            --model ${{ inputs.model }}
            ${{ inputs.effort != '' && format('--effort {0}', inputs.effort) || '' }}
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.max-budget-usd > 0 && format('--max-budget-usd {0}', inputs.max-budget-usd) || '' }}
            --json-schema '{"type":"object","properties":{"total_issues":{"type":"integer","description":"Total code smells detected"},"high_severity":{"type":"integer","description":"High severity issues"},"findings":{"type":"array","description":"Every issue found, most severe first","items":{"type":"object","properties":{"file":{"type":"string","description":"Repository-relative path, exactly as it appears in the file list"},"line":{"type":"integer"},"severity":{"type":"string","enum":["Critical","High","Medium","Low"]},"category":{"type":"string","description":"Smell name, e.g. Long Function, Deep Nesting, Magic Number"},"description":{"type":"string"},"remediation":{"type":"string"}},"required":["file","severity","category","description"]}}},"required":["total_issues","high_severity","findings"]}'
          prompt: |
            Analyze these files for code smells and anti-patterns.
            Minimum severity to report: ${{ inputs.severity-threshold }}

            ## Files to analyze
            ${{ steps.changed.outputs.files }}
            ${{ steps.changed.outputs.truncated == 'true' && 'NOTE: the analyzed file list was truncated — say so in the description of your first finding.' || '' }}

            The workflow's ruff step already reports these ruff rules in the changed `.py` files; in a `.py` file you must not report or count what they cover:
            - `C901`: cyclomatic complexity over 10
            - `PLR0913`: a function definition with more than 4 parameters, not counting `self` or `cls`
            - `PLR2004`: a numeric literal other than 0, 1 or -1 in a comparison
            - `S110`, `S112`: an `except` clause whose body is only `pass` or only `continue`
            - `T201`, `T203`: `print()` and `pprint()` calls
            - `TD003`: a TODO, FIXME or XXX comment without an issue link
            - `ERA001`: commented-out code
            Every other smell below in a `.py` file, and every smell in a file that is not `.py`, is still yours to report.

            ## Complexity Smells (High Severity)
            - Functions over 50 lines / single responsibility violations
            - 4+ levels of indentation / complex conditional chains
            - 5+ function parameters / boolean flag arguments
            - Cyclomatic complexity > 10

            ## Maintainability Smells (Medium Severity)
            - Magic numbers/strings in conditionals
            - Empty catch blocks / silently swallowed errors
            - console.log() in production code
            - 3+ levels of nested callbacks
            - 10+ lines of similar code duplication

            ## Style Smells (Low Severity)
            - Inconsistent naming conventions
            - Single-letter variables (except loop counters)
            - TODO/FIXME without issue reference
            - Commented-out code blocks

            ## Output Format

            For each issue:
            - **File:Line** - Exact location
            - **Smell** - Category name (e.g., "Long Function", "Deep Nesting")
            - **Severity** - high / medium / low
            - **Description** - Why it's problematic
            - **Suggestion** - How to refactor

            Group findings by severity (high first).

            ## Reporting

            Report everything through the structured output fields -- that is
            the only channel that reaches a human:

            - total_issues: all issues found
            - high_severity: high severity only
            - findings: one entry per issue, most severe first, each with
              file, line, severity, category, description and remediation.
              category is the smell name; severity is Critical,
              High, Medium or Low.

            Every issue you count must also appear in findings. A count with
            no matching entry is reported as an unreliable scan.

            The workflow renders `findings` into the job summary and into file
            annotations on the PR's Files tab. Do NOT try to post a PR comment
            or use any GitHub write tool -- you have no permission to do so,
            the attempt will be denied, and the finding will be lost. An issue
            you report only in prose is an issue nobody will ever read.

      # ---- BEGIN shared publish block (checked by scripts/check-publish-drift.sh) ----
      # Findings reach humans through the job summary and file annotations,
      # never a PR comment: the action is granted no comment tool, so asking
      # Claude to post one gave it no tool to post with, and the findings
      # were discarded (laurigates/.github#47). Both channels work with the
      # permissions the job holds.
      #
      # Guard is `outcome != 'skipped'`, not `== 'success'`: a failed run can
      # still carry findings. The action sets its `structured_output` output
      # only on a clean success, so the block reads the last `result` message
      # in the action's execution file instead, which recovers the payload
      # from a result flagged is_error and from a success result the action
      # rejects for overrunning --max-turns. An `error_*` result (max turns,
      # budget) normally carries none and degrades below. Gating on success
      # would discard exactly the findings that cost the most to produce.
      #
      # `steps.analyze` is the analysis STEP. Several of these workflows also
      # name their JOB `analyze`; jobs and steps are separate namespaces, so
      # this resolves to the step.
      - name: Publish findings
        id: publish
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        env:
          # A PATH, not the payload (laurigates/.github#61): an env string of
          # 131072 bytes or more (MAX_ARG_STRLEN) fails the execve of this
          # step's own shell with E2BIG before line 1 runs, and interpolating
          # the payload into the script body is a shell injection. The file
          # is the action's transcript, a JSON array of SDK messages.
          EXECUTION_FILE: ${{ steps.analyze.outputs.execution_file }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TITLE: 'Code Smell Detection'
          BLOCKING_SEVERITIES: ''
          COUNT_KEYS: 'total_issues,high_severity'
        run: |
          set -euo pipefail
          # GitHub discards a step summary over 1 MiB, silently. Cap below it.
          # This is the real ceiling on rendered output: the payload travels
          # as a file, never as an env or argv string, so the kernel's
          # per-string MAX_ARG_STRLEN no longer bounds it.
          SUMMARY_MAX_BYTES=900000
          # GitHub surfaces at most 10 annotations per level per step and 50
          # per job (actions/toolkit docs/problem-matchers.md); the summary
          # always carries the complete list.
          ANNOTATION_LIMIT=10

          # The payload is the last `result` message's structured_output,
          # extracted to a file once. The transcript also holds every tool
          # result, so only that field is selected and nothing else of it is
          # printed. `|| :` because an unreadable transcript must reach the
          # degrade branch below, not abort the step under `set -e`.
          PAYLOAD="$RUNNER_TEMP/publish-findings-input.json"
          : > "$PAYLOAD"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -c 'if type == "array" then [.[] | objects | select(.type == "result")] | last | .structured_output // empty else empty end' "$EXECUTION_FILE" > "$PAYLOAD" 2>/dev/null || : > "$PAYLOAD"
          fi

          # jq exits 0 on empty input, so an unguarded run would publish
          # nothing and say nothing -- the exact silence this block ends.
          #
          # `findings` is shape-checked here rather than inside each jq
          # program: a non-array there aborts jq under `set -e` and takes the
          # summary, the annotations AND the outputs down with it. Degrading
          # to this branch reports the failure and still emits zeroed counts.
          # It also writes `degraded=true`: zeroed counts skip every severity
          # gate, so `Classify analysis outcome` fails a run whose analysis
          # step SUCCEEDED (the action had a structured_output) but whose
          # findings this block could not read. Only the success path writes
          # `degraded=false`, so a step that aborted leaves it unset, which the
          # verdict treats the same as `true`.
          if [ ! -s "$PAYLOAD" ] || ! jq -e 'type == "object" and ((.findings // []) | type) == "array"' "$PAYLOAD" >/dev/null 2>&1; then
            if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
              WHY="the action exposed no execution file"
            else
              WHY="absent, unparseable, or 'findings' not an array"
            fi
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}' and produced no usable structured output ($WHY), so no findings could be published."
            echo "::warning::$MSG"
            printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
            { printf 'blocking=0\nitemised=0\ndegraded=true\n'
              printf '%s\n' "${COUNT_KEYS:-}" | tr ',' '\n' | sed '/^$/d;s/^/count_/;s/$/=0/'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ANALYZE_OUTCOME" != "success" ]; then
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}'; the findings below may be incomplete."
            echo "::warning::$MSG"
            printf '%s\n\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Counts render from whatever top-level numbers this workflow's
          # schema declares, so this block stays byte-identical across every
          # analysis workflow and the drift check can compare it.
          # `sev as $s | $b | index($s)`: inside index(), the input is $b, so
          # a bare `$b | index(sev)` silently reads $b.severity. Verified.
          jq -r --arg title "$TITLE" --arg blocking "${BLOCKING_SEVERITIES:-}" '
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | "## \($title)", "",
              (to_entries | map(select(.value | type == "number"))
                | map("**\(.key | gsub("_"; " ")):** \(.value)")
                | if length == 0 then "_No counts reported._" else join(" · ") end),
              "",
              (if ($f | length) == 0 then "No findings reported.", ""
               else ($f | map(
                 "### \(sev) — \(.category // "Uncategorised")", "",
                 (if (.file // "") != "" then "`\(.file | ltrimstr("./"))\(if .line then ":\(.line)" else "" end)`", "" else empty end),
                 (.description // "_no description supplied_"), "",
                 (if (.remediation // "") != "" then "**Remediation:** \(.remediation)", "" else empty end)
               ) | .[])
               end)
          ' "$PAYLOAD" > "$RUNNER_TEMP/publish-findings-summary.md"

          if [ "$(wc -c < "$RUNNER_TEMP/publish-findings-summary.md")" -gt "$SUMMARY_MAX_BYTES" ]; then
            head -c "$SUMMARY_MAX_BYTES" "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n_Summary truncated at %s bytes; remaining findings omitted._\n' "$SUMMARY_MAX_BYTES" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$TITLE: job summary truncated at $SUMMARY_MAX_BYTES bytes."
          else
            cat "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          # File annotations render on the PR's Files tab with no comment
          # permission. Payloads MUST be escaped: an unescaped newline splits
          # the annotation, an unescaped % corrupts it, and an unescaped comma
          # in the path breaks property parsing. `severity` is escaped along
          # with the rest -- the schema's enum is a request to the model, not
          # a constraint the runner applies, so a newline in it would emit a
          # second line that GitHub parses as its own workflow command.
          # `line` is type-checked rather than escaped: a string there injects
          # further annotation properties (`line=1,col=9,endLine=99`), and jq
          # truthiness admits `line=0`, which GitHub does not accept as an
          # anchor.
          jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --argjson limit "$ANNOTATION_LIMIT" '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | ($f[:$limit][]
               | (sev as $s | if ($b | index($s)) then "error" else "warning" end) as $lvl
               | (if (.file // "") != "" then " file=\(.file | ltrimstr("./") | esc | gsub(","; "%2C"))\(if ((.line | type) == "number" and .line > 0) then ",line=\(.line)" else "" end)" else "" end) as $loc
               | "::\($lvl)\($loc)::[\(sev | esc)] [\(.category // "Uncategorised" | esc)] \(.description // "no description" | esc)"),
              (if ($f | length) > $limit then "::notice::\(($f | length) - $limit) further finding(s) appear in the job summary only." else empty end)
          ' "$PAYLOAD"

          # $GITHUB_OUTPUT is a `key=value` file, so a newline inside a count
          # opens a second line: `total_issues` of "0\nblocking=0" would
          # overwrite the blocking count a caller gates on. Counts are
          # type-checked rather than escaped, because a count that is not a
          # number is not a count.
          jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --arg keys "${COUNT_KEYS:-}" '
            . as $root
            | def sev: .severity // "Unrated";
              ($blocking | split(",") | map(select(length > 0))) as $b
            | ((.findings // []) | map(select(type == "object"))) as $f
            | "blocking=\($f | map(select(sev as $s | $b | index($s))) | length)",
              "itemised=\($f | length)",
              "degraded=false",
              (($keys | split(",") | map(select(length > 0)) | .[]) | "count_\(.)=\(if ($root[.] | type) == "number" then $root[.] else 0 end)")
          ' "$PAYLOAD" >> "$GITHUB_OUTPUT"

      # A check that never ran reports 'pass'. Without this the green tick on
      # a PR that matched no files is indistinguishable from a clean scan.
      #
      # `!failure()` as well as `!cancelled()`: a failed checkout or file-list
      # step also leaves `analyze` skipped, and on that red job the message
      # below would assert nothing matched, which is not what happened. The
      # reason is passed in rather than inferred, because the gate that skips
      # the analysis is not the same one in every workflow.
      - name: Report that nothing was scanned
        if: ${{ !cancelled() && !failure() && steps.analyze.outcome == 'skipped' }}
        env:
          TITLE: 'Code Smell Detection'
          SKIPPED_FOR_SIZE: ${{ steps.changed.outputs.skip }}
          UNSUPPORTED_EVENT: ${{ steps.event.outputs.unsupported }}
          REFUSED_ACTOR: ${{ steps.actor.outputs.refused }}
          REFUSED_AUTHOR: ${{ steps.actor.outputs.refused_author }}
          UNCHANGED_SINCE_CLEAN: ${{ steps.changed.outputs.unchanged }}
          NOTHING_SCANNED_REASON: 'no changed file matched the configured patterns'
        run: |
          set -euo pipefail
          if [ -n "${UNSUPPORTED_EVENT:-}" ]; then
            REASON="this workflow does not support the '$UNSUPPORTED_EVENT' trigger (anthropics/claude-code-action rejects it); call it from pull_request"
          elif [ -n "${REFUSED_ACTOR:-}" ]; then
            REASON="the actor '$REFUSED_ACTOR' is a bot that allowed-bots does not list, and anthropics/claude-code-action refuses it"
          elif [ -n "${REFUSED_AUTHOR:-}" ]; then
            REASON="the PR author '$REFUSED_AUTHOR' is a bot that allowed-bots does not list, so its PR is not analysed whoever triggered the run"
          elif [ "${SKIPPED_FOR_SIZE:-false}" = "true" ]; then
            REASON="the PR diff exceeded max-diff-lines, so the diff-size gate skipped the analysis"
          elif [ "${UNCHANGED_SINCE_CLEAN:-}" = "true" ]; then
            REASON="no PR file in the configured patterns changed since the previous head, which was scanned clean"
          else
            REASON="${NOTHING_SCANNED_REASON:-the analysis step did not run}"
          fi
          MSG="$TITLE: no analysis ran — $REASON. This check is green because nothing was scanned, not because nothing was found."
          echo "::notice::$MSG"
          printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
      # ---- END shared publish block ----

      # The analysis step runs with continue-on-error, because the action
      # fails it whenever --json-schema is set and a run that otherwise
      # succeeded returns no structured_output (anthropics/claude-code-action
      # base-action/src/run-claude-sdk.ts). Emission is not deterministic:
      # the same SHA has produced it on one attempt and not the next
      # (laurigates/.github#65).
      # This step decides from Claude's own final `result` message, which the
      # action writes to execution_file before that check and exposes on the
      # failure path too, whether the job should go red:
      #   success, is_error false, no structured_output -> warning, green
      #   anything else that failed the analysis step    -> error, red
      # A step that SUCCEEDED is red too when `Publish findings` reports
      # `degraded` as anything but 'false'. Under --json-schema the action
      # fails the step unless it had a structured_output, so a success that
      # publish could not read is a read failure on this side (a reshaped
      # transcript from the floating @v1, an unset execution_file), and its
      # zeroed counts would otherwise skip every severity gate.
      # Two edges, both deliberate:
      # error_max_structured_output_retries (the model failed to produce
      # schema-valid output) is red, like every other non-success subtype;
      # and a success run with no structured_output is green even when it
      # overran --max-turns (the action's own overrun check), because this
      # step does not compare num_turns with max-turns.
      # Outside the shared publish block on purpose, so the block stays
      # byte-identical to the copies it is drift-checked against.
      - name: Classify analysis outcome
        id: verdict
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.analyze.outputs.execution_file }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          PUBLISH_DEGRADED: ${{ steps.publish.outputs.degraded }}
          TITLE: 'Code Smell Detection'
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$TITLE: $1"
            printf '%s: %s\n' "$TITLE" "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # A step that succeeded is classified by what publish read. Fail
          # closed: only an explicit 'false' means its findings were published.
          if [ "$ANALYZE_OUTCOME" = "success" ]; then
            if [ "${PUBLISH_DEGRADED:-}" != "false" ]; then
              fail "the analysis step succeeded, so the action had Claude's structured output, but the publish step could not read the findings from its execution file; the severity gates saw zeroed counts and cannot pass this run. The publish step's warning names the cause."
            fi
            exit 0
          fi

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and left no execution file, so Claude produced no result. The cause is in the analysis step's log."
          fi

          # The file is a JSON array of SDK messages; the last `result`
          # message is Claude's own account of how the run ended.
          if ! RESULT="$(jq -c '[.[]? | objects | select(.type == "result")] | last // empty' "$EXECUTION_FILE" 2>/dev/null)"; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and its execution file is not a JSON array of SDK messages."
          fi
          if [ -z "$RESULT" ]; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and Claude never sent a result message (the SDK run was cut short). The cause is in the analysis step's log."
          fi

          # Every value interpolated into a workflow command is escaped: the
          # SDK's error strings can carry newlines, and a newline would end
          # the annotation and start a new command. `word` maps an empty
          # value to 'unknown': tab is IFS whitespace, so `read` collapses
          # an empty @tsv field and would shift every later field left.
          read -r SUBTYPE IS_ERROR TURNS HAS_OUTPUT < <(printf '%s' "$RESULT" | jq -r '
            def word: tostring | gsub("[^A-Za-z0-9_.-]"; "_") | if . == "" then "unknown" else . end;
            [(.subtype // "unknown" | word), (.is_error == true), (.num_turns // "unknown" | word),
             (has("structured_output") and .structured_output != null)] | @tsv')
          ERRORS="$(printf '%s' "$RESULT" | jq -r '
            (.errors // []) | map(tostring) | join("; ") | .[:500]
            | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")')"

          if [ "$SUBTYPE" = "success" ] && [ "$IS_ERROR" = "false" ]; then
            if [ "$HAS_OUTPUT" = "false" ]; then
              MSG="$TITLE: Claude finished the analysis ($TURNS turns) but returned no structured output, so this run has no verdict and nothing was published. The job is not failed for a missing report; re-run it to get one."
              echo "::warning::$MSG"
              printf '%s\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            fail "Claude finished the analysis ($TURNS turns) with structured output, but the action failed the step anyway; the findings above were published from its execution file and may be incomplete. The analysis step's log names the reason (a run over --max-turns is one)."
          fi

          case "$SUBTYPE" in
            error_max_turns)
              fail "Claude stopped at the max-turns limit after $TURNS turns without finishing, so the scan is incomplete. Raise max-turns or narrow file-patterns." ;;
            error_max_budget_usd)
              fail "Claude stopped at the max-budget-usd ceiling after $TURNS turns without finishing, so the scan is incomplete. Raise max-budget-usd." ;;
            success)
              fail "Claude's result reported is_error, so the run errored without producing a real result.${ERRORS:+ Errors: $ERRORS}" ;;
            *)
              fail "Claude's run ended with result subtype '$SUBTYPE' after $TURNS turns.${ERRORS:+ Errors: $ERRORS}" ;;
          esac

      # Writes the marker the next push's lookup reads, keyed on this head.
      # Runs only on a pull_request and only when every step above passed,
      # and calls the scan clean only when Claude analysed every file it was
      # given (no truncation) and its result has no finding and no non-zero
      # count, or when no PR file had changed since a clean previous head.
      # The payload file is the one the shared publish block extracts.
      - name: Check whether this scan was clean
        id: clean
        if: github.event_name == 'pull_request' && steps.scankey.outputs.prefix != ''
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          DEGRADED: ${{ steps.publish.outputs.degraded }}
          TRUNCATED: ${{ steps.changed.outputs.truncated }}
          UNCHANGED: ${{ steps.changed.outputs.unchanged }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/publish-findings-input.json"
          clean=false
          if [ "${UNCHANGED:-}" = true ]; then
            clean=true
          elif [ "${ANALYZE_OUTCOME:-}" = success ] && [ "${DEGRADED:-}" = false ] && [ "${TRUNCATED:-}" = false ] \
               && jq -e 'type == "object" and ((.findings // []) | length) == 0
                         and ([to_entries[] | .value | numbers | select(. != 0)] | length) == 0' "$payload" >/dev/null 2>&1; then
            clean=true
          fi
          if [ "$clean" = true ]; then
            mkdir -p "$RUNNER_TEMP/analysis-clean-marker"
            printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/analysis-clean-marker/scanned"
          fi
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "Clean-scan marker for this head: $clean"

      - name: Record a clean scan
        if: steps.clean.outputs.clean == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/analysis-clean-marker
          key: ${{ steps.scankey.outputs.prefix }}-${{ github.event.pull_request.head.sha }}
