name: Container Build (Reusable)

# PR pre-release build phase of the build-once/promote pattern.
# Runs on release-please PRs — builds and pushes a :next-{version} image to GHCR
# so the release job (reusable-container-release.yml) can promote it instead of
# rebuilding when the tag is pushed.
#
# Lookup key: the version read from the version file (e.g. package.json).
# Release-please always bumps the version in the PR, so:
#   PR build  → ghcr.io/.../image:next-1.2.3
#   Tag push  → promote next-1.2.3 to 1.2.3, 1.2, 1
#
# This works regardless of merge strategy (squash or regular merge).

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image name under ghcr.io (e.g. laurigates/my-app)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      build-args:
        description: 'Newline-separated Docker build arguments'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64'
      cache-scope:
        description: 'GHA cache scope (use different scopes for multiple images in one repo)'
        required: false
        type: string
        default: 'app'
      version-command:
        description: 'Shell command to read the current version (stdout must be the bare version string)'
        required: false
        type: string
        default: "jq -r '.version' package.json"
      scan-mode:
        description: |
          'advisory' (default): scan the pushed :next-{version} image and
          annotate the release PR, never failing it. 'block': fail the PR check
          on findings. 'off': skip the scan. Default is advisory on purpose — a
          CVE published against an unchanged base image would otherwise block
          every unrelated release with no code fix available. The authoritative
          gate lives in reusable-container-release.yml, which re-scans the same
          bytes immediately before creating any release tag and also covers the
          rebuild path this workflow cannot see.
        required: false
        type: string
        default: 'advisory'
      scan-severity:
        description: 'Trivy severity levels that constitute a finding'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      scan-ignore-unfixed:
        description: 'Ignore findings with no fix available'
        required: false
        type: boolean
        default: true
      scan-trivy-version:
        description: 'Trivy binary version used by the advisory scan'
        required: false
        type: string
        default: 'v0.70.0'
    secrets:
      secret-build-args:
        description: |
          Additional newline-separated KEY=VALUE Docker build arguments whose values are secrets.
          Use for tokens that must reach the build but should not appear in the `build-args` input.
          Values are masked in logs. The caller typically populates this with secrets from its
          own repository, e.g. passing a Sentry auth token or an NPM registry token.
        required: false
    outputs:
      pre-release-tag:
        description: 'The full pre-release image reference pushed (ghcr.io/…:next-{version})'
        value: ${{ jobs.build.outputs.pre-release-tag }}
      version:
        description: 'Version string read from the version file'
        value: ${{ jobs.build.outputs.version }}
      digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pre-release-tag: ${{ steps.tag.outputs.pre-release-tag }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fails on a bad configuration before a build is paid for. Necessary
      # because the two expressions that consume scan-mode fail in opposite
      # directions: `if: inputs.scan-mode != 'off'` still runs the scan for an
      # unrecognised value, but `continue-on-error: ${{ inputs.scan-mode !=
      # 'block' }}` soft-fails it — so a caller writing `blocking`, `enforce` or
      # `true` would get an advisory check with no signal that the enforcement
      # they asked for was discarded.
      - name: Validate scan configuration
        env:
          MODE: ${{ inputs.scan-mode }}
          SEVERITY: ${{ inputs.scan-severity }}
        run: |
          set -euo pipefail
          case "$MODE" in
            advisory|block|off) ;;
            *) echo "::error::scan-mode must be 'advisory', 'block' or 'off', got '${MODE}'. Refusing to build under a scan mode this workflow does not understand."; exit 1 ;;
          esac
          [ -n "$SEVERITY" ] || { echo "::error::scan-severity must not be empty"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(${{ inputs.version-command }})
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Pre-release image tag: next-${VERSION}"

      - name: Compute pre-release tag
        id: tag
        run: |
          TAG="ghcr.io/${{ inputs.image-name }}:next-${{ steps.version.outputs.version }}"
          echo "pre-release-tag=${TAG}" >> $GITHUB_OUTPUT

      # Tree-hash of the build context at the commit being built. The release
      # job uses this to detect main moving forward between PR build and release
      # tag, which would otherwise cause a stale image to be promoted unchanged.
      - name: Compute build context tree hash
        id: tree
        run: |
          CONTEXT="${{ inputs.context }}"
          if [ -z "$CONTEXT" ] || [ "$CONTEXT" = "." ]; then
            TREE=$(git rev-parse "HEAD^{tree}")
          else
            TREE=$(git rev-parse "HEAD:${CONTEXT}")
          fi
          echo "hash=${TREE}" >> $GITHUB_OUTPUT
          echo "Build context tree hash: ${TREE}"

      - name: Build and push pre-release image
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tag.outputs.pre-release-tag }}
          # Labels read by reusable-container-release.yml to verify the cached
          # PR image is still current before promoting it to the release tag.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.laurigates.build.context-tree=${{ steps.tree.outputs.hash }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            ${{ inputs.build-args }}
            ${{ secrets.secret-build-args }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
          # SBOM and provenance deferred to the release/promote job
          provenance: false
          sbom: false

      # Scanned by digest, not by tag: two runs can race on :next-{version}
      # (release-please's push and a relock run, which is why the caller carries
      # a concurrency group), so scanning the tag could report on the other
      # run's image.
      - name: Scan pre-release image (advisory)
        id: scan
        if: inputs.scan-mode != 'off'
        continue-on-error: ${{ inputs.scan-mode != 'block' }}
        uses: laurigates/.github/.github/actions/scan-image@main
        with:
          image: ghcr.io/${{ inputs.image-name }}@${{ steps.build-push.outputs.digest }}
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: ${{ inputs.scan-ignore-unfixed }}
          trivy-version: ${{ inputs.scan-trivy-version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan-mode }}
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
          SCAN_PLATFORMS: ${{ steps.scan.outputs.platforms-scanned }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "## Container Build: \`${{ inputs.image-name }}\` (PR pre-release)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.tag.outputs.pre-release-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Purpose**: Pre-built for promotion on merge — no rebuild needed after tag push" >> $GITHUB_STEP_SUMMARY
          # The mode is printed unconditionally so a skipped scan is visible
          # rather than looking like a pass.
          echo "- **Scan**: mode \`${SCAN_MODE}\`, result \`${SCAN_RESULT:-not-run}\` (${SCAN_PLATFORMS:-0} platform manifest(s))" >> $GITHUB_STEP_SUMMARY
          # Discriminated on the composite's `result`, not on the step outcome:
          # the scan step also fails when Trivy itself fails (DB pull, network),
          # and calling that "findings" sends the operator to `.trivyignore` for
          # a broken scanner. Same reasoning as the warn-mode step in
          # reusable-container-release.yml.
          if [ "${SCAN_RESULT:-}" = "findings" ]; then
            echo "  - Findings present. The release job will refuse to publish this image unless they are fixed, \`.trivyignore\`d, or \`scan-enforcement: warn\` is set there." >> $GITHUB_STEP_SUMMARY
          elif [ "${SCAN_OUTCOME:-}" = "failure" ]; then
            echo "  - The scan did not complete — read the scan step's log. This is a scanner failure, not a vulnerability report." >> $GITHUB_STEP_SUMMARY
          fi
