name: OWASP Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      file-patterns:
        description: 'File patterns to analyze (space-separated git pathspecs)'
        required: false
        type: string
        default: '**/*.js **/*.ts **/*.jsx **/*.tsx **/*.py **/*.rb **/*.go **/*.java **/*.php'
      max-turns:
        description: 'Maximum Claude analysis turns'
        required: false
        type: number
        default: 50
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'opus'
      allowed-bots:
        description: "Comma-separated bot usernames allowed to trigger analysis (e.g. 'renovate[bot]')"
        required: false
        type: string
        default: ''
      use-sticky-comment:
        description: 'Maintain a single PR comment instead of posting a new comment per run'
        required: false
        type: boolean
        default: true
      max-budget-usd:
        description: 'Maximum spend per run in USD (0 = no budget limit)'
        required: false
        type: number
        # Non-zero by default: an unbounded budget lets a retry loop burn
        # indefinitely. Observed 32 turns / $2.30 on one run, most of it the
        # model retrying a tool call it was never permitted to make.
        default: 5
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      file-limit:
        description: 'Maximum number of changed files to analyze'
        required: false
        type: number
        default: 50
      max-diff-lines:
        description: 'Skip Claude analysis when the total PR diff exceeds this many lines (0 disables the gate)'
        required: false
        type: number
        default: 3000
      fail-on-critical:
        description: 'Fail workflow if critical issues found'
        required: false
        type: boolean
        default: true
    outputs:
      issues-found:
        description: 'Total security issues detected'
        value: ${{ jobs.scan.outputs.issue-count }}
      critical-count:
        description: 'Number of critical severity issues'
        value: ${{ jobs.scan.outputs.critical-count }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      issue-count: ${{ fromJSON(steps.analyze.outputs.structured_output || '{}').total_issues }}
      critical-count: ${{ fromJSON(steps.analyze.outputs.structured_output || '{}').critical_issues }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          set -f
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD~1"
          fi
          ALL_FILES=$(git diff --name-only "$RANGE" -- ${{ inputs.file-patterns }} 2>/dev/null || echo "")
          set +f
          FILES=$(echo "$ALL_FILES" | head -n ${{ inputs.file-limit }} || true)
          TOTAL_FILES=$(echo "$ALL_FILES" | grep -c '.' || true)
          FILE_COUNT=$(echo "$FILES" | grep -c '.' || true)
          # numstat prints '-' for binary files; awk sums those as 0
          DIFF_LINES=$(git diff --numstat "$RANGE" 2>/dev/null | awk '{s+=$1+$2} END {print s+0}' || true)
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          if [ "${{ inputs.max-diff-lines }}" -gt 0 ] && [ "$DIFF_LINES" -gt "${{ inputs.max-diff-lines }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          if [ "$TOTAL_FILES" -gt "${{ inputs.file-limit }}" ]; then
            echo "truncated=true" >> $GITHUB_OUTPUT
            MSG="OWASP Security Scan: analyzing only the first ${{ inputs.file-limit }} of $TOTAL_FILES matched files"
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "truncated=false" >> $GITHUB_OUTPUT
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Diff-size skip notice
        if: steps.changed.outputs.skip == 'true'
        run: |
          MSG="OWASP Security Scan: skipping Claude analysis — PR diff ${{ steps.changed.outputs.diff_lines }} lines exceeds max-diff-lines ${{ inputs.max-diff-lines }}"
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Claude OWASP Analysis
        id: analyze
        if: steps.changed.outputs.count != '0' && steps.changed.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          use_sticky_comment: ${{ inputs.use-sticky-comment }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.max-budget-usd > 0 && format('--max-budget-usd {0}', inputs.max-budget-usd) || '' }}
            --json-schema '{"type":"object","properties":{"total_issues":{"type":"integer","description":"Total security issues found"},"critical_issues":{"type":"integer","description":"Critical severity issues found"},"findings":{"type":"array","description":"Every issue found, most severe first","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["Critical","High","Medium","Low"]},"category":{"type":"string","description":"OWASP category, e.g. A01:2021 - Broken Access Control"},"description":{"type":"string"},"remediation":{"type":"string"}},"required":["file","severity","category","description"]}}},"required":["total_issues","critical_issues","findings"]}'
          prompt: |
            Analyze these files for OWASP Top 10 2021 security vulnerabilities.

            ## Files to analyze
            ${{ steps.changed.outputs.files }}
            ${{ steps.changed.outputs.truncated == 'true' && 'NOTE: the analyzed file list was truncated — say so in your comment.' || '' }}

            ## OWASP Top 10 2021 Categories

            ### A01:2021 - Broken Access Control (Critical)
            - Path traversal: user input in file paths without sanitization
            - Direct object references without authorization checks
            - Privilege escalation patterns
            - Missing access control on sensitive endpoints

            ### A02:2021 - Cryptographic Failures (Critical)
            - Hardcoded secrets, API keys, passwords
            - Weak cryptographic algorithms (MD5, SHA1 for security)
            - Sensitive data in logs or error messages
            - Missing encryption for sensitive data

            ### A03:2021 - Injection (Critical)
            - SQL injection: string concatenation in SQL queries
            - Command injection: user input in shell commands, exec(), eval()
            - XSS: innerHTML, dangerouslySetInnerHTML, document.write with user input
            - Template injection: user input in templates without escaping
            - LDAP/XML/NoSQL injection patterns

            ### A04:2021 - Insecure Design (High)
            - Missing input validation on trust boundaries
            - Business logic flaws
            - Missing rate limiting on sensitive operations
            - Predictable resource identifiers

            ### A05:2021 - Security Misconfiguration (High)
            - Debug mode enabled in production
            - Default credentials
            - Verbose error messages exposing internals
            - Unnecessary features enabled

            ### A07:2021 - Auth Failures (Critical)
            - Weak password requirements
            - Session fixation
            - Missing brute force protection
            - Insecure session handling

            ### A08:2021 - Data Integrity Failures (High)
            - Insecure deserialization: unserialize(), pickle.loads(), JSON.parse on untrusted
            - Missing integrity checks on critical data
            - Unsigned JWTs or weak JWT validation

            ### A09:2021 - Logging Failures (Medium)
            - Sensitive data in logs (passwords, tokens, PII)
            - Missing audit logs for security events
            - Log injection vulnerabilities

            ### A10:2021 - SSRF (Critical)
            - User-controlled URLs in HTTP requests
            - URL parsing vulnerabilities
            - Missing allowlist for external requests

            ## Output Format

            For each issue found:
            - **File:Line** - Exact location
            - **Severity** - Critical / High / Medium / Low
            - **OWASP Category** - A01-A10 with name
            - **Vulnerability** - What the issue is
            - **Code Snippet** - The vulnerable code
            - **Remediation** - How to fix it with code example

            ## Reporting

            Report everything through the structured output fields -- that is
            the only channel that reaches a human:

            - total_issues: all issues found
            - critical_issues: critical severity only
            - findings: one entry per issue, most severe first, each with
              file, line, severity, category, description and remediation

            The workflow renders `findings` into the job summary. Do NOT try to
            post a PR comment or use any GitHub write tool -- you have no
            permission to do so, the attempt will be denied, and the finding
            will be lost. An issue you report only in prose is an issue nobody
            will ever read.

      # Findings reach humans through the job summary and file annotations,
      # never a PR comment: the action is granted no comment tool, so asking
      # Claude to post one only produced denials and discarded the findings.
      # Both channels here work with the permissions the job already holds.
      - name: Publish findings
        if: always() && steps.analyze.outcome == 'success'
        env:
          # Read via env, never interpolated into the script body: this is
          # model-generated text crossing into a shell.
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
        run: |
          if [ -z "${STRUCTURED_OUTPUT:-}" ]; then
            echo "OWASP scan produced no structured output." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$STRUCTURED_OUTPUT" | jq -r '
            "## OWASP Security Scan",
            "",
            "**\(.total_issues // 0) issue(s) — \(.critical_issues // 0) critical**",
            "",
            ((.findings // [])
              | if length == 0 then ["No findings reported."]
                else map(
                  "### \(.severity) — \(.category)",
                  "",
                  "`\(.file)\(if .line then ":\(.line)" else "" end)`",
                  "",
                  .description,
                  "",
                  (if .remediation then "**Remediation:** \(.remediation)" else empty end),
                  ""
                )
                end
              | .[])
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Check for critical issues
        if: inputs.fail-on-critical && fromJSON(steps.analyze.outputs.structured_output || '{}').critical_issues > 0
        env:
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
        run: |
          # File-anchored annotations render on the PR's Files tab, so a
          # blocking finding is visible where the code is.
          printf '%s' "$STRUCTURED_OUTPUT" | jq -r '
            (.findings // [])
            | map(select(.severity == "Critical"))
            | .[]
            | "::error file=\(.file)\(if .line then ",line=\(.line)" else "" end)::[\(.category)] \(.description)"
          '
          echo "::error::Found ${{ fromJSON(steps.analyze.outputs.structured_output || '{}').critical_issues }} critical security issues - see the job summary for details"
          exit 1
