name: Fix Release-Please Conflicts (Reusable)

# When the release-please PR gets merge conflicts (typically from rapid commits
# to main that change CHANGELOG.md, package.json, or the manifest), this workflow
# deletes the stale branch and retriggers release-please to recreate it cleanly.
#
# Root cause: release-please creates a branch modifying 3 files (CHANGELOG.md,
# package.json, .release-please-manifest.json). When a previous release PR is
# squash-merged to main, those same files change on main, making the existing
# release-please branch stale. The next release-please run may not be able to
# force-push if GitHub has already marked the PR as conflicted.
#
# Calling workflow should trigger on:
#   push:
#     branches: [main]
#   schedule:
#     - cron: "*/30 * * * *"
#   workflow_dispatch: {}
#
# The token used (App token or RELEASE_PLEASE_TOKEN) needs Actions: write as
# well as Contents and Pull requests write: the permissions: block below scopes
# GITHUB_TOKEN only, and without it the job closes the PR, deletes the branch,
# then fails on the `gh workflow run` dispatch (issue #114).

on:
  workflow_call:
    inputs:
      release-workflow-file:
        description: 'Filename of the release-please workflow to retrigger'
        required: false
        type: string
        default: 'release-please.yml'
      app-id:
        description: 'GitHub App client ID (or numeric App ID; client ID recommended). When set, uses an App token (via APP_PRIVATE_KEY) instead of RELEASE_PLEASE_TOKEN. The App installation must grant Contents: write, Pull requests: write and Actions: write; Actions: write is needed for the `gh workflow run` dispatch, and the permissions: block below does not grant it to an App token.'
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: 'PAT with contents:write, pull-requests:write and actions:write (actions:write dispatches release-please; falls back to GITHUB_TOKEN)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App private key. Required when app-id is set.'
        required: false

concurrency:
  group: fix-release-conflicts-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  fix-conflicts:
    # ubuntu-slim: pure `gh` API calls, no checkout, no toolchain.
    runs-on: ubuntu-slim
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Wait for release-please to finish
        if: github.event_name == 'push'
        run: sleep 30

      - name: Check for conflicted release-please PR
        id: check
        env:
          GH_TOKEN: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A push to main makes GitHub recompute the PR's mergeability, and the
          # field reads UNKNOWN until it has. Re-read up to MAX_POLLS times,
          # POLL_SLEEP seconds apart, before classifying.
          MAX_POLLS: '6'
          POLL_SLEEP: '10'
        run: |
          for v in MAX_POLLS POLL_SLEEP; do
            case "${!v}" in '' | *[!0-9]* | 0*)
              echo "::error::$v must be a positive integer (got '${!v}')"; exit 1 ;; esac
          done

          polls=0
          while :; do
            # Find open release-please PRs. A failed read fails the step
            # (bash -e) instead of reading as "no PR".
            PR_JSON=$(gh pr list \
              --repo "$REPO" \
              --head "release-please--branches--main" \
              --state open \
              --json number,mergeable,headRefName \
              --limit 1 \
              -q '.[0] // empty')

            if [ -z "$PR_JSON" ]; then
              echo "No open release-please PR found"
              echo "has_conflict=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            NUMBER=$(echo "$PR_JSON" | jq -r '.number')
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
            BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')

            if [ "$MERGEABLE" != "UNKNOWN" ] || [ "$polls" -ge "$MAX_POLLS" ]; then
              break
            fi
            polls=$((polls + 1))
            echo "Mergeability UNKNOWN for release-please PR #$NUMBER; waiting ${POLL_SLEEP}s ($polls/$MAX_POLLS)"
            sleep "$POLL_SLEEP"
          done

          echo "PR #$NUMBER on branch $BRANCH — mergeable: $MERGEABLE"

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            if [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "::warning::release-please PR #$NUMBER still reads mergeable UNKNOWN after $MAX_POLLS polls; the scheduled run will retry"
            fi
            echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close conflicted PR and delete branch
        if: steps.check.outputs.has_conflict == 'true'
        env:
          GH_TOKEN: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check.outputs.pr_number }}
          BRANCH: ${{ steps.check.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          echo "Closing conflicted PR #$PR_NUMBER and deleting branch $BRANCH"

          gh pr close "$PR_NUMBER" \
            --repo "$REPO" \
            --comment "Closing due to merge conflicts. Release-please will recreate this PR automatically on the next trigger." \
            --delete-branch

          echo "Deleted branch $BRANCH"

      - name: Retrigger release-please
        if: steps.check.outputs.has_conflict == 'true'
        env:
          GH_TOKEN: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_WORKFLOW_FILE: ${{ inputs.release-workflow-file }}
          REPO: ${{ github.repository }}
        run: |
          echo "Triggering $RELEASE_WORKFLOW_FILE to recreate the PR"
          gh workflow run "$RELEASE_WORKFLOW_FILE" \
            --repo "$REPO" \
            --ref main
          echo "Workflow triggered successfully"
