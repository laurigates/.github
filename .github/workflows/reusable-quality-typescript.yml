name: TypeScript Strictness (Reusable)

on:
  workflow_call:
    inputs:
      file-patterns:
        description: 'TypeScript file patterns (space-separated git pathspecs)'
        required: false
        type: string
        default: '**/*.ts **/*.tsx'
      max-turns:
        description: 'Maximum Claude turns'
        required: false
        type: number
        default: 50
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'sonnet'
      allowed-bots:
        description: "Comma-separated bot usernames allowed to trigger analysis (e.g. 'renovate[bot]')"
        required: false
        type: string
        default: ''
      use-sticky-comment:
        description: 'Maintain a single PR comment instead of posting a new comment per run'
        required: false
        type: boolean
        default: true
      max-budget-usd:
        description: 'Maximum spend per run in USD (0 = no budget limit)'
        required: false
        type: number
        # Non-zero by default: an unbounded budget lets a retry loop burn
        # indefinitely. Observed 32 turns / $2.30 on one run, most of it the
        # model retrying a tool call it was never permitted to make.
        default: 5
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      file-limit:
        description: 'Maximum number of changed files to analyze'
        required: false
        type: number
        default: 30
      max-diff-lines:
        description: 'Skip Claude analysis when the total PR diff exceeds this many lines (0 disables the gate)'
        required: false
        type: number
        default: 3000
      strict-mode:
        description: 'Enforce strict type checking'
        required: false
        type: boolean
        default: true
    outputs:
      any-count:
        description: 'Number of any types found'
        value: ${{ jobs.analyze.outputs.any }}
      issues-found:
        description: 'Total type safety issues'
        value: ${{ jobs.analyze.outputs.total }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      any: ${{ steps.publish.outputs.count_any_count }}
      total: ${{ steps.publish.outputs.count_total_issues }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed TypeScript files
        id: changed
        run: |
          set -f
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD~1"
          fi
          ALL_FILES=$(git diff --name-only "$RANGE" -- ${{ inputs.file-patterns }} 2>/dev/null || echo "")
          set +f
          FILES=$(echo "$ALL_FILES" | head -n ${{ inputs.file-limit }} || true)
          TOTAL_FILES=$(echo "$ALL_FILES" | grep -c '.' || true)
          FILE_COUNT=$(echo "$FILES" | grep -c '.' || true)
          # numstat prints '-' for binary files; awk sums those as 0
          DIFF_LINES=$(git diff --numstat "$RANGE" 2>/dev/null | awk '{s+=$1+$2} END {print s+0}' || true)
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          if [ "${{ inputs.max-diff-lines }}" -gt 0 ] && [ "$DIFF_LINES" -gt "${{ inputs.max-diff-lines }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          if [ "$TOTAL_FILES" -gt "${{ inputs.file-limit }}" ]; then
            echo "truncated=true" >> $GITHUB_OUTPUT
            MSG="TypeScript Strictness: analyzing only the first ${{ inputs.file-limit }} of $TOTAL_FILES matched files"
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "truncated=false" >> $GITHUB_OUTPUT
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Diff-size skip notice
        if: steps.changed.outputs.skip == 'true'
        run: |
          MSG="TypeScript Strictness: skipping Claude analysis — PR diff ${{ steps.changed.outputs.diff_lines }} lines exceeds max-diff-lines ${{ inputs.max-diff-lines }}"
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Claude TypeScript Analysis
        id: analyze
        if: steps.changed.outputs.count != '0' && steps.changed.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          use_sticky_comment: ${{ inputs.use-sticky-comment }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.max-budget-usd > 0 && format('--max-budget-usd {0}', inputs.max-budget-usd) || '' }}
            --json-schema '{"type":"object","properties":{"any_count":{"type":"integer","description":"Number of explicit any usages found"},"total_issues":{"type":"integer","description":"Total type safety issues found"},"findings":{"type":"array","description":"Every issue found, most severe first","items":{"type":"object","properties":{"file":{"type":"string","description":"Repository-relative path, exactly as it appears in the file list"},"line":{"type":"integer"},"severity":{"type":"string","enum":["Critical","High","Medium","Low"]},"category":{"type":"string","description":"Type safety issue kind, e.g. Explicit any, Non-null assertion"},"description":{"type":"string"},"remediation":{"type":"string"}},"required":["file","severity","category","description"]}}},"required":["any_count","total_issues","findings"]}'
          prompt: |
            Review TypeScript changes for type safety issues.
            Strict mode: ${{ inputs.strict-mode }}

            ## Files to analyze
            ${{ steps.changed.outputs.files }}
            ${{ steps.changed.outputs.truncated == 'true' && 'NOTE: the analyzed file list was truncated — say so in the description of your first finding.' || '' }}

            ## Critical Issues (Block Merge in Strict Mode)
            - Explicit `any` usage: `const data: any`, `as any`, function params typed as any
            - `@ts-ignore` / `@ts-expect-error` without explanation comment
            - `@ts-nocheck` in files

            ## High Severity Issues
            - Non-null assertions: `user!.name` without guard
            - Unsafe type assertions: `value as SomeType` without runtime validation
            - Implicit `any`: untyped function parameters, callback params

            ## Medium Severity Issues
            - Exported functions without explicit return type
            - `any[]` / `Array<any>` instead of typed arrays
            - Async functions returning implicit `Promise<any>`

            ## Low Severity Issues
            - Missing `as const` where beneficial
            - Overly broad generic types
            - Missing generic constraints

            ## Output Format

            For each issue:
            - **File:Line** - Exact location
            - **Severity** - critical / high / medium / low
            - **Issue** - What's wrong
            - **Current** - The problematic code
            - **Suggested** - Type-safe alternative

            ## Reporting

            Report everything through the structured output fields -- that is
            the only channel that reaches a human:

            - any_count: explicit any usages only
            - total_issues: all issues found
            - findings: one entry per issue, most severe first, each with
              file, line, severity, category, description and remediation.
              category is the type safety issue kind; severity is Critical,
              High, Medium or Low.

            Every issue you count must also appear in findings. A count with
            no matching entry is reported as an unreliable scan.

            The workflow renders `findings` into the job summary and into file
            annotations on the PR's Files tab. Do NOT try to post a PR comment
            or use any GitHub write tool -- you have no permission to do so,
            the attempt will be denied, and the finding will be lost. An issue
            you report only in prose is an issue nobody will ever read.

      # ---- BEGIN shared publish block (checked by scripts/check-publish-drift.sh) ----
      # Findings reach humans through the job summary and file annotations,
      # never a PR comment: the action is granted no comment tool, so asking
      # Claude to post one only produced denials and discarded the findings
      # (issue #47). Both channels work with the permissions the job holds.
      #
      # Guard is `outcome != 'skipped'`, not `== 'success'`: when the wrapper
      # fails the run for overrunning --max-turns or --max-budget-usd, the
      # model has normally already emitted its structured output. Gating on
      # success discards exactly the findings that cost the most to produce.
      #
      # `steps.analyze` is the analysis STEP. Several of these workflows also
      # name their JOB `analyze`; jobs and steps are separate namespaces, so
      # this resolves to the step.
      - name: Publish findings
        id: publish
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        env:
          # Read via env, never interpolated into the script body: this is
          # model-generated text crossing into a shell.
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TITLE: 'TypeScript Strictness'
          BLOCKING_SEVERITIES: ''
          COUNT_KEYS: 'any_count,total_issues'
        run: |
          set -euo pipefail
          # GitHub discards a step summary over 1 MiB, silently. Cap below it.
          SUMMARY_MAX_BYTES=900000
          # GitHub surfaces ~10 annotations per level per step. Unverified
          # exact figure; the summary always carries the complete list.
          ANNOTATION_LIMIT=10

          # jq exits 0 on empty input, so an unguarded run would publish
          # nothing and say nothing -- the exact silence this block ends.
          if [ -z "${STRUCTURED_OUTPUT:-}" ] || ! printf '%s' "$STRUCTURED_OUTPUT" | jq -e 'type == "object"' >/dev/null 2>&1; then
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}' and produced no parseable structured output, so no findings could be published."
            echo "::warning::$MSG"
            printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
            { printf 'blocking=0\nitemised=0\n'
              printf '%s\n' "${COUNT_KEYS:-}" | tr ',' '\n' | sed '/^$/d;s/^/count_/;s/$/=0/'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ANALYZE_OUTCOME" != "success" ]; then
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}'; the findings below may be incomplete."
            echo "::warning::$MSG"
            printf '%s\n\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Counts render from whatever top-level numbers this workflow's
          # schema declares, so this block stays byte-identical across every
          # analysis workflow and the drift check can compare it.
          # `sev as $s | $b | index($s)`: inside index(), the input is $b, so
          # a bare `$b | index(sev)` silently reads $b.severity. Verified.
          printf '%s' "$STRUCTURED_OUTPUT" | jq -r --arg title "$TITLE" --arg blocking "${BLOCKING_SEVERITIES:-}" '
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | "## \($title)", "",
              (to_entries | map(select(.value | type == "number"))
                | map("**\(.key | gsub("_"; " ")):** \(.value)")
                | if length == 0 then "_No counts reported._" else join(" · ") end),
              "",
              (if ($f | length) == 0 then "No findings reported.", ""
               else ($f | map(
                 "### \(sev) — \(.category // "Uncategorised")", "",
                 (if (.file // "") != "" then "`\(.file | ltrimstr("./"))\(if .line then ":\(.line)" else "" end)`", "" else empty end),
                 (.description // "_no description supplied_"), "",
                 (if (.remediation // "") != "" then "**Remediation:** \(.remediation)", "" else empty end)
               ) | .[])
               end)
          ' > "$RUNNER_TEMP/publish-findings-summary.md"

          if [ "$(wc -c < "$RUNNER_TEMP/publish-findings-summary.md")" -gt "$SUMMARY_MAX_BYTES" ]; then
            head -c "$SUMMARY_MAX_BYTES" "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n_Summary truncated at %s bytes; remaining findings omitted._\n' "$SUMMARY_MAX_BYTES" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$TITLE: job summary truncated at $SUMMARY_MAX_BYTES bytes."
          else
            cat "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          # File annotations render on the PR's Files tab with no comment
          # permission. Payloads MUST be escaped: an unescaped newline splits
          # the annotation, an unescaped % corrupts it, and an unescaped comma
          # in the path breaks property parsing. `line` is type-checked rather
          # than escaped: a string there injects further annotation properties
          # (`line=1,col=9,endLine=99`), and jq truthiness admits `line=0`,
          # which GitHub does not accept as an anchor.
          printf '%s' "$STRUCTURED_OUTPUT" | jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --argjson limit "$ANNOTATION_LIMIT" '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | ($f[:$limit][]
               | (sev as $s | if ($b | index($s)) then "error" else "warning" end) as $lvl
               | (if (.file // "") != "" then " file=\(.file | ltrimstr("./") | esc | gsub(","; "%2C"))\(if ((.line | type) == "number" and .line > 0) then ",line=\(.line)" else "" end)" else "" end) as $loc
               | "::\($lvl)\($loc)::[\(sev)] [\(.category // "Uncategorised" | esc)] \(.description // "no description" | esc)"),
              (if ($f | length) > $limit then "::notice::\(($f | length) - $limit) further finding(s) appear in the job summary only." else empty end)
          '

          printf '%s' "$STRUCTURED_OUTPUT" | jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --arg keys "${COUNT_KEYS:-}" '
            . as $root
            | def sev: .severity // "Unrated";
              ($blocking | split(",") | map(select(length > 0))) as $b
            | ((.findings // []) | map(select(type == "object"))) as $f
            | "blocking=\($f | map(select(sev as $s | $b | index($s))) | length)",
              "itemised=\($f | length)",
              (($keys | split(",") | map(select(length > 0)) | .[]) | "count_\(.)=\($root[.] // 0)")
          ' >> "$GITHUB_OUTPUT"

      # A check that never ran reports 'pass'. Without this the green tick on
      # a PR that matched no files is indistinguishable from a clean scan.
      #
      # `!failure()` as well as `!cancelled()`: a failed checkout or file-list
      # step also leaves `analyze` skipped, and on that red job the message
      # below would assert nothing matched, which is not what happened. The
      # reason is passed in rather than inferred, because the gate that skips
      # the analysis is not the same one in every workflow.
      - name: Report that nothing was scanned
        if: ${{ !cancelled() && !failure() && steps.analyze.outcome == 'skipped' }}
        env:
          TITLE: 'TypeScript Strictness'
          SKIPPED_FOR_SIZE: ${{ steps.changed.outputs.skip }}
          NOTHING_SCANNED_REASON: 'no changed file matched the configured patterns'
        run: |
          set -euo pipefail
          if [ "${SKIPPED_FOR_SIZE:-false}" = "true" ]; then
            REASON="the PR diff exceeded max-diff-lines, so the diff-size gate skipped the analysis"
          else
            REASON="${NOTHING_SCANNED_REASON:-the analysis step did not run}"
          fi
          MSG="$TITLE: no analysis ran — $REASON. This check is green because nothing was scanned, not because nothing was found."
          echo "::notice::$MSG"
          printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
      # ---- END shared publish block ----
