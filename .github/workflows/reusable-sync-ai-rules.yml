name: Sync AI Rules

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # --path .rulesync: rulesync >= 9 resolves features relative to the repo
      # root of the source repo (GET /contents/rules), so the .rulesync/ layout
      # must be addressed explicitly or fetch 404s and returns zero files.
      - name: Fetch rules from .github repo
        run: npx rulesync@latest fetch laurigates/.github --features rules,ignore --conflict overwrite --path .rulesync

      # fetch exits 0 even when it fetches nothing, and generate then fails
      # (or silently no-ops) — fail fast with a pointer to the rules source.
      - name: Verify rules were fetched
        run: |
          [ -n "$(find .rulesync/rules -name '*.md' -print -quit 2>/dev/null)" ] || {
            echo "::error::rulesync fetch produced no rule files — check the .rulesync/rules/ source in laurigates/.github"
            exit 1
          }

      # Explicit targets/features: consumer repos have no rulesync.jsonc
      # (fetch does not pull it), and the no-config default is the agentsmd
      # target only, which generates nothing for these rules.
      - name: Generate tool-specific files
        run: npx rulesync@latest generate --targets claudecode,copilot,antigravity-cli,cursor --features rules,ignore

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore: sync AI coding rules from .github repo"
          title: "chore: sync AI coding rules"
          body: |
            ## Summary

            - Synced AI coding rules from `laurigates/.github` via rulesync
            - Updated tool-specific config for Claude Code, Copilot, Antigravity CLI, and Cursor

            ## Test plan

            - [ ] Verify `.claude/rules/` files have correct `globs:` frontmatter
            - [ ] Verify `.github/instructions/` contains `.instructions.md` files
            - [ ] Verify `.cursor/rules/` contains `.mdc` files
            - [ ] Verify `.agents/rules/` and `.geminiignore` are generated

            🤖 Generated with rulesync
          branch: chore/sync-ai-rules
          delete-branch: true
