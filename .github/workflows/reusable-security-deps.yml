name: Dependency Security Audit (Reusable)

# Triggers: call this from a `pull_request` workflow. That is the only event
# with a diff range, so the only one that audits just the lockfiles a change
# touched; workflow_dispatch and schedule audit every lockfile present. push,
# and every other event anthropics/claude-code-action rejects, is refused
# green with a notice and audits nothing (laurigates/.github#63).
on:
  workflow_call:
    inputs:
      package-manager:
        description: 'Package manager to audit (npm, bun, pnpm, yarn, pip, cargo)'
        required: false
        type: string
        default: 'npm'
      max-turns:
        description: 'Maximum Claude analysis turns'
        required: false
        type: number
        default: 50
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'sonnet'
      allowed-bots:
        description: "Comma-separated bot usernames allowed to trigger analysis, or '*' for any bot. Defaults to '*' because dependency PRs are bot-authored and re-runs replay the original bot-sender event"
        required: false
        type: string
        default: '*'
      use-sticky-comment:
        description: "Forwarded to claude-code-action's use_sticky_comment. This workflow publishes findings to the job summary and file annotations, never a PR comment"
        required: false
        type: boolean
        default: true
      max-budget-usd:
        description: 'Maximum spend per run in USD (0 = no budget limit)'
        required: false
        type: number
        # Non-zero by default: an unbounded budget lets a retry loop burn
        # indefinitely. Observed 32 turns / $2.30 on one run, most of it the
        # model retrying a tool call it was never permitted to make.
        default: 5
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      max-diff-lines:
        description: 'Skip Claude analysis when the total PR diff exceeds this many lines (0 disables the gate)'
        required: false
        type: number
        default: 3000
      fail-on-high:
        description: 'Fail workflow if high/critical vulnerabilities found'
        required: false
        type: boolean
        default: false
    outputs:
      vulnerabilities:
        description: 'Total vulnerabilities found'
        value: ${{ jobs.audit.outputs.count }}
      critical:
        description: 'Critical/High severity vulnerabilities'
        value: ${{ jobs.audit.outputs.critical }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      count: ${{ steps.publish.outputs.count_total_vulnerabilities }}
      critical: ${{ steps.publish.outputs.count_critical_high }}
    steps:
      # anthropics/claude-code-action v1 throws `Unsupported event type` for
      # any event outside the `switch (context.eventName)` in its
      # src/github/context.ts (lines 170-251 when this list was taken; @v1
      # floats, so re-check there before adding an event). Without this step
      # a push ran the action into that throw and failed red in a way that
      # reads like a finding (laurigates/.github#63). Every step up to the
      # analysis compares `supported == 'true'`, so an unset output fails
      # closed. The step only decides: the shared 'Report that nothing was
      # scanned' step publishes the notice and the job-summary line.
      - name: Check trigger is supported
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME:-}" in
            issues | issue_comment | pull_request | pull_request_target | pull_request_review | pull_request_review_comment | workflow_dispatch | repository_dispatch | schedule | workflow_run)
              echo "supported=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              { echo "supported=false"; echo "unsupported=${EVENT_NAME:-unknown}"; } >> "$GITHUB_OUTPUT"
              echo "Trigger '${EVENT_NAME:-unknown}' is rejected by anthropics/claude-code-action; skipping everything up to the analysis."
              ;;
          esac

      - name: Checkout repository
        if: steps.event.outputs.supported == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for lockfile changes
        id: changed
        if: steps.event.outputs.supported == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        run: |
          LOCKFILES="package-lock.json bun.lockb pnpm-lock.yaml yarn.lock Cargo.lock requirements.txt poetry.lock Pipfile.lock"
          CHANGED=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            for lockfile in $LOCKFILES; do
              if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q "$lockfile"; then
                CHANGED="$CHANGED $lockfile"
              fi
            done
          else
            for lockfile in $LOCKFILES; do
              if [ -f "$lockfile" ]; then
                CHANGED="$CHANGED $lockfile"
              fi
            done
          fi

          # Only pull_request events have a base ref to diff against; the gate is inert otherwise
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # numstat prints '-' for binary files; awk sums those as 0
            DIFF_LINES=$(git diff --numstat "origin/$BASE_REF...HEAD" 2>/dev/null | awk '{s+=$1+$2} END {print s+0}' || true)
          else
            DIFF_LINES=0
          fi

          echo "lockfiles=$CHANGED" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT
          if [ "$MAX_DIFF_LINES" -gt 0 ] && [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$CHANGED" ]; then
            echo "has_lockfiles=true" >> $GITHUB_OUTPUT
          else
            echo "has_lockfiles=false" >> $GITHUB_OUTPUT
          fi

      - name: Diff-size skip notice
        if: steps.event.outputs.supported == 'true' && steps.changed.outputs.skip == 'true'
        run: |
          MSG="Dependency Security Audit: skipping Claude analysis — PR diff ${{ steps.changed.outputs.diff_lines }} lines exceeds max-diff-lines ${{ inputs.max-diff-lines }}"
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.event.outputs.supported == 'true' && contains(fromJSON('["npm", "bun", "pnpm", "yarn"]'), inputs.package-manager)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        if: steps.event.outputs.supported == 'true' && inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@v1

      - name: Setup Python
        if: steps.event.outputs.supported == 'true' && inputs.package-manager == 'pip'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Rust
        if: steps.event.outputs.supported == 'true' && inputs.package-manager == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Run audit command
        id: audit-cmd
        if: steps.event.outputs.supported == 'true'
        continue-on-error: true
        run: |
          case "${{ inputs.package-manager }}" in
            npm)
              npm audit --json > audit-results.json 2>&1 || true
              ;;
            bun)
              # bun audit reads bun.lock natively (Bun >=1.2.15); no install needed.
              # npm audit ENOLOCKs here since the repo has no package-lock.json.
              bun audit --json > audit-results.json 2>&1 || true
              ;;
            pnpm)
              pnpm audit --json > audit-results.json 2>&1 || true
              ;;
            yarn)
              yarn audit --json > audit-results.json 2>&1 || true
              ;;
            pip)
              pip install pip-audit > /dev/null 2>&1
              pip-audit --format json > audit-results.json 2>&1 || true
              ;;
            cargo)
              cargo install cargo-audit > /dev/null 2>&1
              cargo audit --json > audit-results.json 2>&1 || true
              ;;
          esac

          if [ -f audit-results.json ]; then
            echo "results<<EOF" >> $GITHUB_OUTPUT
            cat audit-results.json | head -c 10000 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Claude Dependency Analysis
        id: analyze
        if: steps.audit-cmd.outputs.results != '' && steps.changed.outputs.skip != 'true' && steps.event.outputs.supported == 'true'
        # Failure here is classified by the 'Classify analysis outcome' step
        # below rather than failing the job outright.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependency PRs are bot-authored (Renovate, release-please). On a
          # re-run GitHub replays the original pull_request event whose sender
          # is the bot, so the action's human-actor guard blocks it without
          # this. Audit-and-comment is read-only with a fixed prompt — safe.
          allowed_bots: ${{ inputs.allowed-bots }}
          use_sticky_comment: ${{ inputs.use-sticky-comment }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.max-budget-usd > 0 && format('--max-budget-usd {0}', inputs.max-budget-usd) || '' }}
            --json-schema '{"type":"object","properties":{"total_vulnerabilities":{"type":"integer","description":"Total vulnerabilities found"},"critical_high":{"type":"integer","description":"Critical and high severity vulnerabilities"},"findings":{"type":"array","description":"Every issue found, most severe first","items":{"type":"object","properties":{"file":{"type":"string","description":"The lockfile or manifest that declares the vulnerable package"},"line":{"type":"integer"},"severity":{"type":"string","enum":["Critical","High","Medium","Low"]},"category":{"type":"string","description":"Package, version and advisory id, e.g. lodash@4.17.20 - GHSA-35jh-r3h4-6jhm"},"description":{"type":"string"},"remediation":{"type":"string"}},"required":["file","severity","category","description"]}}},"required":["total_vulnerabilities","critical_high","findings"]}'
          prompt: |
            Analyze the dependency security audit results for this project.

            ## Package Manager
            ${{ inputs.package-manager }}

            ## Audit Results
            ```json
            ${{ steps.audit-cmd.outputs.results }}
            ```

            ## Changed Lockfiles
            ${{ steps.changed.outputs.lockfiles }}

            ## Analysis Instructions

            For each vulnerability report:
            - **Package** - Affected package name and version
            - **Severity** - Critical / High / Moderate / Low
            - **CVE/GHSA** - Identifier if available
            - **Description** - Brief explanation of the vulnerability
            - **Fixed Version** - Version that resolves the issue
            - **Recommendation** - Upgrade command or action needed

            Prioritize: Critical → High → Moderate → Low

            Check transitive dependencies — identify the direct dep that pulls in vulnerable transitive deps.

            ## Reporting

            Report everything through the structured output fields -- that is
            the only channel that reaches a human:

            - total_vulnerabilities: all findings
            - critical_high: critical plus high severity only
            - findings: one entry per issue, most severe first, each with
              file, line, severity, category, description and remediation.
              category is the package with its advisory id; severity is Critical,
              High, Medium or Low.

            Every issue you count must also appear in findings. A count with
            no matching entry is reported as an unreliable scan.

            The workflow renders `findings` into the job summary and into file
            annotations on the PR's Files tab. Do NOT try to post a PR comment
            or use any GitHub write tool -- you have no permission to do so,
            the attempt will be denied, and the finding will be lost. An issue
            you report only in prose is an issue nobody will ever read.

            npm's ladder has no Medium: map its `Moderate` to Medium.

      # ---- BEGIN shared publish block (checked by scripts/check-publish-drift.sh) ----
      # Findings reach humans through the job summary and file annotations,
      # never a PR comment: the action is granted no comment tool, so asking
      # Claude to post one gave it no tool to post with, and the findings
      # were discarded (laurigates/.github#47). Both channels work with the
      # permissions the job holds.
      #
      # Guard is `outcome != 'skipped'`, not `== 'success'`: a failed run can
      # still carry findings. The action sets its `structured_output` output
      # only on a clean success, so the block reads the last `result` message
      # in the action's execution file instead, which recovers the payload
      # from a result flagged is_error and from a success result the action
      # rejects for overrunning --max-turns. An `error_*` result (max turns,
      # budget) normally carries none and degrades below. Gating on success
      # would discard exactly the findings that cost the most to produce.
      #
      # `steps.analyze` is the analysis STEP. Several of these workflows also
      # name their JOB `analyze`; jobs and steps are separate namespaces, so
      # this resolves to the step.
      - name: Publish findings
        id: publish
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        env:
          # A PATH, not the payload (laurigates/.github#61): an env string of
          # 131072 bytes or more (MAX_ARG_STRLEN) fails the execve of this
          # step's own shell with E2BIG before line 1 runs, and interpolating
          # the payload into the script body is a shell injection. The file
          # is the action's transcript, a JSON array of SDK messages.
          EXECUTION_FILE: ${{ steps.analyze.outputs.execution_file }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TITLE: 'Dependency Security Audit'
          BLOCKING_SEVERITIES: 'Critical,High'
          COUNT_KEYS: 'total_vulnerabilities,critical_high'
        run: |
          set -euo pipefail
          # GitHub discards a step summary over 1 MiB, silently. Cap below it.
          # This is the real ceiling on rendered output: the payload travels
          # as a file, never as an env or argv string, so the kernel's
          # per-string MAX_ARG_STRLEN no longer bounds it.
          SUMMARY_MAX_BYTES=900000
          # GitHub surfaces at most 10 annotations per level per step and 50
          # per job (actions/toolkit docs/problem-matchers.md); the summary
          # always carries the complete list.
          ANNOTATION_LIMIT=10

          # The payload is the last `result` message's structured_output,
          # extracted to a file once. The transcript also holds every tool
          # result, so only that field is selected and nothing else of it is
          # printed. `|| :` because an unreadable transcript must reach the
          # degrade branch below, not abort the step under `set -e`.
          PAYLOAD="$RUNNER_TEMP/publish-findings-input.json"
          : > "$PAYLOAD"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -c 'if type == "array" then [.[] | objects | select(.type == "result")] | last | .structured_output // empty else empty end' "$EXECUTION_FILE" > "$PAYLOAD" 2>/dev/null || : > "$PAYLOAD"
          fi

          # jq exits 0 on empty input, so an unguarded run would publish
          # nothing and say nothing -- the exact silence this block ends.
          #
          # `findings` is shape-checked here rather than inside each jq
          # program: a non-array there aborts jq under `set -e` and takes the
          # summary, the annotations AND the outputs down with it. Degrading
          # to this branch reports the failure and still emits zeroed counts.
          if [ ! -s "$PAYLOAD" ] || ! jq -e 'type == "object" and ((.findings // []) | type) == "array"' "$PAYLOAD" >/dev/null 2>&1; then
            if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
              WHY="the action exposed no execution file"
            else
              WHY="absent, unparseable, or 'findings' not an array"
            fi
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}' and produced no usable structured output ($WHY), so no findings could be published."
            echo "::warning::$MSG"
            printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
            { printf 'blocking=0\nitemised=0\n'
              printf '%s\n' "${COUNT_KEYS:-}" | tr ',' '\n' | sed '/^$/d;s/^/count_/;s/$/=0/'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ANALYZE_OUTCOME" != "success" ]; then
            MSG="$TITLE: the analysis step reported '${ANALYZE_OUTCOME}'; the findings below may be incomplete."
            echo "::warning::$MSG"
            printf '%s\n\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Counts render from whatever top-level numbers this workflow's
          # schema declares, so this block stays byte-identical across every
          # analysis workflow and the drift check can compare it.
          # `sev as $s | $b | index($s)`: inside index(), the input is $b, so
          # a bare `$b | index(sev)` silently reads $b.severity. Verified.
          jq -r --arg title "$TITLE" --arg blocking "${BLOCKING_SEVERITIES:-}" '
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | "## \($title)", "",
              (to_entries | map(select(.value | type == "number"))
                | map("**\(.key | gsub("_"; " ")):** \(.value)")
                | if length == 0 then "_No counts reported._" else join(" · ") end),
              "",
              (if ($f | length) == 0 then "No findings reported.", ""
               else ($f | map(
                 "### \(sev) — \(.category // "Uncategorised")", "",
                 (if (.file // "") != "" then "`\(.file | ltrimstr("./"))\(if .line then ":\(.line)" else "" end)`", "" else empty end),
                 (.description // "_no description supplied_"), "",
                 (if (.remediation // "") != "" then "**Remediation:** \(.remediation)", "" else empty end)
               ) | .[])
               end)
          ' "$PAYLOAD" > "$RUNNER_TEMP/publish-findings-summary.md"

          if [ "$(wc -c < "$RUNNER_TEMP/publish-findings-summary.md")" -gt "$SUMMARY_MAX_BYTES" ]; then
            head -c "$SUMMARY_MAX_BYTES" "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n_Summary truncated at %s bytes; remaining findings omitted._\n' "$SUMMARY_MAX_BYTES" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$TITLE: job summary truncated at $SUMMARY_MAX_BYTES bytes."
          else
            cat "$RUNNER_TEMP/publish-findings-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          # File annotations render on the PR's Files tab with no comment
          # permission. Payloads MUST be escaped: an unescaped newline splits
          # the annotation, an unescaped % corrupts it, and an unescaped comma
          # in the path breaks property parsing. `severity` is escaped along
          # with the rest -- the schema's enum is a request to the model, not
          # a constraint the runner applies, so a newline in it would emit a
          # second line that GitHub parses as its own workflow command.
          # `line` is type-checked rather than escaped: a string there injects
          # further annotation properties (`line=1,col=9,endLine=99`), and jq
          # truthiness admits `line=0`, which GitHub does not accept as an
          # anchor.
          jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --argjson limit "$ANNOTATION_LIMIT" '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def sev: .severity // "Unrated";
            ($blocking | split(",") | map(select(length > 0))) as $b
            | def rank: sev as $s | if ($b | index($s)) then 0 else 1 end;
              ((.findings // []) | map(select(type == "object")) | sort_by(rank)) as $f
            | ($f[:$limit][]
               | (sev as $s | if ($b | index($s)) then "error" else "warning" end) as $lvl
               | (if (.file // "") != "" then " file=\(.file | ltrimstr("./") | esc | gsub(","; "%2C"))\(if ((.line | type) == "number" and .line > 0) then ",line=\(.line)" else "" end)" else "" end) as $loc
               | "::\($lvl)\($loc)::[\(sev | esc)] [\(.category // "Uncategorised" | esc)] \(.description // "no description" | esc)"),
              (if ($f | length) > $limit then "::notice::\(($f | length) - $limit) further finding(s) appear in the job summary only." else empty end)
          ' "$PAYLOAD"

          # $GITHUB_OUTPUT is a `key=value` file, so a newline inside a count
          # opens a second line: `total_issues` of "0\nblocking=0" would
          # overwrite the blocking count a caller gates on. Counts are
          # type-checked rather than escaped, because a count that is not a
          # number is not a count.
          jq -r --arg blocking "${BLOCKING_SEVERITIES:-}" --arg keys "${COUNT_KEYS:-}" '
            . as $root
            | def sev: .severity // "Unrated";
              ($blocking | split(",") | map(select(length > 0))) as $b
            | ((.findings // []) | map(select(type == "object"))) as $f
            | "blocking=\($f | map(select(sev as $s | $b | index($s))) | length)",
              "itemised=\($f | length)",
              (($keys | split(",") | map(select(length > 0)) | .[]) | "count_\(.)=\(if ($root[.] | type) == "number" then $root[.] else 0 end)")
          ' "$PAYLOAD" >> "$GITHUB_OUTPUT"

      # A check that never ran reports 'pass'. Without this the green tick on
      # a PR that matched no files is indistinguishable from a clean scan.
      #
      # `!failure()` as well as `!cancelled()`: a failed checkout or file-list
      # step also leaves `analyze` skipped, and on that red job the message
      # below would assert nothing matched, which is not what happened. The
      # reason is passed in rather than inferred, because the gate that skips
      # the analysis is not the same one in every workflow.
      - name: Report that nothing was scanned
        if: ${{ !cancelled() && !failure() && steps.analyze.outcome == 'skipped' }}
        env:
          TITLE: 'Dependency Security Audit'
          SKIPPED_FOR_SIZE: ${{ steps.changed.outputs.skip }}
          UNSUPPORTED_EVENT: ${{ steps.event.outputs.unsupported }}
          NOTHING_SCANNED_REASON: 'no lockfile changed, or the audit command produced no output'
        run: |
          set -euo pipefail
          if [ -n "${UNSUPPORTED_EVENT:-}" ]; then
            REASON="this workflow does not support the '$UNSUPPORTED_EVENT' trigger (anthropics/claude-code-action rejects it); call it from pull_request"
          elif [ "${SKIPPED_FOR_SIZE:-false}" = "true" ]; then
            REASON="the PR diff exceeded max-diff-lines, so the diff-size gate skipped the analysis"
          else
            REASON="${NOTHING_SCANNED_REASON:-the analysis step did not run}"
          fi
          MSG="$TITLE: no analysis ran — $REASON. This check is green because nothing was scanned, not because nothing was found."
          echo "::notice::$MSG"
          printf '## %s\n\n%s\n' "$TITLE" "$MSG" >> "$GITHUB_STEP_SUMMARY"
      # ---- END shared publish block ----

      # The analysis step runs with continue-on-error, because the action
      # fails it whenever --json-schema is set and a run that otherwise
      # succeeded returns no structured_output (anthropics/claude-code-action
      # base-action/src/run-claude-sdk.ts). Emission is not deterministic:
      # the same SHA has produced it on one attempt and not the next
      # (laurigates/.github#65).
      # This step decides from Claude's own final `result` message, which the
      # action writes to execution_file before that check and exposes on the
      # failure path too, whether the job should go red:
      #   success, is_error false, no structured_output -> warning, green
      #   anything else that failed the analysis step    -> error, red
      # Two edges, both deliberate:
      # error_max_structured_output_retries (the model failed to produce
      # schema-valid output) is red, like every other non-success subtype;
      # and a success run with no structured_output is green even when it
      # overran --max-turns (the action's own overrun check), because this
      # step does not compare num_turns with max-turns.
      # Outside the shared publish block on purpose, so the block stays
      # byte-identical to the copies it is drift-checked against.
      - name: Classify analysis outcome
        id: verdict
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.analyze.outputs.execution_file }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TITLE: 'Dependency Security Audit'
        run: |
          set -euo pipefail
          # A step that succeeded needs no classifying.
          if [ "$ANALYZE_OUTCOME" = "success" ]; then
            exit 0
          fi

          fail() {
            echo "::error::$TITLE: $1"
            printf '%s: %s\n' "$TITLE" "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and left no execution file, so Claude produced no result. The cause is in the analysis step's log."
          fi

          # The file is a JSON array of SDK messages; the last `result`
          # message is Claude's own account of how the run ended.
          if ! RESULT="$(jq -c '[.[]? | objects | select(.type == "result")] | last // empty' "$EXECUTION_FILE" 2>/dev/null)"; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and its execution file is not a JSON array of SDK messages."
          fi
          if [ -z "$RESULT" ]; then
            fail "the analysis step reported '${ANALYZE_OUTCOME}' and Claude never sent a result message (the SDK run was cut short). The cause is in the analysis step's log."
          fi

          # Every value interpolated into a workflow command is escaped: the
          # SDK's error strings can carry newlines, and a newline would end
          # the annotation and start a new command. `word` maps an empty
          # value to 'unknown': tab is IFS whitespace, so `read` collapses
          # an empty @tsv field and would shift every later field left.
          read -r SUBTYPE IS_ERROR TURNS HAS_OUTPUT < <(printf '%s' "$RESULT" | jq -r '
            def word: tostring | gsub("[^A-Za-z0-9_.-]"; "_") | if . == "" then "unknown" else . end;
            [(.subtype // "unknown" | word), (.is_error == true), (.num_turns // "unknown" | word),
             (has("structured_output") and .structured_output != null)] | @tsv')
          ERRORS="$(printf '%s' "$RESULT" | jq -r '
            (.errors // []) | map(tostring) | join("; ") | .[:500]
            | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")')"

          if [ "$SUBTYPE" = "success" ] && [ "$IS_ERROR" = "false" ]; then
            if [ "$HAS_OUTPUT" = "false" ]; then
              MSG="$TITLE: Claude finished the analysis ($TURNS turns) but returned no structured output, so this run has no verdict and nothing was published. The job is not failed for a missing report; re-run it to get one."
              echo "::warning::$MSG"
              printf '%s\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            fail "Claude finished the analysis ($TURNS turns) with structured output, but the action failed the step anyway; the findings above were published from its execution file and may be incomplete. The analysis step's log names the reason (a run over --max-turns is one)."
          fi

          case "$SUBTYPE" in
            error_max_turns)
              fail "Claude stopped at the max-turns limit after $TURNS turns without finishing, so the scan is incomplete. Raise max-turns or narrow file-patterns." ;;
            error_max_budget_usd)
              fail "Claude stopped at the max-budget-usd ceiling after $TURNS turns without finishing, so the scan is incomplete. Raise max-budget-usd." ;;
            success)
              fail "Claude's result reported is_error, so the run errored without producing a real result.${ERRORS:+ Errors: $ERRORS}" ;;
            *)
              fail "Claude's run ended with result subtype '$SUBTYPE' after $TURNS turns.${ERRORS:+ Errors: $ERRORS}" ;;
          esac

      # Numeric comparison, never `!= '0'`: GitHub coerces the empty string a
      # skipped publish step leaves behind to 0 for `>`, so this cannot fire on
      # a PR that scanned nothing. It also carries no `always()`, so a failure
      # upstream skips it rather than masking the real error. The analysis
      # step is continue-on-error, so that failure is the Classify step's
      # exit 1: keep this gate after it.
      - name: Check for critical/high issues
        if: inputs.fail-on-high && (steps.publish.outputs.blocking > 0 || steps.publish.outputs.count_critical_high > 0)
        env:
          BLOCKING: ${{ steps.publish.outputs.blocking }}
          REPORTED: ${{ steps.publish.outputs.count_critical_high }}
        run: |
          set -euo pipefail
          if [ "${BLOCKING:-0}" -gt 0 ]; then
            echo "::error::Dependency audit: ${BLOCKING} critical/high finding(s) — annotated on the Files tab, full detail in the job summary."
          else
            echo "::error::Dependency audit reported ${REPORTED} critical/high vulnerabilities but itemised none of them. The scan did not establish anything; re-run it."
          fi
          exit 1
