name: Release Please (Reusable)

on:
  workflow_call:
    inputs:
      config-file:
        description: 'Path to release-please config file'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest-file:
        description: 'Path to release-please manifest file'
        required: false
        type: string
        default: '.release-please-manifest.json'
      app-id:
        description: 'GitHub App client ID (or numeric App ID; client ID recommended). When set, uses an App token (via APP_PRIVATE_KEY) instead of MY_RELEASE_PLEASE_TOKEN.'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label'
        required: false
        type: string
        # release-please is a pure GitHub-API job — no build, no toolchain.
        default: 'ubuntu-slim'
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 15
      skip-on-release-commit:
        description: 'Skip the job when the head commit message starts with "chore(main): release" to prevent cascading releases.'
        required: false
        type: boolean
        default: false
      missed-release-check:
        description: >-
          Guard against release-please silently considering zero commits (e.g. a
          conventional-commit parse error on a squash body). "warn" annotates,
          "error" fails the job, "off" disables the check.
        required: false
        type: string
        default: 'warn'
      releasable-types:
        description: 'Comma-separated conventional-commit types the guard treats as release-worthy.'
        required: false
        type: string
        default: 'feat,fix,perf,revert'
      pr-assignees:
        description: >-
          Comma-separated GitHub usernames to assign to the release PR, so it
          surfaces under assignee:@me in the GitHub web and mobile dashboards.
          Defaults to the repository owner; set to 'none' to disable.
        required: false
        type: string
        default: ''
    secrets:
      MY_RELEASE_PLEASE_TOKEN:
        description: 'PAT with contents:write and pull-requests:write scopes. Required when app-id is empty.'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App private key. Required when app-id is set.'
        required: false
    outputs:
      release_created:
        description: 'Whether a release was created'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: 'The tag name of the release'
        value: ${{ jobs.release-please.outputs.tag_name }}
      missed_release:
        description: 'true when releasable commits were pushed but release-please produced neither a release PR nor a release'
        value: ${{ jobs.release-please.outputs.missed_release }}

# Prevent concurrent runs racing on the release-please branch.
concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Skip release-please's own merge commits when skip-on-release-commit is true.
    if: >-
      inputs.skip-on-release-commit != true ||
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      missed_release: ${{ steps.missed-release.outputs.missed_release }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          token: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.MY_RELEASE_PLEASE_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # A release PR is bot-authored and mentions nobody, so it matches none of
      # GitHub's dashboard/mobile feeds — not author:@me, not review-requested:@me,
      # not even involves:@me. Assigning is the only thing that files it under a
      # human. Runs before the missed-release guard so an `error`-mode failure
      # there cannot skip it.
      #
      # @me is unusable: gh resolves it to the *token* owner, which is the App
      # bot whenever app-id is set. The assignee must be a literal username.
      - name: Assign the release PR
        id: assign
        env:
          GH_TOKEN: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ASSIGNEES: ${{ inputs.pr-assignees || github.repository_owner }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          # '' means "fall back to the owner", so the opt-out needs a sentinel.
          if [ -z "$ASSIGNEES" ] || [ "$ASSIGNEES" = 'none' ]; then
            echo "pr-assignees disabled — skipping."
            exit 0
          fi

          # `prs` is set whenever release-please created *or updated* a PR this
          # run, and each PullRequest object carries .number — so this covers
          # every run that touches the PR, and the manifest/monorepo case where
          # there is more than one.
          NUMBERS=$(printf '%s' "${PRS_JSON:-}" \
            | jq -r 'if type == "array" then .[].number else empty end' 2>/dev/null || true)

          # release-please touched nothing this run (no releasable commits, or a
          # swallowed parse). Assign whatever release PR is already open, so an
          # existing one still gets filed and a previously failed assign heals.
          if [ -z "$NUMBERS" ]; then
            NUMBERS=$(gh pr list --repo "$REPO" --state open --limit 30 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-please--branches--")) | .number' \
              2>/dev/null || true)
          fi

          if [ -z "$NUMBERS" ]; then
            echo "No open release PR to assign."
            exit 0
          fi

          # Never fail the release over bookkeeping: an unknown username, or one
          # without repo access, warns instead of turning a good run red.
          for n in $NUMBERS; do
            if gh pr edit "$n" --repo "$REPO" --add-assignee "$ASSIGNEES" >/dev/null; then
              echo "Assigned $ASSIGNEES to PR #$n"
            else
              echo "::warning::Could not assign '$ASSIGNEES' to PR #$n — check the usernames exist and have repository access, and that the token grants issues:write."
            fi
          done

      # release-please can drop every commit in the pushed range and still exit
      # green — e.g. its conventional-commit parser throws on a squash body (repos
      # with squash_merge_commit_message = PR_BODY get the PR description as the
      # commit body, and a fenced code block there is enough to break the parse).
      # The symptom is the *absence* of a release PR, indistinguishable from
      # "nothing releasable landed". This step makes that non-event visible.
      - name: Check for releasable commits release-please did not consider
        id: missed-release
        if: >-
          github.event_name == 'push' &&
          inputs.missed-release-check != 'off' &&
          steps.release.outputs.releases_created != 'true' &&
          steps.release.outputs.prs_created != 'true'
        env:
          GH_TOKEN: ${{ inputs.app-id != '' && steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MODE: ${{ inputs.missed-release-check }}
          TYPES: ${{ inputs.releasable-types }}
        run: |
          set -euo pipefail

          if [ "$MODE" != 'warn' ] && [ "$MODE" != 'error' ]; then
            echo "::error::missed-release-check must be one of warn, error, off (got '$MODE')"
            exit 1
          fi

          # Branch creation pushes an all-zero "before" — no range to inspect.
          if [ -z "$BEFORE" ] || [ -z "$(printf '%s' "$BEFORE" | tr -d '0')" ]; then
            echo "No usable push range (before='$BEFORE') — skipping check."
            exit 0
          fi

          TYPES_RE=$(printf '%s' "$TYPES" | tr -d '[:space:]' | tr ',' '|')
          if [ -z "$TYPES_RE" ]; then
            echo "releasable-types is empty — skipping check."
            exit 0
          fi
          export TYPES_RE

          # A force-push or pruned commit makes the range unresolvable; that is
          # not evidence of a swallowed release, so stay quiet.
          if ! COMPARE=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" 2>/dev/null); then
            echo "::notice::Could not compare $BEFORE...$AFTER — skipping missed-release check."
            exit 0
          fi

          RELEASABLE=$(printf '%s' "$COMPARE" | jq -c '
            [ .commits[]
              | { sha: .sha[0:7],
                  subject: (.commit.message | split("\n")[0]),
                  message: .commit.message }
              | select(.subject | test("^chore\\((main|master)\\): release") | not)
              | select(
                  (.subject | test("^(" + env.TYPES_RE + ")(\\([^()]*\\))?!?:")) or
                  (.message | test("(^|\n)BREAKING[ -]CHANGE"))
                )
            ]')
          COUNT=$(printf '%s' "$RELEASABLE" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "missed_release=false" >> "$GITHUB_OUTPUT"
            echo "No release PR was expected: the pushed range holds no releasable commits."
            exit 0
          fi

          echo "missed_release=true" >> "$GITHUB_OUTPUT"

          SUBJECTS=$(printf '%s' "$RELEASABLE" | jq -r '.[] | "- `\(.sha)` \(.subject)"')

          {
            echo "### release-please produced no release for $COUNT releasable commit(s)"
            echo
            echo "Pushed range: \`$BEFORE\` → \`$AFTER\`"
            echo
            echo "$SUBJECTS"
            echo
            echo "release-please reported neither a release PR nor a release. The usual"
            echo "cause is a conventional-commit parse error on one of these commits'"
            echo "bodies — with \`squash_merge_commit_message = PR_BODY\`, the PR"
            echo "description becomes the commit body, and a fenced code block there can"
            echo "throw the parser (\"unexpected token at L:C\"), discarding every commit"
            echo "in the range."
            echo
            echo "Fixes: check this run's release-please log for a parse error, then land"
            echo "a fence-free commit restating the change, or switch the repo to"
            echo "\`squash_merge_commit_message = COMMIT_MESSAGES\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$SUBJECTS"

          MSG="release-please cut no release despite $COUNT releasable commit(s) in $BEFORE...$AFTER — check the release-please log for a conventional-commit parse error."
          if [ "$MODE" = 'error' ]; then
            echo "::error::$MSG"
            exit 1
          fi
          echo "::warning::$MSG"
