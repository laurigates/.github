            EOF
            )"
            ```

            Skip file sections that have no relevant changes — empty sections are noise.

            ## Step 4: Ratchet `${{ inputs.version-file }}`

            Edit in place:
            - `lastCheckedVersion` = `${{ needs.check-changelog.outputs.effective_latest }}`
            - `lastCheckedDate` = today (YYYY-MM-DD)
            - Prepend a new entry to `reviewedChanges` with `version`, `date`, `relevantChanges` (array of headline bullets), `actionsRequired` (array referencing the issue number from Step 3 — e.g. `"See issue #N for rule update plan"`)

            ## Step 5: Branch, commit, push, JSON-only PR

            ```bash
            BR="chore/changelog-triage-${{ needs.check-changelog.outputs.effective_latest }}"
            git switch -c "$BR"
            git add ${{ inputs.version-file }}
            git status --short      # confirm only the JSON is staged
            git commit -m "${{ inputs.commit-type-scope }}: ratchet changelog tracking to ${{ needs.check-changelog.outputs.effective_latest }}"
            git push -u origin "$BR"
            gh pr create \
              --title "${{ inputs.commit-type-scope }}: ratchet changelog tracking to ${{ needs.check-changelog.outputs.effective_latest }}" \
              --label "${{ inputs.issue-labels }}" \
              --assignee "${{ inputs.issue-assignee || github.repository_owner }}" \
              --body "Ratchets \`${{ inputs.version-file }}\` to ${{ needs.check-changelog.outputs.effective_latest }}. Rule edits are tracked in the linked triage issue.

            Refs the triage issue opened in Step 3."
            ```

