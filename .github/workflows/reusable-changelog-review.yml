# Reusable changelog-review workflow: watches an upstream CHANGELOG (Claude
# Code's by default), and when new versions land, runs a two-job pipeline:
#
#   1. check-changelog — pure bash gate: fetch the changelog, compare the
#      latest version against a tracking JSON in the calling repo, skip when
#      an open tracking issue already covers the range (idempotency), slice
#      the new-versions excerpt, and run the CALLER-SUPPLIED analyzer script
#      to surface candidate files (the repo-specific keyword→file mapping
#      lives in the caller's repo, next to its tests).
#   2. claude-triage — one Claude Code run that WRITES the tracking-issue body
#      and the state-file entry, then one bash step that files the issue
#      exactly once, applies labels and assignee, ratchets the tracking JSON
#      from what it verified, and opens ONE tiny JSON-only PR. Rule/code edits
#      are follow-up work driven by the issue, never done here.
#
# Calling workflow should trigger on:
#   schedule:
#     - cron: '0 9 * * 1'
#   workflow_dispatch:
#     inputs:
#       force_full_review:
#         type: boolean
#         default: false
#
# Notes:
#   - The analyzer script runs from the caller's checkout; `analyzer-script`
#     is required and must exist in the calling repo.
#   - On the GITHUB_TOKEN fallback (no RELEASE_PLEASE_TOKEN passed), the
#     branch pushed by the triage job will not trigger downstream workflows.
#   - The prompt's worked examples (#1638, #1541, TaskOutput) originate from
#     laurigates/claude-plugins, the first consumer — they are kept because
#     they encode the triage failure modes this pipeline exists to prevent.

name: Changelog Review (Reusable)

on:
  workflow_call:
    inputs:
      force-full-review:
        description: 'Force triage even if a tracking issue for the current range already exists'
        required: false
        default: false
        type: boolean
      changelog-url:
        description: 'Raw URL of the upstream changelog to watch'
        required: false
        default: 'https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md'
        type: string
      version-file:
        description: 'Path (in the calling repo) of the tracking JSON with lastCheckedVersion'
        required: false
        default: '.claude-code-version-check.json'
        type: string
      analyzer-script:
        description: 'Path (in the calling repo) of the analyzer script invoked as: bash <script> --excerpt <file> --repo-dir <dir> --tracked <ver> --latest <ver>'
        required: true
        type: string
      tracking-label:
        description: 'Label that identifies open tracking issues for the skip-if-exists check'
        required: false
        default: 'changelog-review'
        type: string
      issue-labels:
        description: 'Comma-separated labels applied to the tracking issue and the ratchet PR'
        required: false
        default: 'changelog-review,maintenance'
        type: string
      issue-assignee:
        description: 'Assignee for the tracking issue and ratchet PR (defaults to the repository owner)'
        required: false
        default: ''
        type: string
      commit-type-scope:
        description: 'Conventional-commit type(scope) prefix for the ratchet commit and PR title, e.g. chore(project-plugin)'
        required: false
        default: 'chore'
        type: string
      rule-file-sections:
        description: 'Newline-separated repo-designated files the tracking issue should carry a follow-up section for (in addition to analyzer candidates)'
        required: false
        default: ''
        type: string
      plugins:
        description: 'Newline-separated Claude Code plugins to load in the triage run'
        required: false
        default: ''
        type: string
      plugin-marketplaces:
        description: 'Newline-separated plugin marketplace URLs for the triage run'
        required: false
        default: ''
        type: string
      model:
        description: 'Claude model for the triage run'
        required: false
        default: 'opus'
        type: string
      effort:
        description: 'Claude effort level for the triage run'
        required: false
        default: 'medium'
        type: string
      max-turns:
        description: 'Max turns for the triage run'
        required: false
        default: 25
        type: number
      max-versions-per-run:
        description: 'Cap on upstream versions triaged in one run; the excerpt is windowed to the OLDEST N after lastCheckedVersion and the ratchet stops there, so the next run picks up the remainder. 0 disables windowing.'
        required: false
        # 25 matches the review-stall threshold the first consumer's analyzer
        # already enforces (it emits TYPE=oversized_batch above 25 versions),
        # so the default window never trips the caller's own warning.
        default: 25
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      RELEASE_PLEASE_TOKEN:
        description: 'PAT with contents/issues/pull-requests write (falls back to GITHUB_TOKEN; fallback-pushed branches do not trigger downstream workflows)'
        required: false

concurrency:
  group: changelog-review-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check-changelog:
    # ubuntu-slim: pure bash gate (curl/grep/jq/gh). The `claude-triage` job
    # below stays on ubuntu-latest.
    runs-on: ubuntu-slim
    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      latest_version: ${{ steps.compare.outputs.latest_version }}
      previous_version: ${{ steps.read_tracked.outputs.tracked_version }}
      changes_summary: ${{ steps.analyze.outputs.summary }}
      candidate_rules: ${{ steps.analyze.outputs.candidates }}
      deprecated_tokens: ${{ steps.analyze.outputs.deprecated_tokens }}
      analysis_status: ${{ steps.analyze.outputs.analysis_status }}
      # Upper bound of the range this run actually triages. Equals
      # latest_version unless the excerpt was windowed (see the analyze step);
      # the triage job ratchets to THIS, never to latest_version.
      effective_latest: ${{ steps.analyze.outputs.effective_latest }}
      windowed: ${{ steps.analyze.outputs.windowed }}
      total_new_versions: ${{ steps.analyze.outputs.total_new_versions }}
      existing_issue: ${{ steps.existing.outputs.issue_number }}
      should_skip: ${{ steps.existing.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream changelog
        id: fetch
        env:
          CHANGELOG_URL: ${{ inputs.changelog-url }}
        run: |
          curl -s "$CHANGELOG_URL" > /tmp/changelog.md
          echo "Fetched changelog"

      - name: Extract latest version
        id: extract
        run: |
          # Extract first version number from changelog
          # Handles both "## 2.1.50" and "## [2.1.50]" formats
          # `|| true` so an unexpectedly version-less changelog reaches the
          # explicit error guard below instead of dying opaquely on pipefail
          # (GitHub Actions runs steps with `bash -eo pipefail` by default).
          LATEST=$(grep -oP '## \[?\K[0-9]+\.[0-9]+\.[0-9]+' /tmp/changelog.md | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to extract version from changelog"
            exit 1
          fi
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest upstream version: $LATEST"

      - name: Read last checked version
        id: read_tracked
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          if [ -f "$VERSION_FILE" ]; then
            TRACKED=$(jq -r '.lastCheckedVersion' "$VERSION_FILE")
          else
            TRACKED="0.0.0"
          fi
          echo "tracked_version=$TRACKED" >> "$GITHUB_OUTPUT"
          echo "Last checked version: $TRACKED"

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.extract.outputs.latest_version }}
          TRACKED: ${{ steps.read_tracked.outputs.tracked_version }}
          FORCE: ${{ inputs.force-full-review }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced full triage requested"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare semantic versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          if version_gt "$LATEST" "$TRACKED"; then
            echo "New version detected: $TRACKED -> $LATEST"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new versions since $TRACKED"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"

      # Provision every label the pipeline will reference, BEFORE anything
      # uses one. `gh issue create --label <unknown>` hard-fails, and in the
      # triage prompt that call is the job's last line — the whole analysis is
      # already paid for by then. `gh issue list --label` is likewise happier
      # with a label that exists.
      #
      # The colour is a QUOTED string: bare `5319e7` is a YAML 1.2 float
      # (5319 x 10^7), which reaches `gh label create` as `53190000000` and
      # earns an HTTP 422. Same bug that was killing claude-plugins' docs-index
      # audit.
      #
      # Create-if-missing, not `--force`: --force rewrites an existing label's
      # colour and description, so a shared label like `maintenance` would be
      # recoloured every Monday.
      - name: Ensure tracking labels exist
        if: steps.compare.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TRACKING_LABEL: ${{ inputs.tracking-label }}
          ISSUE_LABELS: ${{ inputs.issue-labels }}
          LABEL_COLOR: '5319e7'
        run: |
          set -uo pipefail
          # A label that cannot be provisioned is a warning, not a failure: the
          # label may exist under different casing, or the token may lack the
          # scope. Failing here would throw away a run that could still triage.
          printf '%s\n%s\n' "$TRACKING_LABEL" "${ISSUE_LABELS//,/$'\n'}" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u \
            | while IFS= read -r label; do
                if out=$(gh label create "$label" \
                          --repo "$GITHUB_REPOSITORY" \
                          --color "$LABEL_COLOR" \
                          --description "Upstream changelog triage" 2>&1); then
                  echo "created label: $label"
                elif printf '%s' "$out" | grep -qi 'already exists'; then
                  echo "label present: $label"
                else
                  echo "::warning::could not provision label '$label': $out"
                fi
              done

      # Skip-if-exists check: if a tracking issue already covers this range,
      # don't re-triage. This makes the workflow idempotent and prevents the
      # "next run on top of an open backlog" failure mode.
      - name: Check for existing tracking issue
        id: existing
        if: steps.compare.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force-full-review }}
          TRACKED: ${{ steps.read_tracked.outputs.tracked_version }}
          LATEST: ${{ steps.extract.outputs.latest_version }}
          TRACKING_LABEL: ${{ inputs.tracking-label }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "Force flag set — bypassing skip-if-exists"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip only when an OPEN tracking issue already covers up to LATEST
          # (its title's upper-bound version is >= LATEST). When LATEST has
          # advanced *beyond* every open issue's range, re-triage — an
          # open-but-unactioned issue must NOT suppress newer versions forever
          # (the claude-plugins#1541 backlog trap that froze tracking at
          # 2.1.138). --json + jq keeps the empty case exit-0.
          ROWS=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$TRACKING_LABEL" \
            --state open \
            --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"')

          should_skip=false
          issue_number=
          covering=
          while IFS=$'\t' read -r num title; do
            [ -z "$num" ] && continue
            # The version after the arrow is the range's upper bound; fall back
            # to the last version token in the title.
            # `|| true`: a version-less issue title makes grep match nothing,
            # which under `set -euo pipefail` would fail this bare assignment
            # BEFORE the line below can skip it (the claude-plugins#1638
            # freeze cause). The guard then handles the empty case.
            upper=$(printf '%s' "$title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1 || true)
            [ -z "$upper" ] && continue
            # Covered iff LATEST is not newer than this issue's upper bound.
            highest=$(printf '%s\n%s\n' "$LATEST" "$upper" | sort -V | tail -1)
            if [ "$highest" = "$upper" ]; then
              should_skip=true
              issue_number="$num"
              covering="$upper"
              break
            fi
          done <<< "$ROWS"

          if [ "$should_skip" = "true" ]; then
            echo "Open tracking issue #$issue_number covers up to $covering (>= $LATEST) — skipping triage"
          elif [ -n "$ROWS" ]; then
            echo "::warning::Open tracking issue(s) exist but none covers up to $LATEST — re-triaging the new range (avoids the unactioned-backlog trap, claude-plugins#1638)"
          else
            echo "No open tracking issue for $TRACKED → $LATEST — triage will run"
          fi
          echo "should_skip=$should_skip" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Slice changelog and identify candidate files
        id: analyze
        if: steps.compare.outputs.has_updates == 'true' && steps.existing.outputs.should_skip != 'true'
        env:
          TRACKED: ${{ steps.read_tracked.outputs.tracked_version }}
          LATEST: ${{ steps.extract.outputs.latest_version }}
          ANALYZER_SCRIPT: ${{ inputs.analyzer-script }}
          MAX_VERSIONS: ${{ inputs.max-versions-per-run }}
        run: |
          set -euo pipefail

          # Slice the changelog down to just the new versions. Keyword counts
          # below run on the slice only — counting against the full file
          # (hundreds of versions of history) inflates every number and made
          # the summary useless as a prompt signal.
          awk -v tracked="$TRACKED" '
            /^## \[?[0-9]+\.[0-9]+\.[0-9]+/ {
              if (match($0, /[0-9]+\.[0-9]+\.[0-9]+/)) {
                v = substr($0, RSTART, RLENGTH)
                if (v == tracked) exit
              }
            }
            { print }
          ' /tmp/changelog.md > /tmp/excerpt.md

          if [ ! -s /tmp/excerpt.md ]; then
            echo "::error::Excerpt is empty — tracked version $TRACKED not found in changelog"
            exit 1
          fi

          # Window a large backlog instead of truncating it. The excerpt is
          # newest-first, so the old `head -c 204800` kept the NEWEST bytes and
          # silently dropped the oldest versions — while the triage job still
          # ratcheted lastCheckedVersion to $LATEST, permanently skipping them.
          # A 2.1.185 → 2.1.259 catch-up is 61 versions / ~216KB and hit that
          # path exactly.
          #
          # Instead: keep the OLDEST $MAX_VERSIONS versions after $TRACKED and
          # ratchet only to the top of that window. The range is then covered
          # in order, and the next scheduled run continues from where this one
          # stopped (LATEST still exceeds the new tracked version, so the
          # skip-if-exists check lets it through).
          TOTAL_NEW=$(grep -cE '^## \[?[0-9]+\.[0-9]+\.[0-9]+' /tmp/excerpt.md || true)
          EFFECTIVE_LATEST="$LATEST"
          WINDOWED=false
          if [ "${MAX_VERSIONS:-0}" -gt 0 ] && [ "$TOTAL_NEW" -gt "$MAX_VERSIONS" ]; then
            SKIP=$((TOTAL_NEW - MAX_VERSIONS))
            # Drop the newest $SKIP version blocks (and the pre-first-header
            # preamble); what remains is the oldest $MAX_VERSIONS, still
            # newest-first within the window.
            awk -v skip="$SKIP" '
              /^## \[?[0-9]+\.[0-9]+\.[0-9]+/ { n++ }
              n > skip { print }
            ' /tmp/excerpt.md > /tmp/excerpt-window.md
            mv /tmp/excerpt-window.md /tmp/excerpt.md
            EFFECTIVE_LATEST=$(grep -oP '## \[?\K[0-9]+\.[0-9]+\.[0-9]+' /tmp/excerpt.md | head -1 || true)
            if [ -z "$EFFECTIVE_LATEST" ]; then
              echo "::error::Windowing produced an excerpt with no version header"
              exit 1
            fi
            WINDOWED=true
            echo "::warning::$TOTAL_NEW new versions ($TRACKED → $LATEST) exceeds max-versions-per-run=$MAX_VERSIONS — triaging $TRACKED → $EFFECTIVE_LATEST this run; the remainder follows on the next run"
          fi

          EXCERPT_BYTES=$(wc -c < /tmp/excerpt.md)
          echo "Excerpt: $(wc -l < /tmp/excerpt.md) lines, $EXCERPT_BYTES bytes ($TRACKED → $EFFECTIVE_LATEST of $TOTAL_NEW new versions)"

          # Loud, not lossy. With windowing off (max-versions-per-run: 0) the
          # caller has opted into an unbounded excerpt; warn rather than
          # silently trim, because trimming while still ratcheting to the top
          # of the range is how versions get skipped for good.
          if [ "$EXCERPT_BYTES" -gt 204800 ]; then
            echo "::warning::Excerpt is $EXCERPT_BYTES bytes with windowing disabled — set max-versions-per-run to bound the triage run"
          fi

          # Delegate keyword counting, the deprecation dimension, and the
          # deprecation→code candidate bridge to the caller's analyzer script
          # (the repo-specific keyword→file mapping lives in the calling repo,
          # next to its tests). Expected to emit ===/KEY=VALUE/STATUS= blocks.
          if [ ! -f "$ANALYZER_SCRIPT" ]; then
            echo "::error::analyzer-script '$ANALYZER_SCRIPT' not found in the calling repo's checkout"
            exit 1
          fi
          ANALYSIS=$(bash "$ANALYZER_SCRIPT" \
            --excerpt /tmp/excerpt.md --repo-dir "$PWD" --tracked "$TRACKED" --latest "$EFFECTIVE_LATEST")
          echo "$ANALYSIS"

          # `|| true` on each: a field the analyzer doesn't emit makes grep
          # match nothing, which would fail the bare assignment under
          # `set -euo pipefail`. Empty values degrade gracefully downstream.
          SUMMARY=$(echo "$ANALYSIS" | grep -E '^SUMMARY=' | head -1 | cut -d= -f2- || true)
          ANALYSIS_STATUS=$(echo "$ANALYSIS" | grep -E '^STATUS=' | head -1 | cut -d= -f2- || true)
          DEPRECATED_TOKENS=$(echo "$ANALYSIS" | grep -E '^DEPRECATED_TOKENS=' | head -1 | cut -d= -f2- || true)
          # Candidate files: the indented lines between CANDIDATES: and the footer.
          CANDIDATE_LIST=$(echo "$ANALYSIS" | awk '
            /^CANDIDATES:/ { f = 1; next }
            /^=== END/     { f = 0 }
            f { gsub(/^[[:space:]]+/, ""); if (length) print }')
          [ -z "$CANDIDATE_LIST" ] && CANDIDATE_LIST="(none — keyword counts are zero; only the tracking JSON likely needs an update)"

          {
            echo "summary=$SUMMARY"
            echo "analysis_status=$ANALYSIS_STATUS"
            echo "effective_latest=$EFFECTIVE_LATEST"
            echo "windowed=$WINDOWED"
            echo "total_new_versions=$TOTAL_NEW"
            echo "deprecated_tokens=$DEPRECATED_TOKENS"
            echo "candidates<<__CHANGELOG_REVIEW_EOF__"
            echo "$CANDIDATE_LIST"
            echo "__CHANGELOG_REVIEW_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "Candidate files:"
          echo "$CANDIDATE_LIST"

      - name: Upload excerpt for triage job
        if: steps.compare.outputs.has_updates == 'true' && steps.existing.outputs.should_skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-excerpt
          path: /tmp/excerpt.md
          retention-days: 7

      - name: Report skip
        if: steps.existing.outputs.should_skip == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.existing.outputs.issue_number }}
          TRACKED: ${{ steps.read_tracked.outputs.tracked_version }}
          LATEST: ${{ steps.extract.outputs.latest_version }}
        run: |
          echo "::notice::Skipped triage — issue #$ISSUE_NUMBER already covers $TRACKED → $LATEST"
          echo "Re-run with workflow_dispatch + force_full_review=true to override."

  claude-triage:
    needs: check-changelog
    if: needs.check-changelog.outputs.has_updates == 'true' && needs.check-changelog.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download pre-sliced changelog excerpt
        uses: actions/download-artifact@v4
        with:
          name: changelog-excerpt
          path: .

      - name: Triage changelog into a tracking issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent only reads with it (`gh issue list`); every write happens
          # in the publish step below.
          github_token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          # Triage is intentionally small-scope work — no rule edits, no
          # publishing. 25 turns is enough headroom for: read inputs,
          # categorize changes, write the issue body and the state entry. If
          # it can't finish in 25 turns, the prompt is wrong and we want to
          # fail fast rather than burn $60 on a misdiagnosis loop.
          #
          # The agent PRODUCES; the next step PUBLISHES (claude-plugins#2720).
          # When the agent ran `gh issue create --label … --assignee …` itself,
          # gh (github.com) filed the issue, then failed the separate
          # replaceActorsForAssignable call the PAT was not allowed to make,
          # and exited non-zero without printing the URL. The agent filed it
          # again: two identical, unlabelled issues per run (#2656/#2657,
          # #2711/#2712), and a state file claiming the labels were applied.
          # So the agent can no longer file, commit, push, or open a PR — the
          # grants below are read-only apart from Write/Edit for its two files.
          #
          # The tool boundary belongs in `--allowedTools`. It used to sit in
          # `additional_permissions:`, but that input takes a GitHub permissions
          # MAP ("actions: read") — a Claude tool list there declared a sandbox
          # that was never applied, so the action's default policy denied every
          # `gh issue create` / `git push`. The SDK exits 0 on a permission
          # denial, so the run went green with nothing filed: 13 consecutive
          # weeks of that in laurigates/claude-plugins (last issue #1733,
          # 2.1.138 → 2.1.185). The discriminating evidence is the job log's
          # `SDK options:` block — `allowedTools` absent entirely, and
          # `permission_denials_count` 6–15 instead of 0–1.
          #
          # Deltas from that inert list:
          #   - WebFetch/WebSearch stay OUT: the prompt says the pre-sliced
          #     excerpt is the authoritative input, so that contract is now
          #     enforced rather than merely asserted. A blocked WebFetch is
          #     exactly why a HEALTHY run still shows one permission denial —
          #     never gate on `permission_denials_count > 0`.
          #   - `gh` is narrowed to `gh issue list` (read-only), not a blanket
          #     `gh *`; git to status/diff/log.
          #   - TodoWrite is a genuine grant, not decoration: since 2.1.233 the
          #     todo/task tools are off by default on current models and naming
          #     one in --allowedTools is the session-wide opt-in.
          #
          # One flag per line: laurigates/claude-plugins'
          # scripts/check-workflow-model.sh matches `--model`/`--effort`
          # anchored at line start inside a folded scalar.
          claude_args: >-
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Edit,Write,Grep,Glob,TodoWrite,Skill,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(gh issue list *),Bash(jq *),Bash(cat *),Bash(date *)"
          prompt: |
            You are TRIAGING upstream changelog changes from ${{ needs.check-changelog.outputs.previous_version }} to ${{ needs.check-changelog.outputs.effective_latest }}.

            **Triage means: write the tracking-issue body and the state-file entry to two files. The workflow step that runs after you files the issue, applies its labels and assignee, ratchets the JSON state file, and opens the PR. DO NOT edit rule files or `${{ inputs.version-file }}`. Rule edits happen in follow-up work driven by the tracking issue.**

            ## Pre-computed inputs (use these — do not re-fetch)

            - **Changelog excerpt**: `excerpt.md` in the repo root contains *only* the new versions, already sliced for you. Read it once with `Read`. Do **not** WebFetch the full changelog.
            - **Keyword counts on the excerpt**: ${{ needs.check-changelog.outputs.changes_summary }}
            - **Candidate files** (rules AND plugin code likely to need follow-up edits — keyword hits plus any skill/hook/agent that references a deprecated identifier):

              ```
              ${{ needs.check-changelog.outputs.candidate_rules }}
              ```

            - **Windowed run?** `${{ needs.check-changelog.outputs.windowed }}` — when `true`, this is a catch-up run: `${{ needs.check-changelog.outputs.total_new_versions }}` versions are outstanding in total, and the excerpt covers only the OLDEST slice of them, up to ${{ needs.check-changelog.outputs.effective_latest }}. Upstream is actually at ${{ needs.check-changelog.outputs.latest_version }}. The workflow ratchets to ${{ needs.check-changelog.outputs.effective_latest }} and **only** to that — the next scheduled run picks up the rest. Say so in the issue body.
            - **Deprecated identifiers referenced in this repo's code**: `${{ needs.check-changelog.outputs.deprecated_tokens }}`
              (empty = none). When non-empty, these are upstream tools/settings that were deprecated/removed/renamed AND are still named in our skills, hooks, or agents — treat each as a **High-impact** item and call out the referencing file(s) from the candidate list. This is the miss class from claude-plugins#1638 (TaskOutput stayed referenced in bash-antipatterns.sh).

            ## Efficiency rules

            - Use `TodoWrite` once at the start to plan, then minimal narration.
            - Read `excerpt.md` once. Read `${{ inputs.version-file }}` once. **Do not read rule files** — that's apply-phase work.
            - Never use `WebFetch` for the changelog or for live docs — the excerpt is the authoritative input. `WebFetch`/`WebSearch` are not in your tool allowlist; a denial there is expected and is not an error to work around.
            - You cannot file issues, commit, push, or open PRs, and you do not need to: the next workflow step does all of it from your two files. Do not mention labels, assignees, or an issue number anywhere — the step records what it actually applied.

            ## Step 1: Read inputs in parallel

            In one message, dispatch parallel `Read` calls for:
            - `excerpt.md` (the changelog excerpt)
            - `${{ inputs.version-file }}` (current tracking state)

            ## Step 2: Categorize changes

            For each version in the excerpt, classify impact on this repo:

            - **High** — breaking changes, new hook events, permission model changes, skill/agent system changes, **deprecations/removals/renames of any tool, setting, command, or env var** (especially when the deprecated-identifiers list above is non-empty)
            - **Medium** — new features worth documenting in rules, behavior changes affecting existing skills
            - **Low** — bug fixes, perf, UI

            Focus areas: hook system, skill/command system, agent/subagent system, permission model, MCP, plugin manifest/marketplace, sandbox, **and deprecations/removals** of tools/settings/commands we reference.

            ## Step 3: Write the tracking-issue body

            Write ONE issue body summarizing the High and Medium changes to `triage-issue-body.md` in the repo root, with the `Write` tool. Group them by candidate file so follow-up apply work is clean. The title is set by the workflow; write only the body, following this template:

            ```markdown
            Triage of upstream changelog ${{ needs.check-changelog.outputs.previous_version }} → ${{ needs.check-changelog.outputs.effective_latest }}.

            **Keyword counts on excerpt:** ${{ needs.check-changelog.outputs.changes_summary }}
            **Deprecated identifiers still referenced in repo code:** ${{ needs.check-changelog.outputs.deprecated_tokens }}
            **Upstream changelog:** https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md

            ## Deprecations referenced in our code (highest priority)

            For each deprecated identifier listed above, cite the upstream version, the replacement, and the referencing file(s) from the candidate list. Leave this section out only when the list is empty. (Catching this class is why claude-plugins#1638 exists.)

            - (e.g. `TaskOutput` deprecated in 2.1.83 → use `Read`; referenced in `hooks-plugin/hooks/bash-antipatterns.sh`)

            ## Follow-up tasks

            For each file below, the listed bullets are the relevant changes from the excerpt. To address: `@claude please update <file> for the bullets listed in this issue`. Cover the files from the candidate list above, plus the repo-designated files here (omit any with no relevant changes):

            ${{ inputs.rule-file-sections }}

            (Add a `### <file>` section per file with its bullets, citing version numbers. Omit sections with no relevant changes. Drop versions that are pure bug fixes / UI / perf.)

            🤖 Triaged with [Claude Code](https://claude.com/claude-code)
            ```

            Skip file sections that have no relevant changes — empty sections are noise.

            ## Step 4: Write the state-file entry

            Write `triage-entry.json` in the repo root, with the `Write` tool: one JSON object with exactly two keys, both arrays of strings.

            ```json
            {
              "relevantChanges": ["<headline bullet, citing the version>", "..."],
              "actionsRequired": ["<follow-up, e.g. which candidate files need edits>", "..."]
            }
            ```

            Refer to the tracking issue as "the tracking issue", never by number. The workflow prepends `See issue #N …` to `actionsRequired`, sets `version`, `date`, `lastCheckedVersion` and `lastCheckedDate` itself, and appends a line recording the labels and assignee it verified on the issue.

            ## Step 5: Final sanity check

            Run `jq . triage-entry.json` and `git status --short`, and confirm:
            - `triage-entry.json` parses and both arrays are non-empty
            - `triage-issue-body.md` exists and is the full issue body
            - No tracked file is modified — in particular not `${{ inputs.version-file }}` or any rule file

            If anything looks wrong, **fix it before finishing the turn**.
          plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
          plugins: ${{ inputs.plugins }}

      # Publishing is deterministic, and happens exactly once (claude-plugins
      # #2720). The issue is filed WITHOUT --label/--assignee: on github.com gh
      # assigns in a second GraphQL call after the issue exists, and a failure
      # there exits non-zero without printing the URL. A failed create is
      # never retried; the open-issue listing is re-read instead, because the
      # issue may exist anyway.
      #
      # Labels and assignee then go through the REST API on the workflow's own
      # token (issues: write), and are READ BACK: the assignees endpoint
      # answers 201 while silently dropping a login it cannot assign, so the
      # read-back is the only evidence. The state file records that read-back,
      # not a claim.
      #
      # The listing is `gh issue list` without --search: that reads
      # repository.issues, which shows an issue as soon as it exists, where
      # the search index lags. The title match does not depend on labels, so
      # an issue whose labels never landed is still found.
      #
      # Creation and the ratchet PR stay on the PAT, so the pushed branch
      # triggers the caller's CI.
      - name: Publish tracking issue and ratchet PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          META_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Review Claude Code changelog: ${{ needs.check-changelog.outputs.previous_version }} → ${{ needs.check-changelog.outputs.effective_latest }}"
          BODY_FILE: triage-issue-body.md
          ENTRY_FILE: triage-entry.json
          ISSUE_LABELS: ${{ inputs.issue-labels }}
          ASSIGNEE: ${{ inputs.issue-assignee || github.repository_owner }}
          VERSION_FILE: ${{ inputs.version-file }}
          EFFECTIVE_LATEST: ${{ needs.check-changelog.outputs.effective_latest }}
          WINDOWED: ${{ needs.check-changelog.outputs.windowed }}
          COMMIT_TYPE_SCOPE: ${{ inputs.commit-type-scope }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          # 1. Validate the agent's two files before any side effect.
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::The triage run did not write $BODY_FILE; nothing was filed"
            exit 1
          fi
          if ! jq -e '(.relevantChanges | type == "array") and (.actionsRequired | type == "array")
                      and all(.relevantChanges[], .actionsRequired[]; type == "string")' "$ENTRY_FILE" >/dev/null 2>&1; then
            echo "::error::$ENTRY_FILE is missing or is not {relevantChanges: [strings], actionsRequired: [strings]}; nothing was filed"
            exit 1
          fi
          # The workflow owns the state file; discard any edit the agent made.
          if ! git diff --quiet -- "$VERSION_FILE"; then
            echo "::warning::The triage run edited $VERSION_FILE; discarding its edit, the workflow writes the file"
            git checkout -- "$VERSION_FILE"
          fi

          # 2. File the tracking issue exactly once.
          find_open_issue() {
            gh issue list --repo "$REPO" --state open --limit 1000 --json number,title \
              | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t) | .number] | min // empty'
          }
          ISSUE="$(find_open_issue)"
          if [ -n "$ISSUE" ]; then
            FILED="Reused open issue #$ISSUE (same title)"
          elif url="$(gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file "$BODY_FILE")"; then
            ISSUE="${url##*/}"
            FILED="Filed issue #$ISSUE"
          else
            ISSUE="$(find_open_issue)"
            if [ -z "$ISSUE" ]; then
              echo "::error::gh issue create failed and no open issue titled '$ISSUE_TITLE' exists"
              exit 1
            fi
            echo "::warning::gh issue create exited non-zero but issue #$ISSUE exists; not retrying"
            FILED="Filed issue #$ISSUE (gh exited non-zero after creating it)"
          fi
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::could not read an issue number (got '$ISSUE')"; exit 1 ;; esac
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

          # 3. Labels and assignee on the workflow token, then read back.
          WANT_LABELS="$(printf '%s' "$ISSUE_LABELS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          apply_metadata() { # <number> -> sets META (one sentence of verified fact)
            local num="$1" got have_labels missing_labels assignee_state
            if [ "$(jq 'length' <<<"$WANT_LABELS")" -gt 0 ]; then
              jq -n --argjson l "$WANT_LABELS" '{labels: $l}' \
                | GH_TOKEN="$META_TOKEN" gh api -X POST "repos/$REPO/issues/$num/labels" --input - >/dev/null \
                || echo "::warning::adding labels to #$num failed"
            fi
            if [ -n "$ASSIGNEE" ]; then
              jq -n --arg a "$ASSIGNEE" '{assignees: [$a]}' \
                | GH_TOKEN="$META_TOKEN" gh api -X POST "repos/$REPO/issues/$num/assignees" --input - >/dev/null \
                || echo "::warning::assigning #$num failed"
            fi
            if ! got="$(GH_TOKEN="$META_TOKEN" gh api "repos/$REPO/issues/$num")"; then
              META="labels and assignee could not be read back"
              echo "::warning::could not read #$num back to verify its labels and assignee"
              return 0
            fi
            have_labels="$(jq -r --argjson want "$WANT_LABELS" '[.labels[].name] as $h | $want | map(select(. as $w | $h | index($w))) | join(", ")' <<<"$got")"
            missing_labels="$(jq -r --argjson want "$WANT_LABELS" '[.labels[].name] as $h | $want | map(select(. as $w | $h | index($w) | not)) | join(", ")' <<<"$got")"
            META="labels present: ${have_labels:-none}"
            if [ -n "$missing_labels" ]; then
              META="$META; labels NOT applied: $missing_labels"
              echo "::warning::#$num is missing labels: $missing_labels"
            fi
            if [ -n "$ASSIGNEE" ]; then
              if jq -e --arg a "$ASSIGNEE" 'any(.assignees[]; .login == $a)' <<<"$got" >/dev/null; then
                assignee_state="assignee $ASSIGNEE present"
              else
                assignee_state="assignee $ASSIGNEE NOT applied"
                echo "::warning::#$num is not assigned to $ASSIGNEE"
              fi
              META="$META; $assignee_state"
            fi
          }
          apply_metadata "$ISSUE"
          ISSUE_META="$META"

          # 4. Ratchet the state file from the agent's entry and the verified result.
          TODAY="$(date -u +%F)"
          windowed_json=false
          if [ "$WINDOWED" = "true" ]; then windowed_json=true; fi
          tmp="$(mktemp)"
          jq --arg v "$EFFECTIVE_LATEST" --arg d "$TODAY" --argjson w "$windowed_json" \
             --arg see "See issue #$ISSUE for the rule update plan" \
             --arg verified "Tracking issue #$ISSUE, as read back by the workflow: $ISSUE_META" \
             --slurpfile e "$ENTRY_FILE" '
              .lastCheckedVersion = $v
              | .lastCheckedDate = $d
              | .reviewedChanges = ([{
                  version: $v,
                  date: $d,
                  windowed: $w,
                  relevantChanges: $e[0].relevantChanges,
                  actionsRequired: ([$see] + $e[0].actionsRequired + [$verified])
                }] + (.reviewedChanges // []))' "$VERSION_FILE" > "$tmp"
          mv "$tmp" "$VERSION_FILE"

          # 5. One commit touching only the state file, one PR.
          BRANCH="chore/changelog-triage-$EFFECTIVE_LATEST"
          SUBJECT="$COMMIT_TYPE_SCOPE: ratchet changelog tracking to $EFFECTIVE_LATEST"
          git switch -c "$BRANCH"
          git add -- "$VERSION_FILE"
          other="$(git diff --name-only)"
          if [ -n "$other" ]; then
            echo "::warning::tracked files modified by the triage run are NOT committed: $(printf '%s' "$other" | tr '\n' ' ')"
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "$SUBJECT"
          git push -u origin "$BRANCH"
          pr_url="$(gh pr create --repo "$REPO" --head "$BRANCH" --title "$SUBJECT" \
            --body "Ratchets \`$VERSION_FILE\` to $EFFECTIVE_LATEST. Rule edits are tracked in #$ISSUE.")"
          apply_metadata "${pr_url##*/}"
          PR_META="$META"

          {
            echo "### Changelog triage published"
            echo "- $FILED: $ISSUE_META"
            echo "- Ratchet PR $pr_url: $PR_META"
          } >> "$GITHUB_STEP_SUMMARY"
