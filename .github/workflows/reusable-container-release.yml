name: Container Release (Reusable)

# Release phase of the build-once/promote pattern.
# Runs on tag pushes — attempts to promote the :next-{version} image built
# during the release-please PR. Promotion is a manifest-only retag and
# completes in seconds. Falls back to a full rebuild if the pre-built image
# is not found (e.g. PR build was skipped).
#
# Tag stripping: given tag 'my-app-v1.2.3' and tag-prefix 'my-app-v',
# the version resolved is '1.2.3' and the looked-up pre-release image is
# ghcr.io/.../my-app:next-1.2.3.
#
# Permissions: the promote wait needs `actions: read` (to see whether the
# PR-phase build is still running). Every current caller already grants it;
# without it the wait degrades loudly to an immediate rebuild — the
# pre-issue-#51 behaviour — and says which grant is missing.
#
# This workflow deliberately does NOT declare `pull-requests: read`, even
# though the release-commit → release-PR bridge (`/commits/{sha}/pulls`) would
# use it. A called workflow requesting a scope the calling job has not granted
# is REJECTED before execution — a validation failure, not a silent downgrade —
# and a caller that declares a `permissions:` block sets every scope it omits
# to `none`, whatever the repository's visibility. Consumers pin `@main`, so
# declaring the scope here would break every existing caller on merge. The
# bridge is therefore best-effort: where it is unreadable the wait falls back
# to a per-workflow in-flight count needing only `actions: read`, warns, and
# never goes silently inert.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image name under ghcr.io (e.g. laurigates/my-app)'
        required: true
        type: string
      tag-prefix:
        description: 'Release tag prefix to strip for version extraction (e.g. "my-app-v")'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (used only for fallback rebuild)'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path (used only for fallback rebuild)'
        required: false
        type: string
        default: '.'
      build-args:
        description: 'Newline-separated Docker build arguments (used only for fallback rebuild)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64'
      cache-scope:
        description: 'GHA cache scope for fallback rebuild'
        required: false
        type: string
        default: 'app'
      scan-severity:
        description: 'Trivy severity levels that block publication'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      scan-ignore-unfixed:
        description: >
          Ignore findings with no fix available. Default true: the Debian base
          carries unfixable CRITICALs, and an unsatisfiable gate is one nobody
          reads. Load-bearing now that the gate blocks publication.
        required: false
        type: boolean
        default: true
      scan-trivy-version:
        description: 'Trivy binary version used by the gate'
        required: false
        type: string
        default: 'v0.70.0'
      scan-enforcement:
        description: |
          'block' (default): actionable findings stop publication — no release
          tag is created. 'warn': publish the release tags, then fail the job,
          which reproduces the pre-gate behaviour exactly. Any other value is a
          hard error; an unrecognised enforcement mode must never fall through
          to permissive. Prefer a reviewed `.trivyignore` at the repo root
          (honoured — this job checks out the release commit) over 'warn'.
        required: false
        type: string
        default: 'block'
      enable-signing:
        description: 'Sign release images with cosign (keyless/Sigstore)'
        required: false
        type: boolean
        default: true
      promote-wait-seconds:
        description: |
          Ceiling in seconds on waiting for the PR-phase :next-{version} image to
          appear in GHCR before giving up and rebuilding. The wait is entered only
          while the Actions API reports a PR-phase build for this release still
          running, so a release with nothing in flight never spends any of it.
          0 disables the wait entirely — one GHCR probe, then rebuild, which is
          the behaviour before issue #51. Clamped to 1800.
        required: false
        type: number
        default: 600
      build-workflow:
        description: |
          Path of the workflow file that runs the PR-phase build, e.g.
          '.github/workflows/container.yml'. Defaults to the workflow file that
          called this one, which is correct whenever the build and release jobs
          live in the same file (every current caller). Set it only when they are
          split across two files.
        required: false
        type: string
        default: ''
    secrets:
      secret-build-args:
        description: |
          Additional newline-separated KEY=VALUE Docker build arguments whose values are secrets.
          Used only by the fallback rebuild path — ignored on the fast-path promotion, which
          inherits the layers built by reusable-container-build.yml. Pass the same secrets as
          the PR-phase caller so the fallback rebuild produces an equivalent image.
        required: false
    outputs:
      version:
        description: 'Released version'
        value: ${{ jobs.release.outputs.version }}
      tags:
        description: 'Published image tags'
        value: ${{ jobs.release.outputs.tags }}
      promoted:
        description: 'true if promoted from pre-built image, false if rebuilt'
        value: ${{ jobs.release.outputs.promoted }}
      signed:
        description: 'true if signed with cosign'
        value: ${{ jobs.release.outputs.signed }}
      digest:
        description: 'Digest of the published release image'
        value: ${{ jobs.release.outputs.digest }}
      scan-result:
        description: 'clean | findings'
        value: ${{ jobs.release.outputs.scan-result }}

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      promoted: ${{ steps.pr-image.outputs.exists == 'true' && steps.freshness.outputs.stale != 'true' }}
      signed: ${{ steps.cosign-sign.outputs.signed }}
      digest: ${{ steps.candidate.outputs.digest }}
      scan-result: ${{ steps.scan.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fails on a bad configuration before a build is paid for.
      - name: Validate scan configuration
        env:
          MODE: ${{ inputs.scan-enforcement }}
          SEVERITY: ${{ inputs.scan-severity }}
        run: |
          set -euo pipefail
          case "$MODE" in
            block|warn) ;;
            *) echo "::error::scan-enforcement must be 'block' or 'warn', got '${MODE}'. Refusing to publish under an enforcement mode this workflow does not understand."; exit 1 ;;
          esac
          [ -n "$SEVERITY" ] || { echo "::error::scan-severity must not be empty"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the component prefix from the release-please tag to get the semver
      # version, then construct the :next-{version} pre-release image reference.
      # e.g. my-app-v1.2.3 with prefix my-app-v → version=1.2.3, next_image=…:next-1.2.3
      - name: Extract release version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          PREFIX="${{ inputs.tag-prefix }}"
          VERSION="${TAG#${PREFIX}}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "next_image=ghcr.io/${{ inputs.image-name }}:next-${VERSION}" >> $GITHUB_OUTPUT
          echo "Looking for pre-built PR image: next-${VERSION}"

      # The release job can start while the release PR's own build is still
      # pushing :next-{version} (issue #51), so a bare existence check reads a
      # race as absence and rebuilds. Wait — but only while there is evidence
      # the build is still coming, and never longer than the ceiling.
      #
      # The probe resolves a DIGEST, not just a yes/no. This step is the only
      # read of the mutable :next-{version} tag in the whole job: freshness, the
      # scan and publication all operate on the digest, so a concurrent PR-phase
      # build overwriting the tag mid-job cannot make the thing we validated
      # differ from the thing we publish.
      - name: Wait for and check the pre-built PR image in GHCR
        id: pr-image
        env:
          PR_IMAGE: ${{ steps.version.outputs.next_image }}
          IMAGE_NAME: ${{ inputs.image-name }}
          WAIT_CEILING: ${{ inputs.promote-wait-seconds }}
          BUILD_WORKFLOW: ${{ inputs.build-workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          POLL_INTERVAL=10
          MAX_CEILING=1800
          case "${WAIT_CEILING}" in ""|*[!0-9-]*) WAIT_CEILING=0 ;; esac
          if [ "${WAIT_CEILING}" -gt "${MAX_CEILING}" ]; then
            echo "::warning::promote-wait-seconds ${WAIT_CEILING} exceeds the ${MAX_CEILING}s ceiling — clamping"
            WAIT_CEILING=${MAX_CEILING}
          fi
          started=$(date +%s)
          matched=0; total=0; gate="not-evaluated"
          PROBE_DIGEST=""

          # On the found path `image` is the digest-pinned reference the probe resolved,
          # so freshness, the scan and publication all address exactly the manifest that
          # was inspected — a concurrent PR-phase build moving :next-{version} afterwards
          # cannot change what ships. On the not-found path it stays the tag, which is
          # only ever used in log messages from there on.
          emit() {
            { echo "exists=$1"
              if [ "$1" = "true" ]; then
                echo "digest=${PROBE_DIGEST}"
                echo "image=ghcr.io/${IMAGE_NAME}@${PROBE_DIGEST}"
              else
                echo "image=${PR_IMAGE}"
              fi
              echo "waited=$(( $(date +%s) - started ))"
              echo "wait_gate=${gate}"
            } >> "$GITHUB_OUTPUT"
          }

          # One probe. Any non-zero is treated as "not there yet"; stderr is kept so a
          # transient registry error is diagnosable rather than silently read as absence.
          # A successful probe also resolves the digest, so nothing downstream re-reads
          # the tag. `--format '{{.Manifest.Digest}}'` has no .Digest field on an OCI
          # index and emits multi-line output that breaks $GITHUB_OUTPUT parsing; the
          # text output carries one unindented top-level "Digest:" line. An inspect that
          # succeeds without one yields no candidate, so it counts as "not there yet".
          probe() {
            local out err rc
            err=$(mktemp)
            out=$(docker buildx imagetools inspect "$PR_IMAGE" 2>"$err")
            rc=$?
            PROBE_ERR=$(cat "$err"); rm -f "$err"
            [ "$rc" -eq 0 ] || return 1
            PROBE_DIGEST=$(printf '%s\n' "$out" | grep -m1 '^Digest:' | awk '{print $2}')
            if [ -z "$PROBE_DIGEST" ]; then
              PROBE_ERR="inspect succeeded but returned no top-level 'Digest:' line"
              return 1
            fi
            return 0
          }

          # Three probes ~3s apart. A single inspect cannot tell "manifest unknown" from a
          # GHCR 5xx or an auth blip, and the shape this replaced read both as absence.
          probe_settled() {
            local i
            for i in 1 2 3; do
              if probe; then return 0; fi
              [ "$i" -lt 3 ] && sleep 3
            done
            echo "  last probe error: ${PROBE_ERR}"
            return 1
          }

          # Count runs of the PR-phase build workflow, on the release PR's head commit,
          # that have not reached a terminal state. Keyed on the PR head and NOT on the
          # release commit: the build is triggered by pull_request, so its run head_sha is
          # the PR branch tip, which a squash merge never puts on main. (Keying on the
          # release commit is worse than useless — main's HEAD sha matches every scheduled
          # run on main.) The .path filter is what keeps a sibling check — Security, Tests,
          # Quality, a Claude review — from holding the wait open; those routinely outlast
          # the container build.
          count_inflight() {
            local sha payload t m
            total=0; matched=0
            for sha in $PR_HEADS; do
              payload=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=50" 2>/dev/null) || { gate="unavailable"; return 1; }
              t=$(printf '%s' "$payload" | jq '.workflow_runs | length') || { gate="unavailable"; return 1; }
              m=$(printf '%s' "$payload" | jq --arg p "$BUILD_PATH" \
                  '[.workflow_runs[] | select(.path == $p and .status != "completed")] | length') || { gate="unavailable"; return 1; }
              total=$(( total + t )); matched=$(( matched + m ))
            done
            return 0
          }

          # Fallback when the PR lookup is unreadable. This workflow requests no
          # `pull-requests` scope (see the permissions note at the top), so the bridge
          # succeeds only where GitHub serves that endpoint without one. Needs only
          # actions: read. Less precise — it counts any in-flight PR-event run of the
          # build workflow, including another PR's — but bounded, and it keeps the fix
          # from going inert.
          count_inflight_by_workflow() {
            local payload
            total=0; matched=0
            payload=$(gh api "repos/${REPO}/actions/workflows/${BUILD_PATH##*/}/runs?event=pull_request&per_page=50" 2>/dev/null) || { gate="unavailable"; return 1; }
            total=$(printf '%s' "$payload" | jq '.workflow_runs | length') || { gate="unavailable"; return 1; }
            matched=$(printf '%s' "$payload" | jq '[.workflow_runs[] | select(.status != "completed")] | length') || { gate="unavailable"; return 1; }
            return 0
          }

          give_up() {   # $1 = gate value; probe once more before conceding
            gate="$1"
            probe_settled && { emit true; exit 0; }
            emit false; exit 0
          }

          # ---- Fast path: the image is normally already there, and this costs nothing.
          if probe; then
            echo "PR image found at ${PROBE_DIGEST} — will check freshness before promoting"
            gate="not-needed"; emit true; exit 0
          fi

          # A true bypass, not `give_up disabled`: give_up re-probes three times over
          # ~6s, so routing 0 through it would leave the documented escape hatch
          # behaving differently from the pre-#51 step it claims to restore — which is
          # exactly what someone reaches for to rule this change out during an incident.
          # The fast-path probe above has already run and failed, so this is one probe
          # then rebuild.
          if [ "${WAIT_CEILING}" -le 0 ]; then
            echo "promote-wait-seconds is 0 — not waiting for a PR-phase build"
            gate="disabled"; emit false; exit 0
          fi

          # ---- Evidence: is a PR-phase build for this release still running?
          # A reusable workflow has no run of its own, so this run's `.path` is the
          # CALLER's workflow file — correct whenever the build and release jobs live in
          # that same file, which is every current caller.
          BUILD_PATH="${BUILD_WORKFLOW}"
          if [ -z "$BUILD_PATH" ]; then
            BUILD_PATH=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.path' 2>/dev/null) || BUILD_PATH=""
          fi
          if [ -z "$BUILD_PATH" ]; then
            echo "::warning::Could not resolve the PR-phase build workflow path — the promote wait is inactive for this run, so this release will rebuild rather than promote. Grant 'actions: read' to the job that calls this workflow, or set build-workflow explicitly."
            give_up unavailable
          fi

          PR_HEADS=$(gh api "repos/${REPO}/commits/${RELEASE_SHA}/pulls" --jq '.[].head.sha' 2>/dev/null) || PR_HEADS="__ERR__"

          COUNTER=count_inflight
          if [ "$PR_HEADS" = "__ERR__" ]; then
            echo "::warning::Could not read the release commit's pull requests — this workflow's GITHUB_TOKEN carries no 'pull-requests' scope, and it cannot request one without failing validation for every caller that omits it. Falling back to a per-workflow in-flight check, which needs only 'actions: read' and may also count another PR's build."
            COUNTER=count_inflight_by_workflow
          elif [ -z "$PR_HEADS" ]; then
            echo "::notice::No pull request is associated with ${RELEASE_SHA}, so no PR-phase build is expected — rebuilding now rather than waiting."
            give_up no-pr
          fi

          if ! $COUNTER; then
            echo "::warning::Could not read workflow runs — the promote wait is inactive for this run, so this release will rebuild rather than promote. Grant 'actions: read' to the job that calls this workflow."
            give_up unavailable
          fi

          if [ "$matched" -eq 0 ]; then
            # Reporting `total` alongside `matched` is the control: `total=0` means the
            # query returned nothing at all (suspect the token or the SHA), while
            # `total>0, matched=0` means the query worked and no build is running. Without
            # it a mis-specified filter is indistinguishable from a genuine zero, and the
            # wait would be silently inert forever behind a green tick.
            echo "::notice::No in-flight ${BUILD_PATH} run for this release (${total} run(s) inspected) — rebuilding now rather than waiting."
            give_up nothing-in-flight
          fi

          # ---- Wait: bounded, early-exit, and re-evaluated every iteration.
          gate="waited"
          echo "PR image not in GHCR yet; ${matched} ${BUILD_PATH} run(s) still in flight. Waiting up to ${WAIT_CEILING}s for ${PR_IMAGE}"
          deadline=$(( started + WAIT_CEILING ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$POLL_INTERVAL"
            if probe; then
              echo "PR image appeared at ${PROBE_DIGEST} after $(( $(date +%s) - started ))s — will check freshness before promoting"
              emit true; exit 0
            fi
            if ! $COUNTER; then break; fi
            if [ "$matched" -eq 0 ]; then
              # The build reached a terminal state (success, failure, cancelled, skipped)
              # without the image appearing. Re-probe once — a run can finish pushing
              # between the probe above and this count — then stop rather than burning
              # the rest of the ceiling.
              echo "No ${BUILD_PATH} run left in flight after $(( $(date +%s) - started ))s"
              probe_settled && { emit true; exit 0; }
              break
            fi
            left=$(( deadline - $(date +%s) )); [ "$left" -lt 0 ] && left=0
            echo "  ... waiting (${matched} in flight, ${left}s left)"
          done

          echo "::warning::Pre-built PR image ${PR_IMAGE} did not appear after $(( $(date +%s) - started ))s — falling back to full rebuild"
          emit false

      # Hoisted out of the freshness step so the fallback rebuild can stamp the
      # same label onto the candidate it pushes. Without it a rebuilt
      # :next-{version} is unlabelled, and a re-run of this job reads it as
      # stale — silently degrading every retry to a second full build.
      - name: Compute release build context tree hash
        id: release-tree
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          if [ -z "$CONTEXT" ] || [ "$CONTEXT" = "." ]; then
            TREE=$(git rev-parse "HEAD^{tree}")
          else
            TREE=$(git rev-parse "HEAD:${CONTEXT}")
          fi
          echo "hash=${TREE}" >> "$GITHUB_OUTPUT"
          echo "Release commit context tree: ${TREE}"

      # Guard against the build-once/promote race: if main moved forward between
      # the PR image being built and the release tag being pushed, the cached
      # PR image is stale and would silently ship the wrong code. We compare the
      # build-context tree hash baked into the PR image's labels against the
      # tree hash at the release commit.
      - name: Verify PR image matches release commit
        id: freshness
        if: steps.pr-image.outputs.exists == 'true'
        env:
          PR_IMAGE: ${{ steps.pr-image.outputs.image }}
          RELEASE_TREE: ${{ steps.release-tree.outputs.hash }}
        run: |
          set -euo pipefail
          # A bare assignment here fails the whole release job on a transient GHCR
          # read — nothing published, no rebuild fallback. The promote wait makes
          # that likelier by inspecting an image seconds after it lands, so retry
          # and then degrade to a rebuild rather than aborting.
          # stderr goes to a file, never into INSPECT: buildx writes warnings
          # (deprecations, missing provenance) to stderr on otherwise successful
          # inspects, and folding those into the capture leaves non-JSON that
          # aborts the jq below under `set -e` — the exact abort this retry
          # exists to prevent. The file keeps the failure text for the log.
          INSPECT=""
          inspect_err=$(mktemp)
          for i in 1 2 3; do
            if INSPECT=$(docker buildx imagetools inspect "$PR_IMAGE" --format '{{json .Image}}' 2>"$inspect_err"); then break; fi
            echo "  inspect attempt ${i} failed: $(cat "$inspect_err")"
            INSPECT=""
            [ "$i" -lt 3 ] && sleep 5 || true
          done
          rm -f "$inspect_err"
          if [ -z "$INSPECT" ]; then
            echo "::warning::Could not inspect ${PR_IMAGE} after 3 attempts — falling back to rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `.Image` has two shapes, and reading only the first one is why this
          # check reported every multi-platform image as unlabelled:
          #   single-platform tag  -> one image config, labels at .config.Labels
          #   multi-platform index -> a map of "os/arch" -> image config, so
          #                           .config.Labels is null at the top level
          # Attestation manifests (provenance/SBOM) are not represented in
          # `.Image`, so there is no unknown/unknown entry to filter out.
          # Every platform is built from one context and must agree; a
          # disagreement is unexplained, so it falls back to a rebuild.
          PR_TREE=$(printf '%s' "$INSPECT" | jq -r '
            (if has("config") then [.] else [.[]] end)
            | map(.config.Labels["io.github.laurigates.build.context-tree"] // "")
            | unique
            | if length == 1 and .[0] != "" then .[0] else "" end')
          if [ -z "$PR_TREE" ]; then
            # Report what was observed. The previous wording asserted a cause
            # ("built before this guard landed"), which read as self-healing and
            # sent the diagnosis of a permanent lookup bug down an age theory.
            PLATFORMS=$(printf '%s' "$INSPECT" \
              | jq -r 'if has("config") then "single-platform" else (keys | join(",")) end')
            echo "::warning::Could not read a single agreed io.github.laurigates.build.context-tree label from ${PR_IMAGE} (inspected: ${PLATFORMS}) — falling back to rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR image build context tree: ${PR_TREE}"
          echo "Release commit context tree: ${RELEASE_TREE}"
          if [ "$PR_TREE" = "$RELEASE_TREE" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Build context unchanged since PR image was built — safe to promote"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Build context changed since PR image was built — will rebuild from release commit"
          fi

      - name: Extract Docker metadata (release version tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # release-please manifest tag format: {component}-v{version}
            type=match,pattern=.*-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=.*-v(\d+\.\d+),group=1
            type=match,pattern=.*-v(\d+),group=1

      # ---- Candidate production ---------------------------------------------
      # Both paths converge on ONE digest, which is scanned and then retagged.
      # Nothing between the gate and publication re-reads a tag.
      #
      # The rebuild pushes to :next-{version} rather than to a new staging tag.
      # GITHUB_TOKEN cannot delete package versions (that needs a PAT with
      # delete:packages, and this workflow's permissions block has no route to
      # one), so a new tag class would have no cleanup path at all. This tag is
      # already in the pattern, and in the two cases that reach this step it is
      # either absent or holds content the freshness check has rejected.
      - name: Build and push release candidate (PR image missing or stale)
        id: build-push
        if: steps.pr-image.outputs.exists != 'true' || steps.freshness.outputs.stale == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          # Candidate only. Release tags are applied by the publish step, after
          # the scan. Pushing meta.outputs.tags here is what made the scan
          # unable to gate anything.
          tags: ${{ steps.version.outputs.next_image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.github.laurigates.build.context-tree=${{ steps.release-tree.outputs.hash }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            ${{ inputs.build-args }}
            ${{ secrets.secret-build-args }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
          provenance: mode=max
          sbom: true

      # No `if:`, on purpose. Every step below keys off this output; if neither
      # path produced a candidate the job dies here rather than letting the scan
      # run against an empty reference and report a pass it never earned.
      #
      # The rebuild digest comes from the action's own output, never from
      # re-reading :next-{version} — a concurrent PR-phase build can overwrite
      # that tag between the push and the read.
      - name: Resolve release candidate
        id: candidate
        env:
          REBUILD_DIGEST: ${{ steps.build-push.outputs.digest }}
          PROMOTE_DIGEST: ${{ steps.pr-image.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          DIGEST="${REBUILD_DIGEST:-$PROMOTE_DIGEST}"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Neither the promote nor the rebuild path produced a candidate digest. Refusing to publish an unscanned release."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: ghcr.io/${IMAGE_NAME}@${DIGEST}"

      # ---- The gate ----------------------------------------------------------
      # No `if:`. Runs on BOTH paths, against the candidate digest, before any
      # release tag exists. Multi-platform callers work unchanged: Trivy reads
      # the reference from the registry, so the multi-arch `load:` constraint
      # that applies to docker/build-push-action does not apply here — and the
      # action enumerates platform manifests from the index rather than trusting
      # inputs.platforms, so coverage is a property of the artifact.
      #
      # continue-on-error is computed fail-closed: anything that is not exactly
      # 'warn' blocks. The validation step above has already rejected
      # unrecognised values loudly.
      - name: Scan release candidate (gate)
        id: scan
        continue-on-error: ${{ inputs.scan-enforcement == 'warn' }}
        uses: laurigates/.github/.github/actions/scan-image@main
        with:
          image: ${{ steps.candidate.outputs.ref }}
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: ${{ inputs.scan-ignore-unfixed }}
          trivy-version: ${{ inputs.scan-trivy-version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Publication -------------------------------------------------------
      # The ONLY step that creates a release tag, and it has no `if:`. Manifest-
      # only retag from the scanned digest — not from the mutable :next tag,
      # which could have moved. Identical for both paths.
      - name: Publish release tags
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MODE: ${{ inputs.scan-enforcement }}
          PLATFORMS_SCANNED: ${{ steps.scan.outputs.platforms-scanned }}
        run: |
          set -euo pipefail
          # A gate whose coverage count is missing has not demonstrably run.
          # In warn mode the gate is deliberately off, so the assert is skipped.
          if [ "$MODE" = "block" ] && [ "${PLATFORMS_SCANNED:-0}" -lt 1 ]; then
            echo "::error::The scan reported no platforms-scanned. Refusing to publish."
            exit 1
          fi
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=(--tag "$tag")
          done <<< "$TAGS"
          if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no tags for ref '${GITHUB_REF}' — nothing to publish."
            exit 1
          fi
          echo "Publishing ${SOURCE} to ${#TAG_ARGS[@]} tag(s)..."
          docker buildx imagetools create "${TAG_ARGS[@]}" "$SOURCE"

      # buildx re-assembles the index on `imagetools create`. If it did not
      # reproduce the source content, the published tags would resolve to a
      # different digest and the gate would have been about a different image.
      # Assert it rather than assume it — this doubles as proof that the
      # provenance/SBOM attestations attached on the rebuild path survived the
      # retag. Every tag, not just the first: metadata-action's flavor.latest
      # default emits `:latest` on a non-prerelease semver ref, and that tag
      # appears nowhere in the `tags:` input list above.
      - name: Verify every published tag resolves to the scanned digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          CHECKED=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            GOT=$(docker buildx imagetools inspect "$tag" | grep -m1 '^Digest:' | awk '{print $2}')
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::${tag} resolves to ${GOT:-<nothing>}, not the scanned digest ${EXPECTED} — the gate did not cover what shipped"
              exit 1
            fi
            CHECKED=$((CHECKED + 1))
            echo "ok: ${tag} -> ${EXPECTED}"
          done <<< "$TAGS"
          [ "$CHECKED" -gt 0 ] || { echo "::error::Verified 0 tags"; exit 1; }

      # ---- Container signing (keyless / Sigstore) -----------------------------
      # After the gate, not before it. The previous ordering signed and
      # published an image the very next step could condemn.
      - name: Install cosign
        if: inputs.enable-signing
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign release image with cosign (keyless)
        if: inputs.enable-signing
        id: cosign-sign
        env:
          COSIGN_YES: "true"
          TARGET: ${{ steps.candidate.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign "$TARGET"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Opting out of the gate must not also drop the signal. In warn mode the
      # scan is soft-failed above so publication proceeds; this reproduces the
      # pre-gate outcome exactly — release tags published, job red — rather than
      # letting continue-on-error swallow the failure into a green run.
      - name: Fail the release on scan findings (warn mode)
        if: ${{ inputs.scan-enforcement == 'warn' && steps.scan.outcome == 'failure' }}
        env:
          SEVERITY: ${{ inputs.scan-severity }}
          TARGET: ${{ steps.candidate.outputs.ref }}
        run: |
          echo "::error::Trivy reported ${SEVERITY} findings in ${TARGET}. Release tags were published because scan-enforcement is 'warn'."
          exit 1

      - name: Job summary
        if: always()
        run: |
          PR_IMAGE_EXISTS="${{ steps.pr-image.outputs.exists }}"
          STALE="${{ steps.freshness.outputs.stale }}"
          SIGNED="${{ steps.cosign-sign.outputs.signed }}"
          DIGEST="${{ steps.candidate.outputs.digest }}"
          WAITED="${{ steps.pr-image.outputs.waited }}"
          GATE="${{ steps.pr-image.outputs.wait_gate }}"
          echo "## Container Release: \`${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          SCAN="${{ steps.scan.outputs.result }}"
          PLAT="${{ steps.scan.outputs.platforms-scanned }}"
          echo "- **Scan**: \`${SCAN:-did-not-complete}\` — ${PLAT:-0} platform manifest(s), severity \`${{ inputs.scan-severity }}\`, ignore-unfixed=${{ inputs.scan-ignore-unfixed }}, enforcement=\`${{ inputs.scan-enforcement }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$SCAN" = "findings" ] && [ "${{ inputs.scan-enforcement }}" = "block" ]; then
            echo "- **Publication**: BLOCKED — no release tag was created. The git tag and GitHub Release still exist; \`${{ steps.version.outputs.next_image }}\` remains as the only image reference. Fix the finding or add a reviewed \`.trivyignore\`, then re-run this job." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PR_IMAGE_EXISTS" = "true" ] && [ "$STALE" != "true" ]; then
            echo "- **Method**: Promoted from pre-built PR image (fast path)" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: \`${{ steps.version.outputs.next_image }}\`" >> $GITHUB_STEP_SUMMARY
            if [ "${WAITED:-0}" -gt 20 ]; then
              echo "- **Waited**: ${WAITED}s for the PR-phase build to finish pushing" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$PR_IMAGE_EXISTS" = "true" ] && [ "$STALE" = "true" ]; then
            echo "- **Method**: Full rebuild (PR image was stale — main moved between PR build and release)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Method**: Full rebuild (no pre-built PR image; wait gate: ${GATE:-n/a}, waited ${WAITED:-0}s)" >> $GITHUB_STEP_SUMMARY
            if [ "$GATE" = "unavailable" ]; then
              echo "- **Note**: the promote wait could not run — grant \`actions: read\` to the calling job. A job that declares a \`permissions:\` block sets every scope it omits to \`none\`, whatever the repository's visibility." >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ "$SIGNED" = "true" ]; then
            echo "- **Signing**: Signed with cosign (keyless/Sigstore)" >> $GITHUB_STEP_SUMMARY
            echo "- **Digest**: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Rekor**: [transparency log](https://search.sigstore.dev/?hash=${DIGEST})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Verify signature</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "cosign verify \\" >> $GITHUB_STEP_SUMMARY
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\" >> $GITHUB_STEP_SUMMARY
            echo "  --certificate-identity-regexp='https://github.com/laurigates/' \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/${{ inputs.image-name }}@${DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Tags**:" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
