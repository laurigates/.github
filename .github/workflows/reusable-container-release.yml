name: Container Release (Reusable)

# Release phase of the build-once/promote pattern.
# Runs on tag pushes — attempts to promote the :next-{version} image built
# during the release-please PR. Promotion is a manifest-only retag and
# completes in seconds. Falls back to a full rebuild if the pre-built image
# is not found (e.g. PR build was skipped).
#
# Tag stripping: given tag 'my-app-v1.2.3' and tag-prefix 'my-app-v',
# the version resolved is '1.2.3' and the looked-up pre-release image is
# ghcr.io/.../my-app:next-1.2.3.
#
# Permissions a caller must forward: a reusable workflow's permissions are
# capped by the calling job's, so the promote wait needs the caller to grant
# `actions: read` (to see whether the PR-phase build is still running) and, on
# a PRIVATE repository, `pull-requests: read` (to bridge the release commit to
# its release PR). Both are already granted implicitly on a public repository.
# Without them the wait degrades loudly to an immediate rebuild — the
# pre-issue-#51 behaviour — and says which grant is missing.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image name under ghcr.io (e.g. laurigates/my-app)'
        required: true
        type: string
      tag-prefix:
        description: 'Release tag prefix to strip for version extraction (e.g. "my-app-v")'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (used only for fallback rebuild)'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path (used only for fallback rebuild)'
        required: false
        type: string
        default: '.'
      build-args:
        description: 'Newline-separated Docker build arguments (used only for fallback rebuild)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64'
      cache-scope:
        description: 'GHA cache scope for fallback rebuild'
        required: false
        type: string
        default: 'app'
      scan-severity:
        description: 'Trivy severity levels to report'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      enable-signing:
        description: 'Sign release images with cosign (keyless/Sigstore)'
        required: false
        type: boolean
        default: true
      promote-wait-seconds:
        description: |
          Ceiling in seconds on waiting for the PR-phase :next-{version} image to
          appear in GHCR before giving up and rebuilding. The wait is entered only
          while the Actions API reports a PR-phase build for this release still
          running, so a release with nothing in flight never spends any of it.
          0 disables the wait (the behaviour before issue #51). Clamped to 1800.
        required: false
        type: number
        default: 600
      build-workflow:
        description: |
          Path of the workflow file that runs the PR-phase build, e.g.
          '.github/workflows/container.yml'. Defaults to the workflow file that
          called this one, which is correct whenever the build and release jobs
          live in the same file (every current caller). Set it only when they are
          split across two files.
        required: false
        type: string
        default: ''
    secrets:
      secret-build-args:
        description: |
          Additional newline-separated KEY=VALUE Docker build arguments whose values are secrets.
          Used only by the fallback rebuild path — ignored on the fast-path promotion, which
          inherits the layers built by reusable-container-build.yml. Pass the same secrets as
          the PR-phase caller so the fallback rebuild produces an equivalent image.
        required: false
    outputs:
      version:
        description: 'Released version'
        value: ${{ jobs.release.outputs.version }}
      tags:
        description: 'Published image tags'
        value: ${{ jobs.release.outputs.tags }}
      promoted:
        description: 'true if promoted from pre-built image, false if rebuilt'
        value: ${{ jobs.release.outputs.promoted }}
      signed:
        description: 'true if signed with cosign'
        value: ${{ jobs.release.outputs.signed }}

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      promoted: ${{ steps.pr-image.outputs.exists == 'true' && steps.freshness.outputs.stale != 'true' }}
      signed: ${{ steps.cosign-sign.outputs.signed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the component prefix from the release-please tag to get the semver
      # version, then construct the :next-{version} pre-release image reference.
      # e.g. my-app-v1.2.3 with prefix my-app-v → version=1.2.3, next_image=…:next-1.2.3
      - name: Extract release version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          PREFIX="${{ inputs.tag-prefix }}"
          VERSION="${TAG#${PREFIX}}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "next_image=ghcr.io/${{ inputs.image-name }}:next-${VERSION}" >> $GITHUB_OUTPUT
          echo "Looking for pre-built PR image: next-${VERSION}"

      # The release job can start while the release PR's own build is still
      # pushing :next-{version} (issue #51), so a bare existence check reads a
      # race as absence and rebuilds. Wait — but only while there is evidence
      # the build is still coming, and never longer than the ceiling.
      - name: Wait for and check the pre-built PR image in GHCR
        id: pr-image
        env:
          PR_IMAGE: ${{ steps.version.outputs.next_image }}
          WAIT_CEILING: ${{ inputs.promote-wait-seconds }}
          BUILD_WORKFLOW: ${{ inputs.build-workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          POLL_INTERVAL=10
          MAX_CEILING=1800
          case "${WAIT_CEILING}" in ""|*[!0-9-]*) WAIT_CEILING=0 ;; esac
          if [ "${WAIT_CEILING}" -gt "${MAX_CEILING}" ]; then
            echo "::warning::promote-wait-seconds ${WAIT_CEILING} exceeds the ${MAX_CEILING}s ceiling — clamping"
            WAIT_CEILING=${MAX_CEILING}
          fi
          started=$(date +%s)
          matched=0; total=0; gate="not-evaluated"

          emit() {
            { echo "exists=$1"
              echo "image=${PR_IMAGE}"
              echo "waited=$(( $(date +%s) - started ))"
              echo "wait_gate=${gate}"
            } >> "$GITHUB_OUTPUT"
          }

          # One probe. Any non-zero is treated as "not there yet"; stderr is kept so a
          # transient registry error is diagnosable rather than silently read as absence.
          probe() { PROBE_ERR=$(docker manifest inspect "$PR_IMAGE" 2>&1 >/dev/null); }

          # Three probes ~3s apart. A single inspect cannot tell "manifest unknown" from a
          # GHCR 5xx or an auth blip, and the shape this replaced read both as absence.
          probe_settled() {
            local i
            for i in 1 2 3; do
              if probe; then return 0; fi
              [ "$i" -lt 3 ] && sleep 3
            done
            echo "  last probe error: ${PROBE_ERR}"
            return 1
          }

          # Count runs of the PR-phase build workflow, on the release PR's head commit,
          # that have not reached a terminal state. Keyed on the PR head and NOT on the
          # release commit: the build is triggered by pull_request, so its run head_sha is
          # the PR branch tip, which a squash merge never puts on main. (Keying on the
          # release commit is worse than useless — main's HEAD sha matches every scheduled
          # run on main.) The .path filter is what keeps a sibling check — Security, Tests,
          # Quality, a Claude review — from holding the wait open; those routinely outlast
          # the container build.
          count_inflight() {
            local sha payload t m
            total=0; matched=0
            for sha in $PR_HEADS; do
              payload=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=50" 2>/dev/null) || { gate="unavailable"; return 1; }
              t=$(printf '%s' "$payload" | jq '.workflow_runs | length') || { gate="unavailable"; return 1; }
              m=$(printf '%s' "$payload" | jq --arg p "$BUILD_PATH" \
                  '[.workflow_runs[] | select(.path == $p and .status != "completed")] | length') || { gate="unavailable"; return 1; }
              total=$(( total + t )); matched=$(( matched + m ))
            done
            return 0
          }

          # Fallback when the PR lookup is unreadable (private repo whose caller does not
          # grant pull-requests: read). Needs only actions: read. Less precise — it counts
          # any in-flight PR-event run of the build workflow, including another PR's — but
          # bounded, and it keeps the fix from going inert.
          count_inflight_by_workflow() {
            local payload
            total=0; matched=0
            payload=$(gh api "repos/${REPO}/actions/workflows/${BUILD_PATH##*/}/runs?event=pull_request&per_page=50" 2>/dev/null) || { gate="unavailable"; return 1; }
            total=$(printf '%s' "$payload" | jq '.workflow_runs | length') || { gate="unavailable"; return 1; }
            matched=$(printf '%s' "$payload" | jq '[.workflow_runs[] | select(.status != "completed")] | length') || { gate="unavailable"; return 1; }
            return 0
          }

          give_up() {   # $1 = gate value; probe once more before conceding
            gate="$1"
            probe_settled && { emit true; exit 0; }
            emit false; exit 0
          }

          # ---- Fast path: the image is normally already there, and this costs nothing.
          if probe; then
            echo "PR image found — will check freshness before promoting"
            gate="not-needed"; emit true; exit 0
          fi

          if [ "${WAIT_CEILING}" -le 0 ]; then
            echo "promote-wait-seconds is 0 — not waiting for a PR-phase build"
            give_up disabled
          fi

          # ---- Evidence: is a PR-phase build for this release still running?
          # A reusable workflow has no run of its own, so this run's `.path` is the
          # CALLER's workflow file — correct whenever the build and release jobs live in
          # that same file, which is every current caller.
          BUILD_PATH="${BUILD_WORKFLOW}"
          if [ -z "$BUILD_PATH" ]; then
            BUILD_PATH=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.path' 2>/dev/null) || BUILD_PATH=""
          fi
          if [ -z "$BUILD_PATH" ]; then
            echo "::warning::Could not resolve the PR-phase build workflow path — the promote wait is inactive for this run, so this release will rebuild rather than promote. Grant 'actions: read' to the job that calls this workflow, or set build-workflow explicitly."
            give_up unavailable
          fi

          PR_HEADS=$(gh api "repos/${REPO}/commits/${RELEASE_SHA}/pulls" --jq '.[].head.sha' 2>/dev/null) || PR_HEADS="__ERR__"

          COUNTER=count_inflight
          if [ "$PR_HEADS" = "__ERR__" ]; then
            echo "::warning::Could not read the release commit's pull requests — falling back to a less precise per-workflow check. On a private repo, add 'pull-requests: read' to the calling job's permissions."
            COUNTER=count_inflight_by_workflow
          elif [ -z "$PR_HEADS" ]; then
            echo "::notice::No pull request is associated with ${RELEASE_SHA}, so no PR-phase build is expected — rebuilding now rather than waiting."
            give_up no-pr
          fi

          if ! $COUNTER; then
            echo "::warning::Could not read workflow runs — the promote wait is inactive for this run, so this release will rebuild rather than promote. Grant 'actions: read' to the job that calls this workflow."
            give_up unavailable
          fi

          if [ "$matched" -eq 0 ]; then
            # Reporting `total` alongside `matched` is the control: `total=0` means the
            # query returned nothing at all (suspect the token or the SHA), while
            # `total>0, matched=0` means the query worked and no build is running. Without
            # it a mis-specified filter is indistinguishable from a genuine zero, and the
            # wait would be silently inert forever behind a green tick.
            echo "::notice::No in-flight ${BUILD_PATH} run for this release (${total} run(s) inspected) — rebuilding now rather than waiting."
            give_up nothing-in-flight
          fi

          # ---- Wait: bounded, early-exit, and re-evaluated every iteration.
          gate="waited"
          echo "PR image not in GHCR yet; ${matched} ${BUILD_PATH} run(s) still in flight. Waiting up to ${WAIT_CEILING}s for ${PR_IMAGE}"
          deadline=$(( started + WAIT_CEILING ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$POLL_INTERVAL"
            if probe; then
              echo "PR image appeared after $(( $(date +%s) - started ))s — will check freshness before promoting"
              emit true; exit 0
            fi
            if ! $COUNTER; then break; fi
            if [ "$matched" -eq 0 ]; then
              # The build reached a terminal state (success, failure, cancelled, skipped)
              # without the image appearing. Re-probe once — a run can finish pushing
              # between the probe above and this count — then stop rather than burning
              # the rest of the ceiling.
              echo "No ${BUILD_PATH} run left in flight after $(( $(date +%s) - started ))s"
              probe_settled && { emit true; exit 0; }
              break
            fi
            left=$(( deadline - $(date +%s) )); [ "$left" -lt 0 ] && left=0
            echo "  ... waiting (${matched} in flight, ${left}s left)"
          done

          echo "::warning::Pre-built PR image ${PR_IMAGE} did not appear after $(( $(date +%s) - started ))s — falling back to full rebuild"
          emit false

      # Guard against the build-once/promote race: if main moved forward between
      # the PR image being built and the release tag being pushed, the cached
      # PR image is stale and would silently ship the wrong code. We compare the
      # build-context tree hash baked into the PR image's labels against the
      # tree hash at the release commit.
      - name: Verify PR image matches release commit
        id: freshness
        if: steps.pr-image.outputs.exists == 'true'
        env:
          PR_IMAGE: ${{ steps.pr-image.outputs.image }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          # A bare assignment here fails the whole release job on a transient GHCR
          # read — nothing published, no rebuild fallback. The promote wait makes
          # that likelier by inspecting an image seconds after it lands, so retry
          # and then degrade to a rebuild rather than aborting.
          INSPECT=""
          for i in 1 2 3; do
            if INSPECT=$(docker buildx imagetools inspect "$PR_IMAGE" --format '{{json .Image}}' 2>&1); then break; fi
            echo "  inspect attempt ${i} failed: ${INSPECT}"
            INSPECT=""
            [ "$i" -lt 3 ] && sleep 5 || true
          done
          if [ -z "$INSPECT" ]; then
            echo "::warning::Could not inspect ${PR_IMAGE} after 3 attempts — falling back to rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `.Image` has two shapes, and reading only the first one is why this
          # check reported every multi-platform image as unlabelled:
          #   single-platform tag  -> one image config, labels at .config.Labels
          #   multi-platform index -> a map of "os/arch" -> image config, so
          #                           .config.Labels is null at the top level
          # Attestation manifests (provenance/SBOM) are not represented in
          # `.Image`, so there is no unknown/unknown entry to filter out.
          # Every platform is built from one context and must agree; a
          # disagreement is unexplained, so it falls back to a rebuild.
          PR_TREE=$(printf '%s' "$INSPECT" | jq -r '
            (if has("config") then [.] else [.[]] end)
            | map(.config.Labels["io.github.laurigates.build.context-tree"] // "")
            | unique
            | if length == 1 and .[0] != "" then .[0] else "" end')
          if [ -z "$PR_TREE" ]; then
            # Report what was observed. The previous wording asserted a cause
            # ("built before this guard landed"), which read as self-healing and
            # sent the diagnosis of a permanent lookup bug down an age theory.
            PLATFORMS=$(printf '%s' "$INSPECT" \
              | jq -r 'if has("config") then "single-platform" else (keys | join(",")) end')
            echo "::warning::Could not read a single agreed io.github.laurigates.build.context-tree label from ${PR_IMAGE} (inspected: ${PLATFORMS}) — falling back to rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CONTEXT" ] || [ "$CONTEXT" = "." ]; then
            RELEASE_TREE=$(git rev-parse "HEAD^{tree}")
          else
            RELEASE_TREE=$(git rev-parse "HEAD:${CONTEXT}")
          fi
          echo "PR image build context tree: ${PR_TREE}"
          echo "Release commit context tree: ${RELEASE_TREE}"
          if [ "$PR_TREE" = "$RELEASE_TREE" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Build context unchanged since PR image was built — safe to promote"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Build context changed since PR image was built — will rebuild from release commit"
          fi

      - name: Extract Docker metadata (release version tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # release-please manifest tag format: {component}-v{version}
            type=match,pattern=.*-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=.*-v(\d+\.\d+),group=1
            type=match,pattern=.*-v(\d+),group=1

      # ---- Fast path: promote the pre-built PR image -------------------------
      # Manifest-only retag: no layer re-upload, completes in seconds.
      - name: Promote PR image to release tags
        if: steps.pr-image.outputs.exists == 'true' && steps.freshness.outputs.stale != 'true'
        run: |
          SOURCE="${{ steps.pr-image.outputs.image }}"
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "Promoting ${SOURCE} to ${#TAG_ARGS[@]} tags..."
          docker buildx imagetools create "${TAG_ARGS[@]}" "$SOURCE"

      # ---- Slow path: full rebuild (fallback) --------------------------------
      # Reached when the :next-{version} image is not in GHCR, or when its
      # build-context tree no longer matches the release commit.
      - name: Build and push (fallback — PR image missing or stale)
        id: build-push
        if: steps.pr-image.outputs.exists != 'true' || steps.freshness.outputs.stale == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            ${{ inputs.build-args }}
            ${{ secrets.secret-build-args }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
          provenance: mode=max
          sbom: true

      # ---- Container signing (keyless / Sigstore) -----------------------------
      - name: Install cosign
        if: inputs.enable-signing
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Capture release image digest
        if: inputs.enable-signing
        id: release-digest
        run: |
          FIRST_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          # Extract the top-level digest from imagetools inspect text output.
          # --format '{{.Manifest.Digest}}' fails for OCI index/manifest list
          # types (no .Digest field), producing multi-line output that breaks
          # $GITHUB_OUTPUT parsing. The text output has a top-level
          # "Digest: sha256:..." line (unindented, unlike sub-manifest lines).
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" | grep -m1 '^Digest:' | awk '{print $2}')
          if [ -z "${DIGEST}" ]; then
            echo "::error::Failed to extract digest from imagetools inspect output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ inputs.image-name }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign release image with cosign (keyless)
        if: inputs.enable-signing
        id: cosign-sign
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.release-digest.outputs.image }}"
          echo "signed=true" >> $GITHUB_OUTPUT

      # `version` is pinned explicitly rather than left to the action's default.
      # trivy-action 0.34.0 defaulted to Trivy v0.69.1, which exists as a git
      # tag but has no GitHub release and therefore no downloadable asset — so
      # setup-trivy's install script resolved the tag, failed to fetch the
      # binary, and exited 1 before any scan ran. Every release job using this
      # workflow went red on a scan that never executed. An upstream default is
      # a value someone else can withdraw; state the version here so a repeat
      # is a bump we make, not a break we inherit.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ inputs.image-name }}:${{ steps.meta.outputs.version }}
          version: 'v0.70.0'
          format: 'table'
          severity: ${{ inputs.scan-severity }}
          # Report only what someone can act on. The Debian base carries
          # CRITICALs with no fix available (perl-base, among others); failing
          # the release on those makes the gate unsatisfiable, and an
          # unsatisfiable gate is one nobody reads.
          ignore-unfixed: true
          # Without this the action leaves TRIVY_EXIT_CODE unset and Trivy exits
          # 0, so findings are printed and nothing acts on them. This step runs
          # after the image is pushed, so a failure here marks the release
          # rather than preventing publication — the blocking gate belongs in
          # the PR-phase build, before a vulnerable image is ever tagged.
          exit-code: '1'

      - name: Job summary
        if: always()
        run: |
          PR_IMAGE_EXISTS="${{ steps.pr-image.outputs.exists }}"
          STALE="${{ steps.freshness.outputs.stale }}"
          SIGNED="${{ steps.cosign-sign.outputs.signed }}"
          DIGEST="${{ steps.release-digest.outputs.digest }}"
          WAITED="${{ steps.pr-image.outputs.waited }}"
          GATE="${{ steps.pr-image.outputs.wait_gate }}"
          echo "## Container Release: \`${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$PR_IMAGE_EXISTS" = "true" ] && [ "$STALE" != "true" ]; then
            echo "- **Method**: Promoted from pre-built PR image (fast path)" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: \`${{ steps.version.outputs.next_image }}\`" >> $GITHUB_STEP_SUMMARY
            if [ "${WAITED:-0}" -gt 20 ]; then
              echo "- **Waited**: ${WAITED}s for the PR-phase build to finish pushing" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$PR_IMAGE_EXISTS" = "true" ] && [ "$STALE" = "true" ]; then
            echo "- **Method**: Full rebuild (PR image was stale — main moved between PR build and release)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Method**: Full rebuild (no pre-built PR image; wait gate: ${GATE:-n/a}, waited ${WAITED:-0}s)" >> $GITHUB_STEP_SUMMARY
            if [ "$GATE" = "unavailable" ]; then
              echo "- **Note**: the promote wait could not run — grant \`actions: read\` (and \`pull-requests: read\` on a private repo) to the calling job." >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ "$SIGNED" = "true" ]; then
            echo "- **Signing**: Signed with cosign (keyless/Sigstore)" >> $GITHUB_STEP_SUMMARY
            echo "- **Digest**: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Rekor**: [transparency log](https://search.sigstore.dev/?hash=${DIGEST})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Verify signature</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "cosign verify \\" >> $GITHUB_STEP_SUMMARY
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\" >> $GITHUB_STEP_SUMMARY
            echo "  --certificate-identity-regexp='https://github.com/laurigates/' \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/${{ inputs.image-name }}@${DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Tags**:" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
